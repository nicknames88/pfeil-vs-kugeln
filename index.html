<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pfeil vs. Kugeln</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: #070a10; color: #e8ecf5; user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Die Buehne fuellt das komplette Browserfenster. */
  #buehne { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #080b12;
           border: 0; cursor: crosshair; }

  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 24px;
         padding: calc(16px + env(safe-area-inset-top, 0px)) 22px 16px;
         font-size: 16px; pointer-events: none; text-shadow: 0 1px 4px #000; }
  #hud b { color: #fff; }
  #hud.aus { display: none; }        /* im Menü stört die Anzeige nur */
  .hpbalken { display: inline-block; width: 110px; height: 10px; vertical-align: -1px;
              background: rgba(0,0,0,.55); border: 1px solid #33415e; border-radius: 6px;
              overflow: hidden; }
  .hpbalken i { display: block; height: 100%; width: 100%; background: #7cff9d;
                transition: width .18s linear, background .3s; }
  .rechts { margin-left: auto; }

  /* --- Waffenleiste unten links --- */
  #waffenleiste { position: absolute; left: 0; bottom: 0; display: flex; gap: 8px;
                  padding: 16px 22px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #faehigkeitsleiste { position: absolute; right: 0; bottom: 0; display: flex; gap: 8px;
                       padding: 16px 22px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .fkslot { position: relative; width: 62px; height: 62px; border-radius: 12px; overflow: hidden;
            background: rgba(21,28,44,.85); border: 1px solid #27324a; display: flex;
            flex-direction: column; align-items: center; justify-content: center; gap: 1px;
            font: 600 9.5px system-ui, sans-serif; color: #8fa3c4; }
  .fkslot .z { font-size: 20px; line-height: 1; }
  .fkslot .taste { font-size: 8.5px; color: #6b7d99; }
  .fkslot.bereit { border-color: #7cff9d; color: #eaf4ff; }
  .fkslot .kuehlt { position: absolute; left: 0; right: 0; bottom: 0;
                    background: rgba(0,0,0,.62); }
  .fkslot.gesperrt { opacity: .45; }

  /* --- Werkstatt --- */
  .fkliste { display: grid; gap: 9px; margin-bottom: 14px; }
  .fk { display: flex; align-items: center; gap: 13px; padding: 11px 15px; border-radius: 11px;
        background: #151c2c; border: 1px solid #27324a; text-align: left; }
  .fk .zeichen { font-size: 26px; width: 34px; text-align: center; }
  .fk .mitte { flex: 1; }
  .fk .fkname { font-weight: 700; font-size: 14px; color: #cfdcf0; }
  .fk .fkinfo { font-size: 11.5px; color: #92a3bf; line-height: 1.45; }
  .fk .stufen { display: flex; gap: 4px; margin-top: 5px; }
  .fk .stufen i { width: 22px; height: 5px; border-radius: 3px; background: #27324a; }
  .fk .stufen i.voll { background: #7cff9d; }
  .fk .kaufen { padding: 9px 15px; border-radius: 9px; font: 600 12px system-ui, sans-serif;
                background: #1d2c44; border: 1px solid #3d5a8c; color: #cfe0ff; cursor: pointer;
                white-space: nowrap; }
  .fk .kaufen:disabled { opacity: .35; cursor: default; }
  .fk .kaufen.voll { border-color: #2f6b45; color: #7cff9d; background: #16301f; }
  .slot { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border-radius: 10px;
          background: rgba(21,28,44,.85); border: 1px solid #27324a; color: #8fa3c4;
          font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .slot:hover:not(.gesperrt) { border-color: #3d7dff; }
  .slot .nr { display: inline-block; min-width: 17px; padding: 2px 5px; border-radius: 5px;
              background: #27324a; color: #cfe0ff; font-size: 11px; text-align: center; }
  .slot.aktiv { border-color: #5fd0ff; background: rgba(30,48,74,.95); color: #eaf4ff;
                box-shadow: 0 0 12px rgba(95,208,255,.25); }
  .slot.aktiv .nr { background: #5fd0ff; color: #08131f; }
  .slot.gesperrt { opacity: .4; cursor: default; }
  .slot .mun { margin-left: 7px; font-size: 11px; color: #7f92b3; }
  .slot .mun.knapp { color: #ffd25c; }
  .slot.leer { opacity: .45; }
  .slot.leer .mun { color: #ff5c7a; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             background: rgba(7,10,16,.92); padding: 24px; overflow: auto; }
  #overlay.aus { display: none; }
  /* min-width: 0 ist wichtig: Ohne das weigert sich die Karte als Flex-Kind,
     unter die Breite ihres Inhalts zu schrumpfen - auf dem Handy stand dann
     die Hälfte außerhalb des Bildschirms. */
  .karte { width: 100%; max-width: 620px; min-width: 0; text-align: center; }
  .karte h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: .5px; }
  .titel { margin: 0 0 6px; font-size: clamp(34px, 6vw, 54px); font-weight: 800; letter-spacing: -.5px;
           background: linear-gradient(95deg, #5fd0ff, #a78bfa 52%, #ffd25c);
           -webkit-background-clip: text; background-clip: text; color: transparent; }
  .unterzeile { margin: 0 0 26px; color: #8fa3c4; font-size: 15px; }
  .tastenzeile { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
                 margin-bottom: 24px; color: #9fb0cc; font-size: 13px; }
  .tastenzeile > div { display: flex; align-items: center; gap: 7px; }
  kbd { display: inline-block; min-width: 22px; padding: 4px 7px; border-radius: 6px;
        background: #1c2538; border: 1px solid #34415e; border-bottom-width: 3px;
        font: 600 12px system-ui, sans-serif; color: #dbe6f7; text-align: center; }
  .gegnerzeile { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
                 margin-bottom: 26px; font-size: 11px; color: #8496b3; }
  .gegnerzeile > div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .knopfzeile { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .bestwert { display: inline-flex; gap: 20px; padding: 10px 20px; margin-bottom: 24px;
              background: #131a29; border: 1px solid #232d44; border-radius: 999px; font-size: 13px; }
  .bestwert b { color: #ffd25c; }
  .knopf:disabled { opacity: .35; cursor: default; }

  /* --- Waffenauswahl im Laden --- */
  .ausruestung { background: #101725; border: 1px solid #232d44; border-radius: 12px;
                 padding: 13px 15px; margin-bottom: 14px; }
  .awkopf { font-size: 12.5px; color: #9fb0cc; margin-bottom: 10px; text-align: left; }
  .awkopf b { color: #fff; }
  .awreihe { display: flex; flex-wrap: wrap; gap: 7px; }
  .wwahl { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 9px;
           background: #182031; border: 1px solid #2a3550; color: #8fa3c4;
           font: 600 12.5px system-ui, sans-serif; cursor: pointer; }
  .wwahl:hover { border-color: #3d7dff; }
  .wwahl .nr { display: inline-block; min-width: 16px; padding: 1px 4px; border-radius: 4px;
               background: #5fd0ff; color: #08131f; font-size: 10.5px; text-align: center; }
  .wwahl.aktiv { border-color: #5fd0ff; background: #1d2c44; color: #eaf4ff;
                 box-shadow: 0 0 10px rgba(95,208,255,.2); }
  .wwahl.voll { opacity: .32; cursor: default; }
  .wwahl .gew { font-size: 10.5px; color: #ffd25c; margin-left: 2px; }
  .lastbalken { height: 9px; border-radius: 5px; background: rgba(0,0,0,.5);
                border: 1px solid #2a3550; overflow: hidden; margin: 0 0 11px; }
  .lastbalken i { display: block; height: 100%; transition: width .2s; }
  .wwahl.voll:hover { border-color: #2a3550; }

  /* --- Forschungsbaum --- */
  .karte.breit { max-width: 1240px; }
  .baumkopf { display: flex; align-items: center; gap: 12px; justify-content: center;
              flex-wrap: wrap; margin-bottom: 14px; }
  .baumflaeche { position: relative; overflow: auto; max-height: 58vh; padding: 14px;
                 background: #0b0f19; border: 1px solid #232d44; border-radius: 12px; }
  .bauminhalt { position: relative; }
  .tk { position: absolute; width: 162px; height: 50px; padding: 7px 10px; border-radius: 9px;
        display: flex; flex-direction: column; justify-content: center; gap: 2px; text-align: left;
        background: #151c2c; border: 1px solid #2a3550; border-left-width: 3px;
        color: #8fa3c4; font: inherit; cursor: pointer; }
  .tk .tkname  { font-weight: 600; font-size: 12.5px; color: #cfdcf0; line-height: 1.2; }
  .tk .tkpreis { font-size: 11px; color: #ffd25c; }
  .tk.waffe    { border-left-color: #5fd0ff; }
  .tk.passiv   { border-left-color: #ffb35c; }
  .tk.schild   { border-left-color: #7cff9d; }
  .tk.labor    { border-left-color: #c78bff; }
  .tk.labor .tkpreis { color: #d9b3ff; }
  .tk.labor.gekauft  { background: #241a36; border-color: #6b4a9c; border-left-color: #c78bff; }
  .reiter { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .reiter button { padding: 9px 20px; border-radius: 10px; font: 600 13px system-ui, sans-serif;
                   background: #151c2c; border: 1px solid #2a3550; color: #8fa3c4; cursor: pointer; }
  .reiter button.aktiv { background: #1d2c44; border-color: #5fd0ff; color: #eaf4ff; }
  .reiter button:disabled { opacity: .35; cursor: default; }
  .stufenband { display: flex; gap: 5px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .stufenband div { padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
                    background: #131a29; border: 1px solid #232d44; color: #6b7d99; }
  .stufenband div.erreicht { color: #cfdcf0; border-color: #3d5a8c; }
  .stufenband div.jetzt { background: #1d2c44; border-color: #5fd0ff; color: #eaf4ff; }
  .stufenband div.waehlbar { cursor: pointer; }
  .stufenband div.waehlbar:hover { border-color: #5fd0ff; color: #eaf4ff; background: #17202f; }
  .stufenband div.zu { opacity: .45; }
  .liste { text-align: left; max-width: 420px; margin: 0 auto 16px; }
  .liste div { display: flex; justify-content: space-between; padding: 6px 12px; border-radius: 7px;
               font-size: 13px; color: #9fb0cc; }
  .liste div:nth-child(odd) { background: #131a29; }
  .liste b { color: #ffd25c; }
  .tk.gekauft  { background: #14301e; border-color: #2f6b45; border-left-color: #4ade80; }
  .tk.gekauft .tkpreis { color: #7cff9d; }
  .tk.kaufbar  { box-shadow: 0 0 0 1px rgba(95,208,255,.25); }
  .tk.kaufbar:hover { background: #1b2540; border-color: #5fd0ff; }
  .tk.zuteuer  { opacity: .6; cursor: default; }
  .tk.zuteuer .tkpreis { color: #ff7b8f; }
  .tk.gesperrt { opacity: .3; cursor: default; }
  .legende { display: flex; gap: 18px; justify-content: center; margin-top: 12px;
             font-size: 11px; color: #7d8ea9; }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .karte h2 { margin: 0 0 6px; font-size: 24px; }
  .karte p  { margin: 6px 0 18px; color: #9fb0cc; line-height: 1.6; font-size: 14px; }
  .waren { display: grid; gap: 8px; margin-bottom: 18px; }
  .ware { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px;
          background: #151c2c; border: 1px solid #27324a; border-radius: 10px; cursor: pointer;
          color: inherit; font: inherit; }
  .ware:hover:not(:disabled) { background: #1c2538; border-color: #3d7dff; }
  .ware:disabled { opacity: .4; cursor: default; }
  .ware .name { font-weight: 600; }
  .ware .info { font-size: 12px; color: #92a3bf; }
  .ware .preis { margin-left: auto; color: #ffd25c; font-weight: 600; white-space: nowrap; }
  .slot .sym, .wwahl .sym { margin-right: 5px; font-size: 13px; }

  /* --- Handy und Tablet --------------------------------------------------
     Auf Tippgeräten darf die Seite weder wackeln noch zoomen, und alles zum
     Antippen muss groß genug für einen Daumen sein. */
  .standfeld { width: 100%; margin-bottom: 10px; padding: 10px 12px; border-radius: 10px;
               background: #0d1320; border: 1px solid #27324a; color: #9fb0cc;
               font: 500 11px ui-monospace, Menlo, monospace; resize: vertical;
               word-break: break-all; }
  .standfeld:focus { outline: 2px solid #4d9dff; color: #cfdcf0; }

  body.tippen { touch-action: none; overscroll-behavior: none; }
  body.tippen textarea, body.tippen #overlay { touch-action: auto; }
  body.tippen #buehne, body.tippen canvas { touch-action: none; }
  body.tippen .slot { padding: 12px 15px; font-size: 14px; }
  body.tippen .fkslot { width: 66px; height: 66px; }
  body.tippen #hudPause { display: block; }
  #hudPause { display: none; cursor: pointer; font-size: 17px; }

  /* Auf Tippgeräten liegen die Daumen unten links und unten rechts - genau
     dort, wo sonst die Waffenleiste liegt. Also wandert sie nach oben. */
  body.tippen #waffenleiste { top: 44px; bottom: auto; padding: 6px 10px; gap: 6px;
                              max-width: 100%; }
  body.tippen #faehigkeitsleiste { bottom: auto; top: 40px; right: 0; padding: 6px 10px; }

  /* Schmale Bildschirme: Karten untereinander statt nebeneinander. */
  @media (max-width: 900px) {
    #overlay { padding: 10px; align-items: flex-start; }
    .karte, .karte.breit { max-width: 100%; }
    .karte.start { padding: 16px 14px 14px; }
    .ladenliste { grid-template-columns: 1fr; }
    .waren, .fkliste { font-size: 13px; }
    .tastenzeile { display: none; }             /* Tastenhilfe nützt hier nichts */
    .werte > div { min-width: 74px; padding: 6px 9px; }
    .werte b { font-size: 17px; }
    .reiter { flex-wrap: wrap; }
    #waffenleiste { overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start;
                    scrollbar-width: none; }
    #waffenleiste::-webkit-scrollbar { display: none; }
    #hud { gap: 9px; font-size: 11.5px; padding: 8px 10px; flex-wrap: nowrap;
           overflow: hidden; white-space: nowrap; }
    #hud .hpbalken { width: 60px; }
    .fkslot { width: 54px; height: 54px; }
    body.tippen .fkslot { width: 54px; height: 54px; }
    .standfeld { font-size: 10px; }
    h2 { font-size: 21px; }
    /* Auf dem Handy nur das Nötigste in der Kopfzeile */
    #hudDaten, #hudBauteile, #hudGlut { display: none !important; }
  }

  /* Ganz schmal (Handy hochkant): noch strenger aussieben. */
  @media (max-width: 500px) {
    #hudMuenzenBox { display: none; }
    .karte.start .titel { font-size: 30px; }
    .werte > div { min-width: 66px; padding: 5px 8px; }
    .werte b { font-size: 15px; }
    .gegnerzeile { display: none; }        /* die Galerie frisst zu viel Platz */
  }
  .todesgrund { margin: 0 0 16px; padding: 10px 16px; display: inline-block;
                border-radius: 12px; font-size: 14.5px; font-weight: 600; color: #ffb3bf;
                background: #2a141a; border: 1px solid #5c2733; }

  /* --- Schmiede, Arsenal und die Fallen der Werkstatt --- */
  .ladenliste { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
                gap: 10px; margin-bottom: 12px; }
  .ladenware { display: flex; flex-direction: column; gap: 6px; text-align: left;
               padding: 12px 14px; border-radius: 12px; font: inherit; cursor: pointer;
               background: #131a29; border: 1px solid #23304a; color: #cfdcf0; }
  .ladenware.kaufbar:hover { border-color: #ff9d5c; background: #1a2233; }
  .ladenware.zuteuer { opacity: .55; cursor: default; }
  .ladenware.gekauft { border-color: #2e7d4f; background: #121f18; cursor: default; }
  .ladenware .lwname { font-weight: 700; font-size: 15px; }
  .ladenware .lwinfo { font-size: 12px; color: #92a3bf; line-height: 1.45; }
  .ladenware .lwfuss { display: flex; justify-content: space-between; align-items: center;
                       gap: 10px; margin-top: 2px; font-size: 11.5px; }
  .ladenware .lwdaten { color: #7f92b3; }
  .ladenware .lwpreis { font-weight: 700; color: #ff9d5c; white-space: nowrap; }
  .ladenware.gekauft .lwpreis { color: #7cff9d; }

  .knopf { padding: 12px 28px; font: inherit; font-weight: 600; color: #061020; cursor: pointer;
           background: #4d9dff; border: 0; border-radius: 10px; }
  .knopf:hover { background: #6bb0ff; }

  /* --- Startbildschirm ---------------------------------------------------
     Im Menü bleibt der Schleier durchsichtiger, damit man den bewegten
     Hintergrund sieht. Lesbar bleibt alles trotzdem, weil die Karte selbst
     eine eigene dunkle Scheibe bekommt. */
  #overlay.menue { background: radial-gradient(ellipse at center,
                     rgba(7,10,16,.55) 0%, rgba(7,10,16,.80) 65%, rgba(7,10,16,.92) 100%); }
  .karte.start { max-width: 680px; padding: 22px 28px 20px; border-radius: 22px;
                 background: rgba(11,16,27,.78); border: 1px solid #1f2a42;
                 box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(95,208,255,.05) inset;
                 backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  .karte.start .pfeillogo { filter: drop-shadow(0 0 14px rgba(95,208,255,.55)); margin-bottom: 2px; }
  .karte.start .titel { font-size: clamp(32px, 5.6vw, 50px); margin-bottom: 2px; }
  .titelstrich { width: 96px; height: 3px; margin: 0 auto 10px; border-radius: 2px;
                 background: linear-gradient(90deg, transparent, #5fd0ff, #a78bfa, transparent); }

  .werte { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .werte > div { min-width: 84px; padding: 7px 12px; border-radius: 12px;
                 background: #121a2a; border: 1px solid #23304a; }
  .werte b { display: block; font-size: 19px; line-height: 1.15; color: #ffd25c; }
  .werte span { font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; color: #7f92b3; }
  .werte .blau b { color: #5fd0ff; }
  .werte .lila b { color: #c78bff; }

  .stufenziel { margin: 0 0 12px; font-size: 12px; color: #8fa3c4; }
  .zielbalken { display: block; height: 8px; margin: 9px auto 0; max-width: 340px;
                border-radius: 4px; box-shadow: inset 0 0 0 1px #26324c; overflow: hidden;
                background-color: #131b2b; }
  .zielbalken i { display: block; height: 100%; border-radius: 4px;
                  background: linear-gradient(90deg, #4d9dff, #a78bfa); }

  .knopf.gross { padding: 13px 32px; font-size: 16px; border-radius: 13px;
                 box-shadow: 0 8px 26px rgba(77,157,255,.35); }
  .knopf.gross:hover { transform: translateY(-1px); box-shadow: 0 11px 30px rgba(77,157,255,.45); }
  .knopf.leise { background: #1b2540; color: #cfe0ff; box-shadow: none;
                 border: 1px solid #2c3a5c; padding: 10px 20px; font-size: 14px; }
  .knopf.leise:hover { background: #24304f; border-color: #3f5580; }
  .karte.start .tastenzeile { gap: 12px; font-size: 11.5px; margin: 14px 0 0; opacity: .75; }
  .karte.start .gegnerzeile { margin-bottom: 14px; gap: 6px; font-size: 10px; }

  /* Der Pfeil wippt leicht, damit der Kopf nicht tot wirkt. */
  @keyframes wippen { 0%,100% { transform: translateY(0) rotate(0deg); }
                      50%     { transform: translateY(-7px) rotate(-3deg); } }
  .karte.start .pfeillogo { animation: wippen 3.4s ease-in-out infinite; }

  /* Ein Glanz wandert langsam über die Schrift. */
  @keyframes glanz { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
  .karte.start .titel { background: linear-gradient(95deg,
      #5fd0ff, #a78bfa 28%, #ffd25c 45%, #a78bfa 62%, #5fd0ff 100%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
      color: transparent; animation: glanz 7s linear infinite; }

  /* Gegner als kleine Kärtchen statt loser Bildchen. */
  .gegnerzeile > div { padding: 6px 5px 5px; border-radius: 10px; min-width: 56px;
                       background: #111827; border: 1px solid #1f2940; transition: .15s; }
  .gegnerzeile > div[title]:hover { border-color: #3d5a8c; background: #162033;
                                    transform: translateY(-2px); }

  .karte.start .zuletztzeile { margin: 0 0 12px; }
  .zuletzt { display: inline-flex; align-items: center; gap: 9px; margin: 0;
             padding: 7px 15px; border-radius: 999px; font-size: 12px; color: #9fb0cc;
             background: #101828; border: 1px solid #1e2942; }
  .zuletzt b { color: #cfdcf0; }
</style>
</head>
<body>

<div id="buehne">
  <canvas id="leinwand" width="960" height="600"></canvas>

  <div id="hud">
    <div>HP <span class="hpbalken"><i id="hudHpFuellung"></i></span> <b id="hudHp">100</b></div>
    <div>Level <b id="hudLevel">1</b></div>
    <div>Gegner <b id="hudGegner">0</b></div>
    <div id="hudMuenzenBox">Münzen <b id="hudMuenzen">0</b></div>
    <div id="hudDaten" style="color:#c78bff">⚗ <b>0</b></div>

             - Bildschirmkoord. = wo es auf dem Canvas landet

  const liste = ['kugel'];
  for (const ab in ARTEN_AB) if (level >= +ab) liste.push(ARTEN_AB[ab]);

}

// Welche Ausbaustufe einer Fähigkeit man besitzt (0 = gar nicht).
function faehigkeitStufe(id) {
  const f = fortschritt.faehigkeiten && fortschritt.faehigkeiten[id];
  return f || 0;
}
function faehigkeitWerte(id) {
  const stufe = faehigkeitStufe(id);
  return stufe > 0 ? FAEHIGKEITEN[id].stufen[stufe - 1] : null;
}
function besesseneFaehigkeiten() {
  return FAEHIGKEITEN_REIHENFOLGE.filter(id => faehigkeitStufe(id) > 0);
}

function stufeVon(level) {
  for (const st of STUFEN) if (level >= st.von && level <= st.bis) return st;

}
function stufeNr(level) { return stufeVon(level).nr; }

// ============================================================================
// Die Karten
// Mauern sind einfache Rechtecke. Sie blockieren dich, die Gegner UND alle
// Schüsse - dadurch kann man sich hinter ihnen in Deckung bringen.
// Angaben in Anteilen der Weltgröße (0 = links/oben, 1 = rechts/unten),
// damit die Karten unabhängig von WELT funktionieren.
// ============================================================================
function rel(x, y, b, h) {
  return { x: x * WELT.b, y: y * WELT.h, b: b * WELT.b, h: h * WELT.h };
}

// ---------------------------------------------------------------------------
// Kartengenerator
//
// Jedes Level bekommt eine frisch gewürfelte Karte. Der Haken dabei: Zufall
// kann Räume erzeugen, in die man nicht hinein- oder aus denen man nicht
// herauskommt. Spawnt dort ein Gegner, lässt sich das Level nie beenden.
//
// Deshalb wird JEDE Karte vor der Freigabe geprüft: Wir legen dasselbe Raster
// darüber, das auch die Wegfindung benutzt, laufen von deiner Startposition
// aus einmal überall hin und schauen, ob wirklich jede freie Zelle erreichbar
// ist. Ist sie es nicht, wird die Karte verworfen und neu gewürfelt.
// ---------------------------------------------------------------------------

// Räumt alle Mauern weg, die deinem Startplatz in der Mitte im Weg stehen.
function mitteFreiraeumen(liste, radius) {
  const mx = WELT.b / 2, my = WELT.h / 2, r = radius || 190;
  return liste.filter(m => !(mx + r > m.x && mx - r < m.x + m.b &&
                             my + r > m.y && my - r < m.y + m.h));
}

// Baut eine Wand mit ein oder zwei Durchgängen. Dadurch kann eine Querwand
// nie den Weg komplett versperren.
function wandMitTueren(pos, dicke, senkrecht, tueren) {
  const stuecke = [];
  const stellen = [];
  for (let t = 0; t < tueren; t++) stellen.push(zufall(.14, .86));
  stellen.sort((a, b) => a - b);
  let start = 0;
  for (const st of stellen) {
    const breite = zufall(.10, .16);
    const bis = grenze(st - breite / 2, 0, 1);
    if (bis - start > .05)
      stuecke.push(senkrecht ? rel(pos, start, dicke, bis - start)
                             : rel(start, pos, bis - start, dicke));
    start = grenze(st + breite / 2, 0, 1);
  }
  if (1 - start > .05)
    stuecke.push(senkrecht ? rel(pos, start, dicke, 1 - start)
                           : rel(start, pos, 1 - start, dicke));
  return stuecke;
}

// Spiegelt die fertige Karte zufällig. Kostet nichts und lässt dieselbe
// Grundform viermal anders aussehen.
function zufaelligSpiegeln(mauern) {
  const sx = Math.random() < .5, sy = Math.random() < .5;
  if (!sx && !sy) return mauern;
  return mauern.map(m => ({
    x: sx ? WELT.b - m.x - m.b : m.x,
    y: sy ? WELT.h - m.y - m.h : m.y,
    b: m.b, h: m.h,
  }));
}

// Merkt sich die zuletzt gespielten Biome, damit nicht dreimal hintereinander
// dieselbe Landschaft kommt.
let letzteBiome = [];

function biomWaehlen(level) {
  const offen = BIOME.filter(b => b.abStufe <= stufeNr(level));
  const frei  = offen.filter(b => letzteBiome.indexOf(b.id) < 0);
  const wahl  = (frei.length ? frei : offen)[Math.floor(Math.random() * (frei.length ? frei.length : offen.length))];
  letzteBiome.push(wahl.id);
  if (letzteBiome.length > Math.min(3, offen.length - 1)) letzteBiome.shift();
  return wahl;
}

function biomVon(id) { return BIOME.find(b => b.id === id) || BIOME[0]; }

// Streuteile: hübsche Kleinigkeiten am Boden. Sie werden einmal pro Karte
// gewürfelt und liegen dann fest - sonst würden sie bei jedem Bild zappeln.
// Innerhalb von Mauern lassen wir sie weg, das sähe komisch aus.
// Große, weiche Farbflecken im Boden. Ohne sie wirkt der Boden wie eine
// einfarbige Fläche - mit ihnen sieht er aus wie echter Untergrund.
function fleckenStreuen() {
  const liste = [];
  for (let i = 0; i < 34; i++)
    liste.push({ x: zufall(0, WELT.b), y: zufall(0, WELT.h), r: zufall(280, 720) });
  return liste;
}

function dekoStreuen(biom, mauern) {
  const liste = [];
  for (let i = 0; i < biom.dekoAnzahl; i++) {
    const x = zufall(40, WELT.b - 40), y = zufall(40, WELT.h - 40);
    let drin = false;
    for (const m of mauern)
      if (x > m.x - 6 && x < m.x + m.b + 6 && y > m.y - 6 && y < m.y + m.h + 6) { drin = true; break; }
    if (drin) continue;
    liste.push({ x, y, g: zufall(.7, 1.6), d: zufall(0, Math.PI * 2) });
  }
  return liste;
}

// Steckt ein Kreis in einer bestimmten Mauerliste? (Wie stecktFest, aber
// für eine Liste, die noch gar nicht im Spiel ist.)
function stecktFestIn(mauern, x, y, r) {
  for (const h of mauern) {
    const nx = grenze(x, h.x, h.x + h.b);
    const ny = grenze(y, h.y, h.y + h.h);
    const dx = x - nx, dy = y - ny;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

// Die entscheidende Prüfung: Ist von der Mitte aus wirklich jede freie
// Stelle erreichbar? Nur dann kann kein Gegner unerreichbar eingesperrt sein.
function alleErreichbar(mauern, radius) {
  const b = Math.ceil(WELT.b / RASTER), h = Math.ceil(WELT.h / RASTER);
  const frei = new Uint8Array(b * h);
  let anzahlFrei = 0;
  for (let j = 0; j < h; j++)
    for (let i = 0; i < b; i++) {
      const x = i * RASTER + RASTER / 2, y = j * RASTER + RASTER / 2;
      if (!stecktFestIn(mauern, x, y, radius)) { frei[j * b + i] = 1; anzahlFrei++; }
    }

  const si = Math.floor(WELT.b / 2 / RASTER), sj = Math.floor(WELT.h / 2 / RASTER);
  const start = sj * b + si;
  if (!frei[start]) return false;             // Startplatz selbst versperrt

  const gesehen = new Uint8Array(b * h);
  const schlange = new Int32Array(b * h);
  let kopf = 0, ende = 0, erreicht = 0;
  schlange[ende++] = start; gesehen[start] = 1; erreicht++;
  while (kopf < ende) {
    const z = schlange[kopf++];
    const i = z % b, j = (z - i) / b;
    for (let n = 0; n < 4; n++) {             // nur gerade Nachbarn - streng
      const di = [1,-1,0,0][n], dj = [0,0,1,-1][n];
      const ni = i + di, nj = j + dj;
      if (ni < 0 || nj < 0 || ni >= b || nj >= h) continue;
      const nz = nj * b + ni;
      if (gesehen[nz] || !frei[nz]) continue;
      gesehen[nz] = 1; erreicht++;
      schlange[ende++] = nz;
    }
  }
  return erreicht === anzahlFrei;
}

let kartenZaehler = 0;
// Merkt sich die zuletzt benutzten Stile, damit sich nichts direkt wiederholt.
let letzteStile = [];

function stilWaehlen(stile) {
  const frei = stile.filter(st => letzteStile.indexOf(st.name) < 0);
  const auswahl = frei.length ? frei : stile;
  return auswahl[Math.floor(Math.random() * auswahl.length)];
}

function karteBauen(level) {
  const boss = level % 10 === 0;
  const stile = boss ? BOSS_STILE : KARTEN_STILE;

  for (let versuch = 0; versuch < 30; versuch++) {
    const stil = stilWaehlen(stile);
    // Jede Karte hat eine eigene Grunddichte - mal luftig, mal voll.
    const dichte = zufall(.6, 1.35);
    let mauern = stil.bauen(dichte);

    // Bei normalen Karten wird oft ein zweiter Stil daruntergemischt.
    // Erst dadurch entstehen Formen, die man nicht wiedererkennt.
    let zweitName = '';
    if (!boss && Math.random() < .45) {
      const zweit = stile[Math.floor(Math.random() * stile.length)];
      if (zweit !== stil) {
        const extra = zweit.bauen(zufall(.35, .7)).filter(() => Math.random() < .6);
        if (extra.length) { mauern = mauern.concat(extra); zweitName = ' & ' + zweit.name; }
      }
    }

    mauern = zufaelligSpiegeln(mauern);
    mauern = mitteFreiraeumen(mauern, boss ? 260 : 190);
    mauern = mauern.filter(m => m.b > 15 && m.h > 15 &&
                                m.x >= 0 && m.y >= 0 &&
                                m.x + m.b <= WELT.b && m.y + m.h <= WELT.h);
    // Der wichtigste Wert im ganzen Generator: Er MUSS exakt dem entsprechen,
    // mit dem rasterAufbauen() später das echte Wegraster baut. Ist er auch
    // nur ein bisschen kleiner, hält die Prüfung Karten für begehbar, in denen
    // das Spiel dann doch abgeschnittene Ecken hat.
    if (!alleErreichbar(mauern, RASTER * .55)) continue;
    // Bosse sind bis zu 66 px dick - für sie zusätzlich mit mehr Luft prüfen.
    if (boss && !alleErreichbar(mauern, 85)) continue;

    kartenZaehler++;
    letzteStile.push(stil.name);
    if (letzteStile.length > (boss ? 2 : 3)) letzteStile.shift();

    const biom = biomWaehlen(level);
    return {
      name: stil.name + zweitName,
      info: stil.info,
      biom: biom.id,
      // Ab und zu geht das Licht aus - dann hilft nur die Taschenlampe.
      // Wie oft das passiert, bestimmt das Biom: in der Höhle fast immer,
      // in der Wüste so gut wie nie.
      dunkel: !boss && Math.random() < biom.dunkelChance,
      deko: dekoStreuen(biom, mauern),
      flecken: fleckenStreuen(),
      mauern,
      nummer: kartenZaehler,
      bauen() { return this.mauern; },
    };
  }
  // Sollte nie passieren - zur Sicherheit ein leeres Feld.
  return { name: 'Freies Feld', info: 'Keine Deckung. Nur du und die Gegner.',
           biom: 'stahl', deko: [], flecken: [],
           dunkel: false, mauern: [], nummer: ++kartenZaehler, bauen() { return []; } };
}

// Damit die Vorschau im Laden und das Level dieselbe Karte zeigen, wird jede
// Karte nur einmal gewürfelt und dann gemerkt.
let gemerkteKarte = null;
function karteFuer(level) {
  if (!gemerkteKarte || gemerkteKarte.level !== level)
    gemerkteKarte = { level, karte: karteBauen(level) };
  return gemerkteKarte.karte;
}

// ============================================================================
// Klang
// Alle Geräusche werden live berechnet - keine einzige Audiodatei. Ein Ton
// ist ein Oszillator mit einer Lautstärkekurve, ein Knall ist gefiltertes
// Rauschen. Browser lassen Ton erst nach der ersten Eingabe zu, deshalb
// startet die Tonausgabe beim ersten Klick oder Tastendruck.
// ============================================================================
const KLANG = {
  an: true, ctx: null, meister: null, trocken: null, hallWeg: null,
  rauschPuffer: null, saettigung: null,
  dauerQuelle: null, dauerArt: null, letzte: {},

  starten() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();

    this.meister = c.createGain();
    this.meister.gain.value = .3;
    this.meister.connect(c.destination);

    // Direkter Weg (ohne Hall)
    this.trocken = c.createGain();
    this.trocken.gain.value = 1;
    this.trocken.connect(this.meister);

    // Nachhall: ein künstlicher Raum. Die "Impulsantwort" ist einfach
    // Rauschen, das exponentiell leiser wird - das klingt wie eine Halle.
    // Ohne Hall wirkt jeder Klang wie im Kopfhörer angeklebt.
    const hallLaenge = Math.floor(c.sampleRate * 1.1);
    const raum = c.createBuffer(2, hallLaenge, c.sampleRate);
    for (let kanal = 0; kanal < 2; kanal++) {
      const daten = raum.getChannelData(kanal);
      for (let i = 0; i < hallLaenge; i++)
        daten[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / hallLaenge, 2.8);
    }
    const hall = c.createConvolver();
    hall.buffer = raum;
    const hallLaut = c.createGain();
    hallLaut.gain.value = .5;
    hall.connect(hallLaut); hallLaut.connect(this.meister);
    this.hallWeg = c.createGain();
    this.hallWeg.gain.value = .22;          // so viel von jedem Klang geht in den Raum
    this.hallWeg.connect(hall);

    // Sättigung: leichtes Übersteuern gibt Wumms. Echte Explosionen und
    // Schüsse sind nie sauber - genau das macht den Unterschied.
    this.saettigung = c.createWaveShaper();
    const kurve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) kurve[i] = Math.tanh((i / 512 - 1) * 2.4);
    this.saettigung.curve = kurve;
    this.saettigung.connect(this.trocken);
    this.saettigung.connect(this.hallWeg);

    // Rauschvorrat für alle Knallgeräusche
    const laenge = c.sampleRate;
    this.rauschPuffer = c.createBuffer(1, laenge, c.sampleRate);
    const daten = this.rauschPuffer.getChannelData(0);
    for (let i = 0; i < laenge; i++) daten[i] = Math.random() * 2 - 1;
  },

  bereit() {
    if (!this.an || !this.ctx) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },

  zuFrueh(name, abstand) {
    if (!this.ctx || !this.an) return true;
    const jetzt = this.ctx.currentTime;
    if (this.letzte[name] !== undefined && jetzt - this.letzte[name] < abstand) return true;
    this.letzte[name] = jetzt;
    return false;
  },

  // Wohin ein Klang geht: Stereo-Panorama und leiser mit der Entfernung.
  // Ohne x/y kommt er direkt aus der Mitte (Menügeräusche, eigene Waffen).
  ausgang(x, y, verzerrt) {
    const c = this.ctx;
    const g = c.createGain();
    let laut = 1;
    if (x !== undefined && typeof spieler === 'object' && spieler) {
      const dx = x - spieler.x, dy = y - spieler.y;
      const d = Math.hypot(dx, dy);
      laut = Math.max(0, 1 - d / 1500);
      laut *= laut;                          // fernes wird deutlich leiser
      if (laut < .02) return null;           // zu weit weg: gar nicht erst erzeugen
      if (c.createStereoPanner) {
        const p = c.createStereoPanner();
        p.pan.value = Math.max(-.9, Math.min(.9, dx / 750));
        g.connect(p);
        p.connect(verzerrt ? this.saettigung : this.trocken);
        if (!verzerrt) p.connect(this.hallWeg);
        return { ein: g, laut };
      }
    }
    g.connect(verzerrt ? this.saettigung : this.trocken);
    if (!verzerrt) g.connect(this.hallWeg);
    return { ein: g, laut };
  },

  // --- Bausteine ------------------------------------------------------------
  // Ein Ton mit sehr schnellem Anschlag. Echte Geräusche setzen in ein bis
  // zwei Millisekunden ein, nicht in zehn - das macht sie "hart".
  ton(o) {
    if (!this.bereit()) return;
    const ziel = this.ausgang(o.x, o.y, o.verzerrt);
    if (!ziel) return;
    const c = this.ctx, t = c.currentTime + (o.verzug || 0);
    const q = c.createOscillator(), g = c.createGain();
    q.type = o.form || 'sine';
    q.frequency.setValueAtTime(o.von, t);
    if (o.bis && o.bis !== o.von)
      q.frequency.exponentialRampToValueAtTime(Math.max(1, o.bis), t + o.dauer);
    const laut = o.laut * ziel.laut;
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(laut, t + .0015);
    g.gain.exponentialRampToValueAtTime(.0001, t + o.dauer);
    q.connect(g); g.connect(ziel.ein);
    q.start(t); q.stop(t + o.dauer + .03);
  },

  // Gefiltertes Rauschen - der Rohstoff für Knall, Zischen und Trümmer.
  // guete (Q) macht den Filter resonant, das klingt metallisch.
  rauschen(o) {
    if (!this.bereit()) return;
    const ziel = this.ausgang(o.x, o.y, o.verzerrt);
    if (!ziel) return;
    const c = this.ctx, t = c.currentTime + (o.verzug || 0);
    const q = c.createBufferSource();
    q.buffer = this.rauschPuffer;
    q.playbackRate.value = .8 + Math.random() * .4;    // nie zweimal dasselbe Rauschen
    const f = c.createBiquadFilter();
    f.type = o.typ || 'lowpass';
    f.frequency.setValueAtTime(o.von, t);
    if (o.bis && o.bis !== o.von)
      f.frequency.exponentialRampToValueAtTime(Math.max(30, o.bis), t + o.dauer);
    if (o.guete) f.Q.value = o.guete;
    const g = c.createGain();
    const laut = o.laut * ziel.laut;
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(laut, t + (o.anstieg || .001));
    g.gain.exponentialRampToValueAtTime(.0001, t + o.dauer);
    q.connect(f); f.connect(g); g.connect(ziel.ein);
    q.start(t); q.stop(t + o.dauer + .03);
  },

  // Dauergeräusche mit langsam wandernder Klangfarbe, damit sie leben.
  dauerton(art) {
    if (!this.ctx) return;
    if (this.dauerArt === art) return;
    if (this.dauerQuelle) {
      const g = this.dauerQuelle.g, t = this.ctx.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .08);
      this.dauerQuelle.quellen.forEach(q => q.stop(t + .12));
      this.dauerQuelle = null;
    }
    this.dauerArt = art;
    if (!art || !this.bereit()) return;

    const c = this.ctx, t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t);
    const f = c.createBiquadFilter();
    const quellen = [];

    // Langsame Schwankung der Filterfrequenz - ohne die klingt ein Dauerton
    // wie ein Fiepen, mit ihr wie ein arbeitendes Gerät.
    const lfo = c.createOscillator(), lfoTiefe = c.createGain();
    lfo.type = 'sine';
    lfo.connect(lfoTiefe); lfoTiefe.connect(f.frequency);
    quellen.push(lfo);

    if (art === 'laser') {
      f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 3.5;
      lfo.frequency.value = 7.5; lfoTiefe.gain.value = 380;
      [116, 117.4, 233].forEach(hz => {
        const o = c.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = hz;
        o.connect(f); o.start(t); quellen.push(o);
      });
      const zisch = c.createBufferSource();               // Energiezischen darüber
      zisch.buffer = this.rauschPuffer; zisch.loop = true;
      const zf = c.createBiquadFilter();
      zf.type = 'bandpass'; zf.frequency.value = 3200; zf.Q.value = 2;
      const zg = c.createGain(); zg.gain.value = .35;
      zisch.connect(zf); zf.connect(zg); zg.connect(g);
      zisch.start(t); quellen.push(zisch);
      g.gain.linearRampToValueAtTime(.11, t + .04);
    } else {
      f.type = 'lowpass'; f.frequency.value = 780; f.Q.value = 1.4;
      lfo.frequency.value = 4.2; lfoTiefe.gain.value = 320;
      const q = c.createBufferSource();
      q.buffer = this.rauschPuffer; q.loop = true; q.playbackRate.value = .55;
      q.connect(f); q.start(t); quellen.push(q);
      const knistern = c.createBufferSource();            // Feuerknistern obendrauf
      knistern.buffer = this.rauschPuffer; knistern.loop = true;
      const kf = c.createBiquadFilter();
      kf.type = 'bandpass'; kf.frequency.value = 2400; kf.Q.value = 1.2;
      const kg = c.createGain(); kg.gain.value = .22;
      knistern.connect(kf); kf.connect(kg); kg.connect(g);
      knistern.start(t); quellen.push(knistern);
      g.gain.linearRampToValueAtTime(.17, t + .05);
    }
    lfo.start(t);
    f.connect(g);
    g.connect(this.saettigung);
    g.connect(this.hallWeg);
    this.dauerQuelle = { g, quellen };
  },

  // --- Die Geräusche --------------------------------------------------------
  // Jeder Schuss besteht aus drei Schichten: dem Anriss (Knack), dem Körper
  // (das metallische Krachen) und dem Druck (tiefer Abfall). Alle drei mit
  // etwas Zufall, damit Dauerfeuer nicht wie eine Endlosschleife klingt.
  schuss(w) {
    const schnell = (w.takt || .3) < .15;
    if (this.zuFrueh('schuss', schnell ? .045 : .026)) return;
    const kaliber = schnell ? .6 : 1;
    const streu = .88 + Math.random() * .24;
    this.rauschen({ dauer: .014, laut: .42 * kaliber, von: 9000 * streu, bis: 2600, typ: 'highpass' });
    this.rauschen({ dauer: .075 * kaliber, laut: .4 * kaliber, von: 1700 * streu, bis: 320,
                    typ: 'bandpass', guete: 1.3, verzerrt: true });
    this.ton({ von: 148 * streu, bis: 46, dauer: .085 * kaliber, laut: .3 * kaliber,
               form: 'sine', verzerrt: true });
  },
  // Nahkampf: ein Zischen beim Schwung, ein satter Aufprall beim Treffer.
  nahkampf(getroffen) {
    if (this.zuFrueh('nahkampf', .04)) return;
    const streu = .9 + Math.random() * .2;
    this.rauschen({ dauer: .11, laut: .30, von: 5200 * streu, bis: 900,
                    typ: 'bandpass', guete: .9 });
    if (!getroffen) return;
    this.rauschen({ dauer: .06, laut: .42, von: 900 * streu, bis: 160,
                    typ: 'lowpass', verzerrt: true });
    this.ton({ von: 190 * streu, bis: 55, dauer: .11, laut: .34,
               form: 'triangle', verzerrt: true });
  },
  sniper() {
    // Trockener Knall mit langem Nachhall - typisch für ein schweres Gewehr.
    this.rauschen({ dauer: .016, laut: .55, von: 10000, bis: 3000, typ: 'highpass' });
    this.rauschen({ dauer: .13, laut: .5, von: 2200, bis: 260, typ: 'bandpass', guete: 1.1, verzerrt: true });
    this.ton({ von: 132, bis: 40, dauer: .22, laut: .38, form: 'sine', verzerrt: true });
    this.rauschen({ dauer: .7, laut: .16, von: 1400, bis: 120, typ: 'lowpass', verzug: .04 });
  },
  frostschuss() {
    if (this.zuFrueh('frost', .07)) return;
    const streu = .9 + Math.random() * .2;
    this.rauschen({ dauer: .18, laut: .16, von: 6000 * streu, bis: 2400, typ: 'bandpass', guete: 5 });
    this.ton({ von: 2100 * streu, bis: 3000, dauer: .14, laut: .07, form: 'sine' });
  },
  blitz() {
    if (this.zuFrueh('blitz', .07)) return;
    this.rauschen({ dauer: .02, laut: .5, von: 11000, bis: 5000, typ: 'highpass' });
    this.rauschen({ dauer: .22, laut: .26, von: 4200 * (.85 + Math.random() * .3), bis: 700,
                    typ: 'bandpass', guete: 2.5, verzerrt: true });
    this.ton({ von: 90, bis: 40, dauer: .18, laut: .16, form: 'sine' });
  },
  railgun(staerke) {
    this.rauschen({ dauer: .02, laut: .5, von: 11000, bis: 4000, typ: 'highpass' });
    this.ton({ von: 2400 * (.8 + staerke * .5), bis: 180, dauer: .3 + staerke * .2,
               laut: .3 + staerke * .2, form: 'sawtooth', verzerrt: true });
    this.rauschen({ dauer: .5, laut: .3, von: 3000, bis: 90, typ: 'lowpass', verzerrt: true });
  },
  lochOeffnet(x, y) {
    this.ton({ von: 400, bis: 55, dauer: 1.6, laut: .28, form: 'sine', x, y });
    this.rauschen({ dauer: 1.6, laut: .2, von: 300, bis: 2600, typ: 'bandpass', guete: 2, x, y });
  },
  orbitalMarkiert() {
    this.ton({ von: 1500, bis: 2100, dauer: .18, laut: .13, form: 'sine' });
    this.ton({ von: 2100, bis: 2600, dauer: .15, laut: .08, form: 'sine', verzug: .12 });
  },
  orbitalEinschlag(x, y) {
    this.ton({ von: 90, bis: 26, dauer: 1.1, laut: .6, form: 'sine', verzerrt: true, x, y });
    this.rauschen({ dauer: 1.2, laut: .5, von: 6000, bis: 70, typ: 'lowpass', verzerrt: true, x, y });
    this.rauschen({ dauer: .05, laut: .5, von: 12000, bis: 3000, typ: 'highpass', x, y });
  },
  turmGebaut() {
    this.ton({ von: 220, bis: 440, dauer: .18, laut: .16, form: 'square' });
    this.rauschen({ dauer: .12, laut: .2, von: 2600, bis: 900, typ: 'bandpass', guete: 5 });
  },
  sprung() {
    this.rauschen({ dauer: .22, laut: .25, von: 900, bis: 6000, typ: 'bandpass', guete: 3 });
    this.ton({ von: 300, bis: 1400, dauer: .18, laut: .1, form: 'sine' });
  },
  emp() {
    this.rauschen({ dauer: .6, laut: .45, von: 9000, bis: 300, typ: 'lowpass', verzerrt: true });
    this.ton({ von: 1800, bis: 60, dauer: .7, laut: .3, form: 'sawtooth', verzerrt: true });
  },
  zeitlupe() {
    this.ton({ von: 700, bis: 180, dauer: 1.1, laut: .18, form: 'sine' });
    this.ton({ von: 350, bis: 90, dauer: 1.3, laut: .12, form: 'triangle', verzug: .06 });
  },
  mineGelegt(x, y) {
    this.rauschen({ dauer: .05, laut: .2, von: 3200, bis: 1400, typ: 'bandpass', guete: 6, x, y });
    this.ton({ von: 640, bis: 520, dauer: .06, laut: .09, form: 'triangle', x, y });
  },
  gegnerSchuss(x, y) {
    if (this.zuFrueh('gschuss', .07)) return;
    const streu = .85 + Math.random() * .3;
    this.rauschen({ dauer: .045, laut: .22, von: 2400 * streu, bis: 500, typ: 'bandpass', guete: 1.6, x, y });
    this.ton({ von: 210 * streu, bis: 70, dauer: .05, laut: .12, form: 'sine', x, y });
  },
  treffer(x, y) {
    if (this.zuFrueh('treffer', .035)) return;
    this.rauschen({ dauer: .045, laut: .2, von: 2900 * (.85 + Math.random() * .3), bis: 1500,
                    typ: 'bandpass', guete: 9, x, y });
  },
  explosion(gross, x, y) {
    if (this.zuFrueh('boom', .05)) return;
    const g = gross ? 1 : .65;
    this.rauschen({ dauer: .03, laut: .5 * g, von: 9000, bis: 2500, typ: 'highpass', x, y });
    this.ton({ von: 118 * (.9 + Math.random() * .2), bis: 24, dauer: .8 * g, laut: .55 * g,
               form: 'sine', verzerrt: true, x, y });
    this.rauschen({ dauer: .95 * g, laut: .42 * g, von: 2800, bis: 70, typ: 'lowpass',
                    verzerrt: true, x, y });
    // Trümmer, die nachprasseln
    for (let i = 0; i < (gross ? 8 : 4); i++)
      this.rauschen({ dauer: .05, laut: .12 * g, von: 5500 * (.6 + Math.random()), bis: 1200,
                      typ: 'bandpass', guete: 4, verzug: .09 + Math.random() * (gross ? .6 : .3), x, y });
  },
  gegnerTod(boss, x, y) {
    if (boss) {
      this.ton({ von: 150, bis: 22, dauer: 1.8, laut: .5, form: 'sine', verzerrt: true, x, y });
      this.rauschen({ dauer: 1.6, laut: .45, von: 3200, bis: 55, typ: 'lowpass', verzerrt: true, x, y });
      for (let i = 0; i < 12; i++)
        this.rauschen({ dauer: .07, laut: .16, von: 4500 * (.5 + Math.random()), bis: 900,
                        typ: 'bandpass', guete: 5, verzug: .05 + Math.random() * 1.2, x, y });
    } else {
      if (this.zuFrueh('tod', .035)) return;
      this.rauschen({ dauer: .16, laut: .28, von: 3400 * (.8 + Math.random() * .4), bis: 260,
                      typ: 'lowpass', verzerrt: true, x, y });
      this.ton({ von: 320 * (.85 + Math.random() * .3), bis: 70, dauer: .17, laut: .16,
                 form: 'triangle', x, y });
    }
  },
  teleport(x, y) {
    if (this.zuFrueh('tp', .09)) return;
    this.rauschen({ dauer: .16, laut: .2, von: 700, bis: 7000, typ: 'bandpass', guete: 4, x, y });
    this.ton({ von: 240, bis: 1900, dauer: .14, laut: .07, form: 'sine', x, y });
  },
  spielerTreffer() {
    this.rauschen({ dauer: .025, laut: .55, von: 7000, bis: 1800, typ: 'highpass' });
    this.ton({ von: 165, bis: 42, dauer: .5, laut: .5, form: 'sine', verzerrt: true });
    this.rauschen({ dauer: .35, laut: .3, von: 1400, bis: 90, typ: 'lowpass', verzerrt: true });
  },
  schildBruch() {
    // Metallischer Anschlag, danach Splitter in zufälligen Tonhöhen
    this.rauschen({ dauer: .05, laut: .35, von: 3000, bis: 1200, typ: 'bandpass', guete: 8 });
    this.ton({ von: 1180, bis: 780, dauer: .35, laut: .16, form: 'sine' });
    for (let i = 0; i < 7; i++)
      this.rauschen({ dauer: .09, laut: .12, von: 3500 + Math.random() * 5000, bis: 2000,
                      typ: 'bandpass', guete: 14, verzug: .02 + Math.random() * .3 });
  },
  schockwelle() {
    this.ton({ von: 150, bis: 26, dauer: 1, laut: .55, form: 'sine', verzerrt: true });
    this.rauschen({ dauer: .9, laut: .4, von: 3600, bis: 60, typ: 'lowpass', verzerrt: true });
    this.rauschen({ dauer: .5, laut: .18, von: 400, bis: 5000, typ: 'bandpass', guete: 1.5 });
  },
  heilen() {
    [523, 784, 1047].forEach((hz, i) => {
      this.ton({ von: hz, bis: hz, dauer: .5, laut: .1, form: 'sine', verzug: i * .075 });
      this.ton({ von: hz * 2, bis: hz * 2, dauer: .25, laut: .03, form: 'sine', verzug: i * .075 });
    });
  },
  kaufen() {
    this.rauschen({ dauer: .04, laut: .18, von: 5000, bis: 3000, typ: 'bandpass', guete: 10 });
    this.ton({ von: 1046, bis: 1046, dauer: .3, laut: .09, form: 'sine' });
    this.ton({ von: 1568, bis: 1568, dauer: .35, laut: .06, form: 'sine', verzug: .05 });
  },
  levelFertig() {
    [523, 659, 784, 1047].forEach((hz, i) => {
      this.ton({ von: hz, bis: hz, dauer: .6, laut: .11, form: 'triangle', verzug: i * .1 });
      this.ton({ von: hz * 2, bis: hz * 2, dauer: .3, laut: .035, form: 'sine', verzug: i * .1 });
    });
  },
  bossKommt() {
    this.ton({ von: 58, bis: 34, dauer: 2.4, laut: .45, form: 'sine', verzerrt: true });
    this.rauschen({ dauer: 2.2, laut: .2, von: 340, bis: 50, typ: 'lowpass' });
    [0, .3, .6].forEach((v, i) => {
      this.ton({ von: 98, bis: 98, dauer: .45, laut: .16, form: 'square', verzug: .55 + v });
      this.rauschen({ dauer: .1, laut: .2, von: 2600, bis: 900, typ: 'bandpass', guete: 6,
                      verzug: .55 + v });
    });
  },
  spielerTod() {
    this.dauerton(null);
    this.rauschen({ dauer: 1.8, laut: .35, von: 2200, bis: 45, typ: 'lowpass', verzerrt: true });
    [392, 311, 233, 175].forEach((hz, i) =>
      this.ton({ von: hz, bis: hz * .94, dauer: .7, laut: .16, form: 'sawtooth', verzug: i * .19 }));
    this.ton({ von: 80, bis: 28, dauer: 2.2, laut: .3, form: 'sine', verzerrt: true, verzug: .1 });
  },
};

// ============================================================================
// Die Musik
//
// Warum das vorher nach Spielhalle klang: Eine nackte Rechteckwelle mit harter
// Hüllkurve IST der Klang von 1980. Für modernen Klang braucht es vier Dinge:
//
//   1. Mehrere leicht verstimmte Oszillatoren pro Ton statt einem einzigen.
//      Das Schweben zwischen ihnen macht den Klang breit und lebendig.
//   2. Ein Tiefpassfilter mit eigener Hüllkurve - der Ton wird beim Anschlag
//      hell und dunkelt dann ab, so wie jedes echte Instrument.
//   3. Weiche Hüllkurven: Flächen fahren über eine Sekunde hoch, Zupftöne
//      klingen lange aus, statt hart an und aus zu schalten.
//   4. Hall und ein rhythmisches Echo. Ohne die klebt alles trocken am Ohr.
//
// Dazu ein Filter über der ganzen Musik, der sich mit der Anspannung öffnet -
// derselbe Trick, mit dem in elektronischer Musik Spannung aufgebaut wird.
// ============================================================================

const TON_C2 = 65.406;
const hzVon = halbton => TON_C2 * Math.pow(2, halbton / 12);

// Akkorde als Halbtonabstände über dem Grundton
const AKKORDE = {
  moll:  [0, 3, 7, 12],
  dur:   [0, 4, 7, 12],
  moll7: [0, 3, 7, 10],
  dur7:  [0, 4, 7, 11],
  sus:   [0, 5, 7, 12],
  verm:  [0, 3, 6, 9],      // vermindert - klingt unheimlich
};

// Schlagzeugmuster (16 Sechzehntel). k = Bassdrum, s = Snare,
// h = geschlossene Hi-Hat, o = offene Hi-Hat

const MUSIK = {
  an: true, bus: null, filter: null, echo: null, stueck: null, name: null,
  schritt: 0, naechste: 0,
  // 0 = ruhig, 1 = höchste Anspannung.
  spannung: 0,

  aufbauen() {
    if (this.bus || !KLANG.ctx) return;
    const c = KLANG.ctx;

    this.bus = c.createGain();
    this.bus.gain.value = .55;

    // Der Filter über der ganzen Musik. Er öffnet sich mit der Anspannung -
    // in ruhigen Momenten klingt alles gedämpft wie hinter einer Wand, im
    // Kampf reißt es auf. Der wichtigste Trick für lebendige Spielmusik.
    this.filter = c.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.filter.frequency.value = 1200;
    this.filter.Q.value = .7;
    this.bus.connect(this.filter);
    this.filter.connect(KLANG.meister);

    // Rhythmisches Echo für Zupftöne und Melodie
    this.echo = c.createDelay(1.5);
    this.echo.delayTime.value = .34;
    const rueck = c.createGain(); rueck.gain.value = .33;
    const echoFilter = c.createBiquadFilter();
    echoFilter.type = 'lowpass'; echoFilter.frequency.value = 2000;
    this.echo.connect(echoFilter); echoFilter.connect(rueck); rueck.connect(this.echo);
    this.echo.connect(this.bus);

    // Etwas Raum
    const raumWeg = c.createGain();
    raumWeg.gain.value = .3;
    this.bus.connect(raumWeg);
    raumWeg.connect(KLANG.hallWeg);
  },

  spiele(name) {
    if (this.name === name) return;
    this.name = name;
    this.stueck = STUECKE[name] || null;
    this.schritt = 0;
    this.naechste = KLANG.ctx ? KLANG.ctx.currentTime + .05 : 0;
    if (name === 'menue' || name === 'laden') this.spannung = 0;
  },

  aus() { this.name = null; this.stueck = null; },

  // ---------------------------------------------------------------------
  // Eine Synthesizerstimme: mehrere leicht verstimmte Oszillatoren durch ein
  // Tiefpassfilter mit eigener Hüllkurve. Das ist der Unterschied zwischen
  // "Piepser" und "Klang".
  // ---------------------------------------------------------------------
  stimme(hz, t, dauer, o) {
    const c = KLANG.ctx;
    const g = c.createGain();
    const f = c.createBiquadFilter();
    f.type = 'lowpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.filterVon, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, o.filterBis), t + (o.filterZeit || dauer));

    (o.verstimmung || [0]).forEach(cent => {
      const q = c.createOscillator();
      q.type = o.form || 'sawtooth';
      q.frequency.value = hz * (o.oktave ? Math.pow(2, o.oktave) : 1);
      if (q.detune) q.detune.value = cent;
      q.connect(f);
      q.start(t); q.stop(t + dauer + (o.ausklang || .3) + .05);
    });

    const spitze = o.laut;
    const halten = spitze * (o.halten === undefined ? .7 : o.halten);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(spitze, t + (o.anstieg || .01));
    g.gain.linearRampToValueAtTime(halten, t + (o.anstieg || .01) + (o.abfall || .08));
    g.gain.setValueAtTime(Math.max(.0002, halten), t + dauer);
    g.gain.exponentialRampToValueAtTime(.0001, t + dauer + (o.ausklang || .3));

    f.connect(g);
    g.connect(this.bus);
    if (o.echo && this.echo) {
      const ab = c.createGain(); ab.gain.value = o.echo;
      g.connect(ab); ab.connect(this.echo);
    }
  },

  // Flächenakkord: fährt langsam hoch, bleibt stehen, klingt lange aus.
  flaeche(grund, art, t, dauer, laut) {
    const toene = AKKORDE[art] || AKKORDE.moll;
    toene.forEach((h, i) => {
      this.stimme(hzVon(grund + 12 + h), t, dauer, {
        form: 'sawtooth',
        verstimmung: [-9, 0, 9],           // dreifach verstimmt = breit
        laut: laut * (i === 0 ? 1 : .7),
        anstieg: .9, abfall: .5, halten: .85, ausklang: 1.4,
        filterVon: 300, filterBis: 900, filterZeit: 1.2, q: .8,
      });
    });
  },

  // Bass: tiefer Sinus für den Druck, darüber ein gefilterter Sägezahn
  // für die Kontur. Nur Sinus wäre matschig, nur Säge wäre dünn.
  bassTon(grund, t, dauer, laut) {
    this.stimme(hzVon(grund), t, dauer, {
      form: 'sine', laut: laut, oktave: -1,
      anstieg: .006, abfall: .05, halten: .8, ausklang: .12,
      filterVon: 400, filterBis: 160, q: .5,
    });
    this.stimme(hzVon(grund), t, dauer * .8, {
      form: 'sawtooth', verstimmung: [-6, 6], laut: laut * .3,
      anstieg: .004, abfall: .07, halten: .4, ausklang: .1,
      filterVon: 1400, filterBis: 320, q: 3,
    });
  },

  // Zupfton: Filter reißt auf und schließt sofort wieder - das typische
  // "Plock" elektronischer Musik. Geht mit Echo raus.
  zupf(hz, t, laut) {
    this.stimme(hz, t, .09, {
      form: 'sawtooth', verstimmung: [-7, 7], laut: laut,
      anstieg: .004, abfall: .07, halten: .12, ausklang: .5,
      filterVon: 5200, filterBis: 700, filterZeit: .22, q: 5,
      echo: .5,
    });
  },

  // Melodie: zwei verstimmte Sägezähne, weicher Anschlag, langer Ausklang.
  melodie(halbton, t, dauer, laut) {
    this.stimme(hzVon(halbton), t, dauer, {
      form: 'sawtooth', verstimmung: [-11, 0, 11], laut: laut,
      anstieg: .05, abfall: .18, halten: .65, ausklang: .55,
      filterVon: 3200, filterBis: 1300, filterZeit: .5, q: 2.5,
      echo: .28,
    });
  },

  planer() {
    if (!this.stueck || !this.an || !KLANG.an || !KLANG.ctx) return;
    this.aufbauen();
    if (!this.bus) return;
    const c = KLANG.ctx;
    if (c.state === 'suspended') return;
    if (this.naechste < c.currentTime) this.naechste = c.currentTime + .05;

    const sp = Math.max(0, Math.min(1, this.spannung || 0));

    // Filter öffnen: gedämpft wenn ruhig, offen wenn es brennt
    if (this.filter) {
      const ziel = 900 + sp * 11000;
      const jetzt = this.filter.frequency.value || 1200;
      this.filter.frequency.value = jetzt + (ziel - jetzt) * .06;
    }
    // Echo im Takt
    if (this.echo) this.echo.delayTime.value = 60 / this.stueck.tempo * .75;

    const dauer = 60 / this.stueck.tempo / 4;
    if (!(dauer > 0)) return;
    let sicherung = 0;
    while (this.naechste < c.currentTime + .18 && sicherung++ < 64) {
      this.schrittSpielen(this.schritt, this.naechste, dauer, sp);
      this.naechste += dauer;
      this.schritt++;
    }
  },

  schrittSpielen(i, t, dauer, sp) {
    const st = this.stueck;
    const takt = Math.floor(i / 16) % st.folge.length;
    const imTakt = i % 16;
    const akkord = st.folge[takt];
    const grund = akkord[0], art = akkord[1];
    const toene = AKKORDE[art] || AKKORDE.moll;

    // Fläche: einmal pro Takt, lang gehalten
    if (imTakt === 0 && st.flaeche)
      this.flaeche(grund, art, t, dauer * 15, st.flaeche * (.55 + sp * .45) * .12);

    if (st.bassMuster[imTakt]) this.bassTon(grund, t, dauer * 1.6, st.lautBass * .12);

    // Zupftöne erst ab etwas Anspannung - vorher bleibt es luftig
    if (sp >= .2) {
      const stufe = st.zupfMuster[imTakt];
      if (stufe !== null && stufe !== undefined)
        this.zupf(hzVon(grund + 24 + toene[stufe]), t, st.lautZupf * (.5 + sp * .5));
    }

    const l = st.lead[i % st.lead.length];
    if (l !== null && l !== undefined && sp >= .12) {
      this.melodie(l, t, dauer * 2.4, st.lautLead * (.6 + sp * .4));
      if (sp >= .7) this.melodie(l + 12, t, dauer * 1.6, st.lautLead * .22);
    }

    const schlag = st.schlag[i % st.schlag.length];
    if (schlag) this.schlagzeug(schlag, t, sp);
    else if (sp >= .55 && imTakt % 2 === 1) this.schlagzeug('h', t, sp * .6);
  },

  // Schlagzeug aus Synthese: Bassdrum mit Tonhöhenabfall, Snare aus Rauschen
  // plus Körper, Hi-Hats als gefiltertes Rauschen.
  schlagzeug(art, t, sp) {
    const c = KLANG.ctx;
    const laut = .55 + (sp || 0) * .45;

    if (art === 'k') {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(135, t);
      o.frequency.exponentialRampToValueAtTime(41, t + .085);
      g.gain.setValueAtTime(.5 * laut, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(this.bus);
      o.start(t); o.stop(t + .32);
      // Anschlagklick, damit sie auf kleinen Boxen durchkommt
      const k = c.createBufferSource(); k.buffer = KLANG.rauschPuffer;
      const kf = c.createBiquadFilter(); kf.type = 'highpass'; kf.frequency.value = 1800;
      const kg = c.createGain();
      kg.gain.setValueAtTime(.12 * laut, t);
      kg.gain.exponentialRampToValueAtTime(.0001, t + .012);
      k.connect(kf); kf.connect(kg); kg.connect(this.bus);
      k.start(t); k.stop(t + .04);
      return;
    }

    if (art === 's') {
      const q = c.createBufferSource(); q.buffer = KLANG.rauschPuffer;
      const f = c.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.value = 1750; f.Q.value = .7;
      const g = c.createGain();
      g.gain.setValueAtTime(.3 * laut, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .17);
      q.connect(f); f.connect(g); g.connect(this.bus);
      q.start(t); q.stop(t + .2);
      [188, 246].forEach(hz => {                 // Körper der Trommel
        const o = c.createOscillator(), og = c.createGain();
        o.type = 'triangle'; o.frequency.value = hz;
        og.gain.setValueAtTime(.13 * laut, t);
        og.gain.exponentialRampToValueAtTime(.0001, t + .1);
        o.connect(og); og.connect(this.bus);
        o.start(t); o.stop(t + .12);
      });
      return;
    }

    const offen = art === 'o';
    const q = c.createBufferSource(); q.buffer = KLANG.rauschPuffer;
    q.playbackRate.value = .9 + Math.random() * .3;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8200;
    const g = c.createGain();
    g.gain.setValueAtTime((offen ? .1 : .075) * laut, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + (offen ? .22 : .045));
    q.connect(f); f.connect(g); g.connect(this.bus);
    q.start(t); q.stop(t + (offen ? .25 : .07));
  },
};

// ============================================================================
// Aufbau
// ============================================================================
const leinwand = document.getElementById('leinwand');
const ctx = leinwand.getContext('2d');
// B und H = Größe des Sichtfensters in CSS-Pixeln. Keine festen Zahlen mehr:
// die Leinwand richtet sich nach dem Browserfenster und passt sich beim
// Ziehen der Fenstergröße sofort an.
let B = 0, H = 0, pixelDichte = 1;

function groesseAnpassen() {
  pixelDichte = Math.min(window.devicePixelRatio || 1, 2);   // scharf auf Retina
  B = Math.max(320, Math.floor(leinwand.clientWidth));
  H = Math.max(240, Math.floor(leinwand.clientHeight));
  leinwand.width  = Math.floor(B * pixelDichte);
  leinwand.height = Math.floor(H * pixelDichte);
}
groesseAnpassen();
addEventListener('resize', groesseAnpassen);
const overlay = document.getElementById('overlay');
const karte = document.getElementById('karte');

const tasten = {};
const maus = { x: B / 2, y: H / 2 - 100, gedrueckt: false };   // Bildschirmkoordinaten!
const kamera = { x: 0, y: 0 };

let zustand = 'menu';
let spieler, gegner, schuesse, gegnerSchuesse, partikel, ruckeln, explosionen, blitze, drohnen, heilstrahlen;
let einschlaege;   // markierte Stellen des Orbitallasers
let tuerme;        // aufgestellte Geschütztürme
let zeitlupeRest = 0, zeitlupeFaktor = 1;
let hindernisse = [], aktuelleKarte = null;
let nachschub = [];   // Gegner, die mitten im Level dazukommen (Boss-Handlanger)

let fortschritt = laden() || {
  muenzen: 0,
  daten: 0,                     // Forschungsdaten fürs Labor
  bauteile: 0,                  // Bauteile für die Werkstatt
  glut: 0,                      // Glut für Schmiede und Arsenal
  faehigkeiten: {},             // id -> Ausbaustufe
  gekauft: { pistole: true },   // welche Knoten erforscht sind (Baum UND Labor)
  bestesLevel: 1,
  hoechsteStufe: 1,
  gewaehlteStufe: 1,            // in welcher Stufe der nächste Lauf beginnt
  bestenliste: [],
};

let lauf = { level: 1, hp: 100, waffe: 'pistole', nachladen: 0, hitze: 0, ueberhitzt: false,
             heilungen: 0, heilungImLevel: false, ausruestung: [] };
if (fortschritt.ton === false) KLANG.an = false;
if (fortschritt.musik === false) MUSIK.an = false;

// ============================================================================
// Hilfsfunktionen
// ============================================================================
const grenze = (w, min, max) => Math.max(min, Math.min(max, w));
const zufall = (a, b) => a + Math.random() * (b - a);

// Maus umrechnen: Bildschirm -> Welt
const mausWeltX = () => maus.x + kamera.x;
const mausWeltY = () => maus.y + kamera.y;

function speichern() { try { localStorage.setItem('pfeilspiel', JSON.stringify(fortschritt)); } catch (e) {} }

function laden() {
  try {
    const d = JSON.parse(localStorage.getItem('pfeilspiel'));
    if (!d) return null;
    // Felder ergänzen, die es in älteren Spielständen noch nicht gab
    if (d.daten === undefined) d.daten = 0;
    if (d.bauteile === undefined) d.bauteile = 0;
    if (d.glut === undefined) d.glut = 0;
    if (!d.faehigkeiten) d.faehigkeiten = {};
    if (!d.hoechsteStufe) d.hoechsteStufe = 1;
    if (!d.gewaehlteStufe) d.gewaehlteStufe = d.hoechsteStufe;
    if (!d.bestenliste) d.bestenliste = [];

    // Einmalige Umstellung: Die vier Endgame-Waffen sind aus dem
    // Forschungsbaum ins Labor gewandert. Wer sie noch aus der alten Zeit
    // besitzt, gibt sie ab und bekommt dafür seine Münzen zurück - im Labor
    // kauft man sie neu, dort aber mit Forschungsdaten.
    if (!d.laborUmgestellt) {
      const alteLaborpreise = { railgun: 2200, schwarm: 2000, singularitaet: 2800, orbital: 3600 };
      let erstattung = 0;
      for (const id in alteLaborpreise) {
        if (d.gekauft && d.gekauft[id]) {
          delete d.gekauft[id];
          erstattung += alteLaborpreise[id];
        }
      }
      if (erstattung > 0) {
        d.muenzen = (d.muenzen || 0) + erstattung;
        d.laborErstattung = erstattung;      // damit wir es einmal anzeigen können
      }
      if (Array.isArray(d.ausruestung))
        d.ausruestung = d.ausruestung.filter(w => !(w in alteLaborpreise));
      d.laborUmgestellt = true;
    }
    if (!d.gekauft) {                       // alter Spielstand von früher: umrechnen
      d.gekauft = { pistole: true };
      if (d.waffen) {
        if (d.waffen[1]) d.gekauft.schnellfeuer = true;
        if (d.waffen[2]) d.gekauft.dreifach = true;
        if (d.waffen[3]) { d.gekauft.laser = true; d.gekauft.schnellfeuer = true; d.gekauft.dreifach = true; }
      }
      if (d.tempoStufe >= 1) d.gekauft.stiefel1 = true;
      if (d.tempoStufe >= 2) d.gekauft.stiefel2 = true;
      if (d.tempoStufe >= 3) d.gekauft.stiefel3 = true;
      if (d.maxLeben >= 4) { d.gekauft.stiefel1 = true; d.gekauft.panzerung1 = true; }
      if (d.maxLeben >= 5) d.gekauft.panzerung2 = true;
      if (d.maxLeben >= 6) d.gekauft.panzerung3 = true;
      delete d.waffen; delete d.tempoStufe; delete d.maxLeben;
    }
    return d;
  } catch (e) { return null; }
}

// --- Was der Forschungsbaum bewirkt -----------------------------------------
// In der Boss-Arena ist alles freigeschaltet, damit man ausprobieren kann.
function hat(id) { return lauf.testModus || !!fortschritt.gekauft[id]; }

function maxHp() {
  return EINSTELLUNGEN.startHp +
         (hat('panzerung1') + hat('panzerung2') + hat('panzerung3')) * EINSTELLUNGEN.hpProPanzerung;
}

// Die HP-Obergrenze, die gerade gilt (in der Boss-Arena eine feste.)
function hpGrenze() { return lauf.testModus ? 160 : maxHp(); }

// Wie hart ein Treffer im aktuellen Level ausfällt.
function schadenStufe(grund, level) {
  return Math.round(grund * Math.min(EINSTELLUNGEN.schadenMax,
                                     1 + level * EINSTELLUNGEN.schadenProLevel));
}
function tempoBonus()    { return 1 + (hat('stiefel1') + hat('stiefel2') + hat('stiefel3')) * 0.15; }
function muenzBonus()    { return hat('magnet') ? 1.3 : 1; }
function nachladeBonus() { return hat('schnellladung') ? 0.85 : 1; }
function durchschlaege() { return hat('durchschlag') ? 2 : 1; }
function hitzeBonus()    { return hat('kuehlrippen') ? 0.6 : 1; }
function maxSchild()     { return hat('schild3') ? 2 : (hat('schild1') ? 1 : 0); }
function schildLadezeit(){ return hat('schild2') ? EINSTELLUNGEN.schildLadezeitSchnell
                                                 : EINSTELLUNGEN.schildLadezeit; }

// Jede Heilung im laufenden Durchlauf macht die nächste teurer.
// Nach dem Tod fängt der Zähler wieder bei null an.
function heilKosten() {
  return Math.round(EINSTELLUNGEN.heilPreisStart *
                    Math.pow(EINSTELLUNGEN.heilPreisFaktor, lauf.heilungen || 0));
}
function anzahlDrohnen() { return hat('drohne2') ? 2 : (hat('drohne1') ? 1 : 0); }

// Welche Voraussetzungen fehlen noch? Gilt für Baum und Labor gleichermaßen.
function istFrei(knoten) { return knoten.vor.every(v => !!fortschritt.gekauft[v]); }

// Name eines Knotens, egal ob er im Baum oder im Labor steht.
function knotenName(id) {
  return (BAUM_NACH_ID[id] && BAUM_NACH_ID[id].name) ||
         (LABOR_NACH_ID[id] && LABOR_NACH_ID[id].name) || id;
}

// --- Rucksack: Traglast und Munition ---------------------------------------
function traglast() {
  const stufe = stufeNr(lauf.level || 1);
  return EINSTELLUNGEN.traglastGrund
       + (stufe - 1) * EINSTELLUNGEN.traglastProStufe
       + (hat('rucksack1') + hat('rucksack2') + hat('rucksack3'))
         * EINSTELLUNGEN.traglastProUpgrade;
}
function gewichtVon(id) { return (WAFFEN[id] && WAFFEN[id].gewicht) || 0; }
function getragen(liste) {
  return (liste || lauf.ausruestung || []).reduce((summe, id) => summe + gewichtVon(id), 0);
}
function munitionsBonus() {
  return 1 + (hat('munition1') + hat('munition2')) * EINSTELLUNGEN.munitionProUpgrade;
}
function magazinVon(id) {
  const w = WAFFEN[id];
  return w && w.magazin ? Math.round(w.magazin * munitionsBonus()) : 0;   // 0 = unbegrenzt
}
function munitionRest(id) {
  if (!magazinVon(id)) return Infinity;
  return (lauf.munition && lauf.munition[id]) || 0;
}
function munitionAbziehen(id, menge) {
  if (!magazinVon(id) || !lauf.munition) return;
  lauf.munition[id] = Math.max(0, lauf.munition[id] - menge);
}

// Alle Waffen, die man besitzt (also im Baum erforscht hat).
function besesseneWaffen() { return WAFFEN_REIHENFOLGE.filter(id => hat(id)); }

// Die Waffen, die man ins aktuelle Level mitgenommen hat.
// In der Boss-Arena zum Ausprobieren ausnahmsweise alle.
function meineWaffen() {
  if (lauf.testModus) return besesseneWaffen();
  return (lauf.ausruestung || []).filter(id => hat(id));
}

// --- Fähigkeitsplätze ------------------------------------------------------
function faehigkeitenPruefen() {
  const besitz = besesseneFaehigkeiten();
  lauf.faehigkeitPlaetze = (lauf.faehigkeitPlaetze || []).filter(id => besitz.indexOf(id) >= 0);
  while (lauf.faehigkeitPlaetze.length < EINSTELLUNGEN.faehigkeitSlots) {
    const naechste = besitz.find(id => lauf.faehigkeitPlaetze.indexOf(id) < 0);
    if (!naechste) break;
    lauf.faehigkeitPlaetze.push(naechste);
  }
}

function faehigkeitUmschalten(id) {
  if (faehigkeitStufe(id) <= 0) return;
  if (!lauf.faehigkeitPlaetze) lauf.faehigkeitPlaetze = [];
  const platz = lauf.faehigkeitPlaetze.indexOf(id);
  if (platz >= 0) lauf.faehigkeitPlaetze.splice(platz, 1);
  else {
    if (lauf.faehigkeitPlaetze.length >= EINSTELLUNGEN.faehigkeitSlots)
      lauf.faehigkeitPlaetze.shift();          // ältester Platz weicht
    lauf.faehigkeitPlaetze.push(id);
  }
  fortschritt.faehigkeitPlaetze = lauf.faehigkeitPlaetze.slice();
  speichern();
  hudAktualisieren();
  zeigeLaden(0, false);
}

// Slots immer in derselben Reihenfolge, damit sich die Tastennummern
// nicht bei jeder Änderung verschieben.
function ausruestungSortieren() {
  lauf.ausruestung.sort((a, b) =>
    WAFFEN_REIHENFOLGE.indexOf(a) - WAFFEN_REIHENFOLGE.indexOf(b));
}

// Räumt den Rucksack auf: unbekanntes raus, Übergewicht abwerfen, notfalls
// mit dem auffüllen, was man hat, und die aktive Waffe prüfen.
function ausruestungPruefen() {
  const besitz = besesseneWaffen();
  lauf.ausruestung = (lauf.ausruestung || []).filter(id => besitz.indexOf(id) >= 0);

  // Die Pistole ist immer dabei - sie wiegt nichts und geht nie aus.
  if (besitz.indexOf('pistole') >= 0 && lauf.ausruestung.indexOf('pistole') < 0)
    lauf.ausruestung.unshift('pistole');

  // Im Schießstand gilt keine Traglast - da trägst du alles, was du hast,
  // sonst könntest du die schweren Waffen nie ausprobieren.
  if (lauf.uebung) {
    ausruestungSortieren();
    if (meineWaffen().indexOf(lauf.waffe) < 0) lauf.waffe = meineWaffen()[0] || 'pistole';
    return;
  }

  // Zu schwer geworden (z. B. weil du in eine frühere Stufe zurückgegangen
  // bist)? Dann fliegt das Schwerste raus, bis es wieder passt.
  const grenze2 = traglast();
  while (getragen() > grenze2 && lauf.ausruestung.length > 1) {
    let schwerstes = null, gewicht = -1;
    for (const id of lauf.ausruestung)
      if (id !== 'pistole' && gewichtVon(id) > gewicht) { gewicht = gewichtVon(id); schwerstes = id; }
    if (!schwerstes) break;
    lauf.ausruestung.splice(lauf.ausruestung.indexOf(schwerstes), 1);
  }

  // Noch nie selbst gepackt? Dann pack ich dir den Rucksack voll - mit dem
  // Stärksten zuerst, was noch reinpasst. Sobald du einmal selbst umgepackt
  // hast, fasse ich deinen Rucksack nicht mehr an.
  // Im ersten Durchgang lasse ich echte Brocken liegen (nichts über die halbe
  // Traglast), damit du mehrere Waffen dabei hast statt einer einzigen mit
  // fünf Schuss. Was danach noch frei ist, fülle ich ohne diese Bremse auf.
  if (!fortschritt.selbstGepackt && lauf.ausruestung.length <= 1) {
    for (const deckel of [grenze2 / 2, grenze2])
      for (let i = besitz.length - 1; i >= 0; i--) {
        const id = besitz[i];
        if (gewichtVon(id) > deckel) continue;
        if (lauf.ausruestung.indexOf(id) < 0 && getragen() + gewichtVon(id) <= grenze2)
          lauf.ausruestung.push(id);
      }
  }

  ausruestungSortieren();
  if (meineWaffen().indexOf(lauf.waffe) < 0) lauf.waffe = meineWaffen()[0] || 'pistole';
}

// Magazine füllen - passiert zu jedem Levelbeginn neu.
function munitionFuellen() {
  lauf.munition = {};
  for (const id of meineWaffen()) {
    const m = magazinVon(id);
    if (m) lauf.munition[id] = m;
  }
}

// ============================================================================
// Eingabe
// ============================================================================
addEventListener('keydown', e => {
  const t = e.key.toLowerCase();
  KLANG.starten();                    // Browser erlauben Ton erst nach einer Eingabe
  tasten[t] = true;

  if (t === 'm') {                    // alles an/aus
    KLANG.an = !KLANG.an;
    if (!KLANG.an) KLANG.dauerton(null);
    fortschritt.ton = KLANG.an;
    speichern();
    hudAktualisieren();
  }
  if (t === 'n') {                    // nur die Musik an/aus
    MUSIK.an = !MUSIK.an;
    fortschritt.musik = MUSIK.an;
    speichern();
    hudAktualisieren();
  }
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(t)) e.preventDefault();

  if (e.key >= '1' && e.key <= '9') {
    const liste = meineWaffen();
    const i = +e.key - 1;
    if (liste[i]) { lauf.waffe = liste[i]; hudAktualisieren(); }
  }
  if (t === 'q' || t === 'e') {                      // durchblättern
    const liste = meineWaffen();
    const jetzt = Math.max(0, liste.indexOf(lauf.waffe));
    const neu = (jetzt + (t === 'e' ? 1 : liste.length - 1)) % liste.length;
    lauf.waffe = liste[neu]; hudAktualisieren();
  }
  // Fähigkeiten: Leertaste = Platz 1, F = Platz 2
  if (t === ' ' || t === 'f') {
    const platz = t === ' ' ? 0 : 1;
    const id = (lauf.faehigkeitPlaetze || [])[platz];
    if (id) faehigkeitAusloesen(id);
  }
  if (t === 'p' || e.key === 'Escape') {
    if (zustand === 'spiel' && lauf.uebung) { zeigeSchiessstand(); }
    else if (zustand === 'spiel') { zustand = 'pause'; zeigePause(); }
    else if (zustand === 'pause') { zustand = 'spiel'; overlay.classList.add('aus'); }
  }
});
addEventListener('keyup', e => { tasten[e.key.toLowerCase()] = false; });

// ============================================================================
// Touch-Steuerung für Handy und Tablet
// Zwei Daumen: Der linke läuft, der rechte zielt und schießt. Beide Sticks
// entstehen dort, wo du hintippst - feste Knöpfe trifft man auf einem Handy
// sowieso nie. Wer lieber nur läuft, stellt im Menü die Zielhilfe an: dann
// feuert das Spiel von selbst auf den nächsten Gegner.
// ============================================================================
const TIPPGERAET = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
// Steckt die Seite in einer anderen Seite (z. B. als geteilter Link)? Dann
// darf sie keine Dateien herunterladen - der Textweg bleibt trotzdem.
const EINGEBETTET = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

let stickLinks  = null;   // { id, startX, startY, x, y }
let stickRechts = null;
let tippBewegung = { x: 0, y: 0 };       // Laufrichtung vom linken Daumen
const STICK_WEITE = 62;                  // ab hier läuft man mit vollem Tempo

function zielhilfeAn() { return !!fortschritt.zielhilfe; }

function tippStart(e) {
  // Browser lassen Ton erst nach einer Eingabe zu. Auf dem Tablet ist die
  // erste Eingabe eine Berührung - ohne diese Zeile bliebe es dort stumm,
  // weil unser preventDefault() den Ersatz-Mausklick verschluckt.
  KLANG.starten();
  if (zustand !== 'spiel') return;
  for (const b of e.changedTouches) {
    const links = b.clientX < window.innerWidth / 2;
    const stick = { id: b.identifier, startX: b.clientX, startY: b.clientY,
                    x: b.clientX, y: b.clientY };
    if (links && !stickLinks)        stickLinks = stick;
    else if (!links && !stickRechts) stickRechts = stick;
  }
  e.preventDefault();
}

function tippBewegen(e) {
  for (const b of e.changedTouches) {
    if (stickLinks  && b.identifier === stickLinks.id)  { stickLinks.x = b.clientX;  stickLinks.y = b.clientY; }
    if (stickRechts && b.identifier === stickRechts.id) { stickRechts.x = b.clientX; stickRechts.y = b.clientY; }
  }
  e.preventDefault();
}

function tippEnde(e) {
  for (const b of e.changedTouches) {
    if (stickLinks  && b.identifier === stickLinks.id)  stickLinks = null;
    if (stickRechts && b.identifier === stickRechts.id) stickRechts = null;
  }
  e.preventDefault();
}

// Wird in jedem Bild aufgerufen: macht aus den Daumen Laufrichtung,
// Zielrichtung und Abzug.
function tippAuswerten() {
  tippBewegung.x = 0; tippBewegung.y = 0;
  if (stickLinks) {
    const dx = stickLinks.x - stickLinks.startX;
    const dy = stickLinks.y - stickLinks.startY;
    const d = Math.hypot(dx, dy);
    if (d > 8) {
      const stark = Math.min(1, d / STICK_WEITE);
      tippBewegung.x = dx / d * stark;
      tippBewegung.y = dy / d * stark;
    }
  }

  if (!stickRechts) {
    if (!TIPPGERAET) return;              // am Rechner entscheidet die Maus
    maus.gedrueckt = false;
    return;
  }

  maus.gedrueckt = true;
  if (zielhilfeAn()) {
    // Zielhilfe: auf den nächsten Gegner halten, den man auch sieht.
    let ziel = null, best = 1e9;
    for (const g of gegner) {
      if (g.leben <= 0 || g.verbuendet > 0) continue;
      const d = Math.hypot(g.x - spieler.x, g.y - spieler.y);
      if (d < best && sichtFrei(spieler.x, spieler.y, g.x, g.y)) { best = d; ziel = g; }
    }
    if (ziel) {
      maus.x = ziel.x - kamera.x;
      maus.y = ziel.y - kamera.y;
    }
    return;
  }

  // Zwei Sticks: der rechte Daumen zeigt die Richtung.
  const dx = stickRechts.x - stickRechts.startX;
  const dy = stickRechts.y - stickRechts.startY;
  if (Math.hypot(dx, dy) > 6) {
    const w = Math.atan2(dy, dx);
    maus.x = spieler.x - kamera.x + Math.cos(w) * 400;
    maus.y = spieler.y - kamera.y + Math.sin(w) * 400;
  }
}

// Die Sticks sichtbar machen - sonst weiß man nicht, wo der Daumen liegt.
function tippZeichnen() {
  if (!TIPPGERAET || zustand !== 'spiel') return;
  for (const st of [stickLinks, stickRechts]) {
    if (!st) continue;
    const dx = st.x - st.startX, dy = st.y - st.startY;
    const d = Math.min(Math.hypot(dx, dy), STICK_WEITE);
    const w = Math.atan2(dy, dx);
    ctx.strokeStyle = 'rgba(207,220,240,.30)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(st.startX, st.startY, STICK_WEITE, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(95,208,255,.35)';
    ctx.beginPath();
    ctx.arc(st.startX + Math.cos(w) * d, st.startY + Math.sin(w) * d, 30, 0, Math.PI * 2);
    ctx.fill();
  }
}

if (TIPPGERAET) {
  leinwand.addEventListener('touchstart',  tippStart,   { passive: false });
  leinwand.addEventListener('touchmove',   tippBewegen, { passive: false });
