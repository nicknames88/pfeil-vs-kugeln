                 : lauf.uebungLetzte + ' Schaden je Sekunde';
  ctx.fillText(gemessen, kx + kb / 2, ky + 42);

  ctx.fillStyle = '#8fa3c4';
  ctx.font = '500 11.5px system-ui, sans-serif';
  ctx.fillText('gerechnet ≈ ' + schadenProSekunde(lauf.waffe) +
               '   ·   Esc: zurück zum Schießstand', kx + kb / 2, ky + 57);
  ctx.textAlign = 'left';

  // Entfernung an jedem Übungsziel - wichtig beim Scharfschützen.
  ctx.textAlign = 'center';
  ctx.font = '600 12px system-ui, sans-serif';
  for (const g of gegner) {
    if (!g.uebungsziel) continue;
    const d = Math.round(Math.hypot(g.x - spieler.x, g.y - spieler.y));
    ctx.fillStyle = 'rgba(143,163,196,.9)';
    ctx.fillText(d + ' px', g.x - kamera.x, g.y - kamera.y + g.r + 18);
  }
  ctx.textAlign = 'left';
}

function minikarteZeichnen() {
  const kb = grenze(B * 0.16, B < 620 ? 82 : 130, 240), kh = kb * (WELT.h / WELT.b);
  const kx = B - kb - 18, ky = H - kh - 18;
  const sk = kb / WELT.b;

  ctx.fillStyle = 'rgba(8,11,18,.75)';
  ctx.fillRect(kx, ky, kb, kh);
  ctx.strokeStyle = 'rgba(77,157,255,.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(kx + .5, ky + .5, kb - 1, kh - 1);

  ctx.fillStyle = biomVon(aktuelleKarte && aktuelleKarte.biom).mauerRand;
  for (const h of hindernisse)
    ctx.fillRect(kx + h.x * sk, ky + h.y * sk, Math.max(1, h.b * sk), Math.max(1, h.h * sk));

  // sichtbarer Ausschnitt
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.strokeRect(kx + kamera.x * sk, ky + kamera.y * sk, B * sk, H * sk);

  // Im Dunkeln zeigt die Karte nur, was in deiner Nähe ist - sonst wäre
  // die Taschenlampe sinnlos.
  const nurNah = aktuelleKarte && aktuelleKarte.dunkel;
  for (const g of gegner) {
    if (nurNah && Math.hypot(g.x - spieler.x, g.y - spieler.y) > 620) continue;
    ctx.fillStyle = g.art.farbe;
    const r = g.boss ? 4 : 2.2;
    ctx.beginPath(); ctx.arc(kx + g.x * sk, ky + g.y * sk, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#5fd0ff';
  ctx.beginPath(); ctx.arc(kx + spieler.x * sk, ky + spieler.y * sk, 3, 0, Math.PI * 2); ctx.fill();
}

function hudGegnerAktualisieren() {
  document.getElementById('hudGegner').textContent = gegner ? gegner.length : 0;
}

// Zeigt unten links alle vier Waffen an: welche du hast, welche gerade aktiv
// ist und welche noch gesperrt sind. Anklicken geht auch.
function waffenleisteAktualisieren() {
  const leiste = document.getElementById('waffenleiste');
  const liste = meineWaffen();
  leiste.innerHTML = liste.map((id, i) => {
    const mag = magazinVon(id);
    const rest = munitionRest(id);
    const leer = mag && rest <= 0;
    const klassen = 'slot' + (id === lauf.waffe ? ' aktiv' : '') + (leer ? ' leer' : '');
    const nummer = i < 9 ? `<span class="nr">${i + 1}</span>` : '';
    const zahl = mag
      ? `<span class="mun ${rest / mag < .25 ? 'knapp' : ''}">${Math.ceil(rest)}</span>`
      : '<span class="mun">∞</span>';
    return `<button class="${klassen}" data-id="${id}" title="${WAFFEN[id].name} — ≈ ${
              schadenProSekunde(id)} Schaden/s, ${gewichtVon(id)} kg"
            >${nummer}<span class="sym">${symbolVon(id)}</span>${WAFFEN[id].name}${zahl}</button>`;
  }).join('');
  leiste.querySelectorAll('.slot').forEach(k => {
    k.onclick = () => { lauf.waffe = k.dataset.id; hudAktualisieren(); };
  });
}

function faehigkeitsleisteAktualisieren() {
  const leiste = document.getElementById('faehigkeitsleiste');
  const plaetze = lauf.faehigkeitPlaetze || [];
  if (!plaetze.length) { leiste.innerHTML = ''; return; }
  const tasten = ['Leer', 'F'];
  leiste.innerHTML = plaetze.map((id, i) => {
    const f = FAEHIGKEITEN[id];
    const rest = (lauf.abkling && lauf.abkling[id]) || 0;
    const ganz = f.abkling * ((faehigkeitWerte(id) || {}).abklingF || 1);
    const anteil = rest > 0 ? rest / ganz : 0;
    const gesperrt = f.hpGrenze !== undefined && lauf.hp >= f.hpGrenze;
    return `<div class="fkslot ${rest <= 0 && !gesperrt ? 'bereit' : ''} ${gesperrt ? 'gesperrt' : ''}"
              data-fkausloesen="${id}" title="${f.name} — ${f.info}">
              <span class="z">${f.zeichen}</span>
              <span class="taste">${tasten[i] || ''}</span>
              <span class="kuehlt" style="height:${(anteil * 100).toFixed(0)}%"></span>
            </div>`;
  }).join('');
  // Auf dem Tablet gibt es keine Leertaste - also antippbar machen.
  leiste.querySelectorAll('[data-fkausloesen]').forEach(el => {
    el.onclick = () => faehigkeitAusloesen(el.dataset.fkausloesen);
  });
}

function hudAktualisieren() {
  const grenzeHp = hpGrenze();
  const anteil = Math.max(0, Math.min(1, lauf.hp / grenzeHp));
  const fuellung = document.getElementById('hudHpFuellung');
  fuellung.style.width = (anteil * 100) + '%';
  fuellung.style.background = anteil > .5 ? '#7cff9d' : anteil > .25 ? '#ffd25c' : '#ff5c7a';
  document.getElementById('hudHp').textContent = Math.ceil(lauf.hp) + ' / ' + grenzeHp;
  document.getElementById('hudLevel').textContent =
    (lauf.testModus ? 'Arena ' : '') + lauf.level +
    ' (St. ' + stufeNr(lauf.level) + ')' + (lauf.level % 10 === 0 ? ' — BOSS!' : '') +
    (aktuelleKarte ? ' · ' + biomVon(aktuelleKarte.biom).symbol + ' ' +
       biomVon(aktuelleKarte.biom).name + ' · ' + aktuelleKarte.name +
       (aktuelleKarte.nummer ? ' #' + aktuelleKarte.nummer : '') : '');
  document.getElementById('hudMuenzen').textContent = fortschritt.muenzen;
  const dEl = document.getElementById('hudDaten');
  dEl.innerHTML = '⚗ <b>' + fortschritt.daten + '</b>';
  dEl.style.display = (fortschritt.hoechsteStufe || 1) >= 2 || fortschritt.daten > 0 ? '' : 'none';
  const bEl = document.getElementById('hudBauteile');
  bEl.innerHTML = '🔩 <b>' + fortschritt.bauteile + '</b>';
  bEl.style.display = (fortschritt.hoechsteStufe || 1) >= 3 || fortschritt.bauteile > 0 ? '' : 'none';
  const gEl = document.getElementById('hudGlut');
  gEl.innerHTML = '🔥 <b>' + (fortschritt.glut || 0) + '</b>';
  gEl.style.display = (fortschritt.hoechsteStufe || 1) >= 4 || fortschritt.glut > 0 ? '' : 'none';
  document.getElementById('hudWaffe').textContent = WAFFEN[lauf.waffe].name;
  document.getElementById('hudTon').textContent = KLANG.an ? '🔊' : '🔇';
  const pk = document.getElementById('hudPause');
  if (pk && !pk.onclick) pk.onclick = () => {
    if (zustand === 'spiel' && lauf.uebung) zeigeSchiessstand();
    else if (zustand === 'spiel') { zustand = 'pause'; zeigePause(); }
  };
  const mk = document.getElementById('hudMusik');
  mk.textContent = '🎵';
  mk.style.opacity = (MUSIK.an && KLANG.an) ? '1' : '.3';
  const st = MUSIK.stueck;
  mk.title = (st && st.titel ? st.titel + '\n' : '') + 'Musik an/aus (Taste N)';
  waffenleisteAktualisieren();
  faehigkeitsleisteAktualisieren();
  hudGegnerAktualisieren();
}

        border:1px solid #c78bff55;border-radius:10px;padding:10px">
      ⚗ Railgun, Schwarmraketen, Singularität und Orbitallaser sind ins <b>Labor</b> umgezogen.
      Du hast sie abgegeben und <b>${fortschritt.laborErstattung} Münzen</b> zurückbekommen —
      im Labor kaufst du sie mit Forschungsdaten neu.</p>`;
    fortschritt.laborErstattung = 0;
    speichern();

  overlay.classList.remove('aus');

    return `<div title="${a.info}">${formSvg(a.form, a.farbe, 26)}<span>${a.name}</span></div>`;

  const nochOffen = Object.keys(ARTEN_AB).length + 1 - bekannt.length + versteckt;
  const restHinweis = nochOffen > 0

         bis <b style="color:#cfdcf0">${naechste.nr}. ${naechste.name}</b>

    : `<p class="stufenziel">Du bist in der letzten Stufe — hier geht es endlos weiter.</p>`;

  // "Dein letzter Lauf" - nur wenn schon mal einer zu Ende ging.
  const lz = fortschritt.letzterLauf;
  const zuletztZeile = lz
    ? `<p class="zuletztzeile"><span class="zuletzt">🕘 Zuletzt: bis <b>Level ${lz.level}</b>
         · <b>${Math.floor(lz.sekunden / 60)}:${('0' + (lz.sekunden % 60)).slice(-2)}</b> Minuten
         · <b>${lz.abschuesse}</b> Abschüsse</span></p>`
    : '';

  karte.innerHTML = `
    <div class="pfeillogo">${formSvg('pfeil', '#5fd0ff', 46)}</div>

    </div>

    <p class="unterzeile" style="margin:12px 0 0;font-size:11.5px;opacity:.8">
      Im <b>Forschungsbaum</b> schaltest du ${WAFFEN_REIHENFOLGE.length} Waffen frei — in den
      <b>Rucksack</b> passt aber nur ein bestimmtes Gewicht. &nbsp;·&nbsp;
      🎵 Musik und Geräusche entstehen live im Browser.</p>`;
  document.getElementById('start').onclick = neuerLauf;

  };
  document.getElementById('spielstand').onclick = zeigeSpielstand;
  karte.querySelectorAll('[data-stufe]').forEach(el => {
    el.onclick = () => {
      fortschritt.gewaehlteStufe = +el.dataset.stufe;
      KLANG.starten(); KLANG.kaufen();
      speichern();
      zeigeMenu();                        // Menü neu zeichnen, damit die Wahl sichtbar wird
    };
  });
}

// Boss-Arena: jeden Boss direkt ausprobieren, ohne sich hinzuspielen.
// Hier gibt es keine Münzen und keinen Eintrag beim besten Level - reines Gucken.

function bossTestStarten(index) {
  // Zu welchem Level gehört dieser Boss? Die ersten zehn stehen in Stufe 1,
  // die späten tauchen erst ab Level 101 auf - dort testen wir sie auch.
  let level;
  if (index < BOSSARTEN.length) level = (index + 1) * 10;
  else {
    const topf = BOSSARTEN.length + BOSSARTEN_SPAET.length;
    let k = ((index - (BOSSARTEN.length - 1)) % topf + topf) % topf;
    if (k === 0) k = topf;
    level = 100 + k * 10;
  }
  lauf = { level, hp: 160, waffe: 'pistole',
           nachladen: 0, hitze: 0, ueberhitzt: false, testModus: true,
           heilungen: 0, heilungImLevel: false, ausruestung: [] };
  levelStarten(lauf.level);
}

// Grobe Stärke einer Waffe als eine einzige Zahl: Schaden je Sekunde.
// Gerechnet, nicht gemessen - für den Vergleich im Laden reicht das, und es
// ist ehrlicher als eine Messung an vier zufällig aufgestellten Zielen.
function schadenProSekunde(id) {
  const w = WAFFEN[id];
  if (!w) return 0;
  if (w.art === 'laser')  return Math.round(w.schadenProSekunde * (w.strahlen || 1));
  if (w.art === 'flamme') return Math.round(w.schadenProSekunde);
  if (w.art === 'blitz')  return Math.round(w.schaden * (w.kettenLaenge || 1) / w.takt);
  if (w.art === 'orbital')return Math.round(w.schaden / w.takt);
  if (w.art === 'nahkampf') return Math.round(w.schaden / w.takt);
  // Waffen, deren Schaden nicht im Geschoss steckt, sondern in dem, was
  // danach passiert: schwarzes Loch, Falle, Nanobots, Parasit, Fessel.
  if (w.falle)   return Math.round(w.falle.schaden);
  if (w.parasit) return Math.round(w.parasit.schaden);
  if (w.fessel)  return Math.round(w.fessel.schaden);
  if (w.nano)    return Math.round(w.nano + w.schaden / w.takt);

  // Kugelwaffen: Treffer plus Sprengschaden, geteilt durch die Schussfolge.
  const proSchuss = (w.schaden || 0) * (w.anzahl || 1) + (w.sprengschaden || 0)
                  + (w.loch ? w.loch.schaden : 0);
  const takt = w.takt + (w.aufladen ? w.aufladen * .6 : 0);
  return Math.round(proSchuss / Math.max(.05, takt));
}

// Die Beschreibung einer Waffe - egal, in welchem Laden sie steht.
function waffenText(id) {
  const imBaum = BAUM.find(k => k.id === id);
  if (imBaum && imBaum.info) return imBaum.info;
  const imLabor = LABOR_NACH_ID[id];
  if (imLabor && imLabor.info) return imLabor.info;
  if (LADENWAFFEN[id]) return LADENWAFFEN[id].k.info;
  return 'Deine treue Anfangswaffe. Unbegrenzt Munition, dafür schwach.';
}

function uebungStarten(id) {
  lauf = { level: 1, hp: 100, waffe: id, nachladen: 0, hitze: 0, ueberhitzt: false,
           testModus: false, uebung: true, heilungen: 0, heilungImLevel: false,
           ausruestung: besesseneWaffen().slice(), munition: {},
           faehigkeitPlaetze: [], abkling: {}, abschuesse: 0,
           uebungSchaden: 0, uebungZeit: 0, uebungLetzte: 0 };
  levelStarten(1);
  // Die Karte leer räumen und ordentliche Übungsziele aufstellen.
  hindernisse = [];
  rasterAufbauen();
  gegner = []; nachschub = [];
  uebungszieleAufstellen();
  lauf.hp = 999;
}

function uebungszieleAufstellen() {
  const abstaende = [200, 340, 500, 700, 950];
  for (let i = 0; i < abstaende.length; i++) {
    const g = neuerGegner(1, 'kugel');
    g.x = grenze(spieler.x + abstaende[i], 80, WELT.b - 80);
    g.y = grenze(spieler.y + (i - 2) * 120, 80, WELT.h - 80);
    g.r = 30;
    g.leben = g.maxLeben = 1e9;     // unkaputtbar
    g.tempo = 0;
    g.nachladen = 1e9;              // schießt nicht zurück
    g.uebungsziel = true;
    g.abstand = abstaende[i];
    gegner.push(g);
  }
}

// ---------------------------------------------------------------------------
// Spielstand als Text
// Auf iPhone und iPad lädt Safari keine Dateien herunter wie ein Rechner -
// der Sicherungsknopf würde dort einfach nichts tun. Deshalb gibt es den
// Spielstand zusätzlich als Text zum Kopieren: Der geht überall, du kannst
// ihn dir selbst schicken und später wieder einfügen.
// ---------------------------------------------------------------------------
function standAlsText() {
  const roh = JSON.stringify({ spiel: 'pfeil-vs-kugeln', fassung: 1, stand: fortschritt });
  // Über UTF-8 nach Base64 - so überlebt der Text auch Umlaute und das
  // Hin- und Herschicken durch Nachrichtenprogramme.
  return 'PFEIL1:' + btoa(unescape(encodeURIComponent(roh)));
}

function standAusText(text) {
  text = (text || '').trim().replace(/\s+/g, '');
  if (text.indexOf('PFEIL1:') === 0) text = text.slice(7);
  try {
    const roh = decodeURIComponent(escape(atob(text)));
    const d = JSON.parse(roh);
    return d.stand || (d.muenzen !== undefined ? d : null);
  } catch (e) { return null; }
}

function standUebernehmen(stand) {
  if (!stand || stand.muenzen === undefined) {
    alert('Das sieht nicht nach einem Spielstand von Pfeil vs. Kugeln aus.');
    return false;
  }
  if (!confirm('Spielstand laden?\n\nNeu:   bestes Level ' + (stand.bestesLevel || 1) +
               ', ' + (stand.muenzen || 0) + ' Münzen\n' +
               'Jetzt: bestes Level ' + fortschritt.bestesLevel + ', ' +
               fortschritt.muenzen + ' Münzen\n\nDein jetziger Stand wird überschrieben.')) return false;
  fortschritt = stand;
  if (fortschritt.daten === undefined) fortschritt.daten = 0;
  if (fortschritt.bauteile === undefined) fortschritt.bauteile = 0;
  if (fortschritt.glut === undefined) fortschritt.glut = 0;
  if (!fortschritt.faehigkeiten) fortschritt.faehigkeiten = {};
  if (!fortschritt.gekauft) fortschritt.gekauft = { pistole: true };
  if (!fortschritt.bestenliste) fortschritt.bestenliste = [];
  if (!fortschritt.hoechsteStufe) fortschritt.hoechsteStufe = 1;
  if (!fortschritt.gewaehlteStufe) fortschritt.gewaehlteStufe = fortschritt.hoechsteStufe;
  speichern();
  hudAktualisieren();
  zeigeMenu();
  return true;
}

// ---------------------------------------------------------------------------
// Spielstand sichern und zurückholen
// Der Fortschritt liegt sonst nur im Browser. Wer den Verlauf löscht oder den
// Browser wechselt, verliert alles - deshalb kann man ihn als Datei ablegen.
// ---------------------------------------------------------------------------
function standSichern() {
  const inhalt = JSON.stringify({ spiel: 'pfeil-vs-kugeln', fassung: 1,
                                  datum: new Date().toISOString(),
                                  stand: fortschritt }, null, 2);
  const blob = new Blob([inhalt], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  const zwei = n => ('0' + n).slice(-2);
  a.href = URL.createObjectURL(blob);
  a.download = 'pfeil-spielstand-' + d.getFullYear() + '-' + zwei(d.getMonth() + 1) +
               '-' + zwei(d.getDate()) + '-Level' + fortschritt.bestesLevel + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  KLANG.kaufen();
}

function standZurueckholen(datei) {
  const leser = new FileReader();
  leser.onload = () => {
    let d;
    try { d = JSON.parse(leser.result); } catch (e) { d = null; }
    standUebernehmen(d && (d.stand || (d.muenzen !== undefined ? d : null)));
  };
  leser.readAsText(datei);
}

function levelGeschafft() {
  KLANG.dauerton(null);
  KLANG.levelFertig();
  if (lauf.testModus) { zeigeBossWahl('geschafft'); return; }
  const boss = lauf.level % 10 === 0;
  if (boss && hat('regeneration')) lauf.hp = Math.min(lauf.hp + EINSTELLUNGEN.heilMenge, maxHp());

  // Forschungsdaten gibt es nur für Bosse und Mini-Bosse - sie sind die
  // Währung des Labors.
  // Die beiden Sonderwährungen fallen erst ab der Stufe an, in der ihr Laden
  // aufmacht - und werden mit jeder weiteren Stufe etwas ergiebiger.
  const stufe = stufeNr(lauf.level);
  function ertrag(menge, abStufe) {
    if (menge <= 0 || stufe < abStufe) return 0;
    return Math.round(menge * (1 + (stufe - abStufe) * EINSTELLUNGEN.stufenErtragBonus));
  }

  // Bauteile fürs Zerlegen der Gegner - die Währung der Werkstatt
  const bauteile = ertrag(
    Math.floor((lauf.abschuesse || 0) / EINSTELLUNGEN.gegnerProBauteil)
    + (boss ? EINSTELLUNGEN.bauteileProBoss : 0), EINSTELLUNGEN.bauteileAbStufe);
  if (bauteile > 0) fortschritt.bauteile += bauteile;
  lauf.bauteileGerade = bauteile;
  lauf.abschuesse = 0;

  const miniGefallen = !!lauf.miniBesiegt;
  lauf.miniBesiegt = false;

  let rohDaten = boss ? EINSTELLUNGEN.datenProBoss : 0;
  if (miniGefallen) rohDaten += EINSTELLUNGEN.datenProMini;
  const daten = ertrag(rohDaten, EINSTELLUNGEN.datenAbStufe);
  if (daten > 0) fortschritt.daten += daten;
  lauf.datenGerade = daten;

  // Glut - die Währung von Schmiede und Arsenal. Gibt es nur von Bossen.
  let rohGlut = boss ? EINSTELLUNGEN.glutProBoss : 0;
  if (miniGefallen) rohGlut += EINSTELLUNGEN.glutProMini;
  const glut = ertrag(rohGlut, EINSTELLUNGEN.glutAbStufe);
  if (glut > 0) fortschritt.glut = (fortschritt.glut || 0) + glut;
  lauf.glutGerade = glut;

  // Stufenaufstieg?
  const alteStufe = stufeNr(lauf.level);
  const neueStufe = stufeNr(lauf.level + 1);
  lauf.aufgestiegen = null;
  if (neueStufe > alteStufe && neueStufe > (fortschritt.hoechsteStufe || 1)) {
    fortschritt.hoechsteStufe = neueStufe;
    lauf.aufgestiegen = STUFEN[neueStufe - 1];
    hinweisZeigen('★ Stufe ' + neueStufe + ' erreicht: ' + STUFEN[neueStufe - 1].name, '#ffd25c');
  }

  const verdient = Math.round(
    (EINSTELLUNGEN.muenzenProLevel(lauf.level) + (boss ? EINSTELLUNGEN.bossBonus : 0)
     + (lauf.bonus || 0)) * muenzBonus());
  lauf.bonus = 0;
  fortschritt.muenzen += verdient;
  fortschritt.bestesLevel = Math.max(fortschritt.bestesLevel, lauf.level + 1);
  lauf.level++;
  speichern();
  hudAktualisieren();
  zeigeLaden(verdient, boss);
}

// Ab Stufe 5 wird jeder Lauf in die Bestenliste eingetragen.
function bestenlisteEintragen(level) {
  if (!fortschritt.bestenliste) fortschritt.bestenliste = [];
  if ((fortschritt.hoechsteStufe || 1) < 5) return false;
  const heute = new Date();
  const datum = ('0' + heute.getDate()).slice(-2) + '.' +
                ('0' + (heute.getMonth() + 1)).slice(-2) + '.' + heute.getFullYear();
  fortschritt.bestenliste.push({ level, datum });
  fortschritt.bestenliste.sort((a, b) => b.level - a.level);
  fortschritt.bestenliste = fortschritt.bestenliste.slice(0, 10);
  return fortschritt.bestenliste[0].level === level;
}

function zeigeTod() {
  MUSIK.aus();
  KLANG.spielerTod();
  if (lauf.testModus) { zeigeBossWahl('tot'); return; }
  zustand = 'tot';
  // Weiter geht es in der Stufe, in der du gefallen bist.
  fortschritt.gewaehlteStufe = grenze(stufeNr(lauf.level), 1, fortschritt.hoechsteStufe || 1);
  const rekord = bestenlisteEintragen(lauf.level);
  // Den Lauf für die Zeile "Zuletzt" im Menü merken.
  fortschritt.letzterLauf = {
    level:      lauf.level,
    sekunden:   Math.round((Date.now() - (lauf.start || Date.now())) / 1000),
    abschuesse: lauf.abschuesseGesamt || 0,
    stufe:      stufeNr(lauf.level),
  };
  speichern();
  overlay.classList.remove('aus');
  overlay.classList.remove('menue');
  document.getElementById('hud').classList.remove('aus');
  karte.className = 'karte';
  const stufe = stufeVon(lauf.level);
  const zurueck = stufenStart(fortschritt.gewaehlteStufe || 1);
  const dauer = fortschritt.letzterLauf.sekunden;
  karte.innerHTML = `
    <h2>Du bist tot 💀</h2>
    ${lauf.todesUrsache
      ? `<p class="todesgrund">☠ ${lauf.todesUrsache}.</p>` : ''}
    <div class="werte" style="margin:0 0 16px">
      <div class="blau"><b>${lauf.level}</b><span>Level erreicht</span></div>
      <div><b>${Math.floor(dauer / 60)}:${('0' + (dauer % 60)).slice(-2)}</b><span>Minuten</span></div>
      <div class="blau"><b>${lauf.abschuesseGesamt || 0}</b><span>Abschüsse</span></div>
    </div>
    <p>Stufe ${stufe.nr}, ${stufe.name}.
       ${rekord ? '<br><b style="color:#ffd25c">Neuer Bestwert in der Bestenliste!</b>' : ''}<br>
       Es geht bei <b>Level ${zurueck}</b> weiter, dem Anfang deiner Stufe.
       Im Menü kannst du auch eine andere wählen.<br>
       Münzen, Forschungsdaten und Waffen behältst du.</p>
    <button class="knopf gross" id="nochmal">Nochmal</button>`;
  document.getElementById('nochmal').onclick = neuerLauf;
}

// ---------------------------------------------------------------------------
// Der Forschungsbaum als Laden. Aufgebaut wie ein Technologiebaum:
// Jeder Knoten hängt an seinen Voraussetzungen, und man kann sich nie alles
// gleichzeitig leisten - man muss sich für einen Zweig entscheiden.
// ---------------------------------------------------------------------------
const SP_BREITE = 190, ZE_HOEHE = 62, KN_BREITE = 162, KN_HOEHE = 50;

function baumHtml() {
  let maxSpalte = 0, maxZeile = 0;
  for (const k of BAUM) {
    if (k.spalte > maxSpalte) maxSpalte = k.spalte;
    if (k.zeile  > maxZeile)  maxZeile  = k.zeile;
  }
  const breite = maxSpalte * SP_BREITE + KN_BREITE;
  const hoehe  = maxZeile  * ZE_HOEHE + KN_HOEHE;

  // Verbindungslinien: erst waagerecht, dann senkrecht, dann wieder waagerecht.
  let linien = '';
  for (const k of BAUM) {
    for (const vid of k.vor) {
      const v = BAUM_NACH_ID[vid];
      const ax = v.spalte * SP_BREITE + KN_BREITE, ay = v.zeile * ZE_HOEHE + KN_HOEHE / 2;
      const bx = k.spalte * SP_BREITE,             by = k.zeile * ZE_HOEHE + KN_HOEHE / 2;
      const mx = (ax + bx) / 2;
      const farbe = (fortschritt.gekauft[vid] && fortschritt.gekauft[k.id]) ? '#3f8a5c'
                  : fortschritt.gekauft[vid] ? '#3d5a8c' : '#212a3f';
      linien += `<path d="M${ax} ${ay} H${mx} V${by} H${bx}" fill="none" stroke="${farbe}" stroke-width="2"/>`;
    }
  }

  const knoten = BAUM.map(k => {
    const gekauft = !!fortschritt.gekauft[k.id];
    const frei = istFrei(k);
    const bezahlbar = fortschritt.muenzen >= k.preis;
    let klasse = 'tk ' + k.typ;
    if (gekauft)        klasse += ' gekauft';
    else if (!frei)     klasse += ' gesperrt';
    else if (!bezahlbar) klasse += ' zuteuer';
    else                klasse += ' kaufbar';

    const fehlt = k.vor.filter(v => !fortschritt.gekauft[v]).map(knotenName).join(', ');
    const preisText = gekauft ? '✓ erforscht' : (frei ? k.preis + ' ⛁' : '🔒 braucht ' + fehlt);

    return `<button class="${klasse}" data-id="${k.id}" title="${k.info}${
              WAFFEN[k.id] ? ' — ≈ ' + schadenProSekunde(k.id) + ' Schaden/s, ' + gewichtVon(k.id) + ' kg' : ''}"
              style="left:${k.spalte * SP_BREITE}px;top:${k.zeile * ZE_HOEHE}px">
              <span class="tkname">${WAFFEN[k.id] ? symbolVon(k.id) + ' ' : ''}${k.name}</span>
              <span class="tkpreis">${preisText}</span>
            </button>`;
  }).join('');

  return `<div class="baumflaeche"><div class="bauminhalt" style="width:${breite}px;height:${hoehe}px">
            <svg width="${breite}" height="${hoehe}" style="position:absolute;left:0;top:0">${linien}</svg>
            ${knoten}
          </div></div>
          <div class="legende">
            <span><i style="background:#5fd0ff"></i>Waffe</span>
            <span><i style="background:#ffb35c"></i>Verbesserung</span>
            <span><i style="background:#7cff9d"></i>Verteidigung</span>
            <span><i style="background:#4ade80"></i>schon erforscht</span>
            <span>Fahr mit der Maus über einen Knoten für Details</span>
          </div>`;
}

// Die Waffenauswahl über dem Forschungsbaum.
function ausruestungHtml() {
  const besitz = besesseneWaffen();
  const gewaehlt = lauf.ausruestung;
  const grenze2 = traglast();
  const last = getragen();
  const anteil = Math.min(1, last / grenze2);

  const knoepfe = besitz.map(id => {
    const platz = gewaehlt.indexOf(id);
    const aktiv = platz >= 0;
    const zuSchwer = !aktiv && last + gewichtVon(id) > grenze2;
    const mag = magazinVon(id);
    return `<button class="wwahl${aktiv ? ' aktiv' : ''}${zuSchwer ? ' voll' : ''}" data-w="${id}"
              title="${WAFFEN[id].name}: ${gewichtVon(id)} kg, ${
                mag ? mag + ' Schuss pro Level' : 'unbegrenzte Munition'}">
              ${aktiv ? '<span class="nr">' + (platz + 1) + '</span>' : ''}<span class="sym">${
                symbolVon(id)}</span>${WAFFEN[id].name}
              <span class="gew">${gewichtVon(id)} kg</span>
              <span class="gew" style="color:#7cff9d">${schadenProSekunde(id)} Sch/s</span>
              <span class="gew" style="color:#7f92b3">${mag ? mag + ' Schuss' : '∞'}</span>
            </button>`;
  }).join('');

  return `<div class="ausruestung">
    <div class="awkopf">🎒 Rucksack für Level ${lauf.level} —
      <b>${last} von ${grenze2} kg</b> beladen.
      Schwere Waffen haben wenig Schuss, leichte viel. Die Pistole wiegt nichts
      und geht nie aus.</div>
    <div class="lastbalken"><i style="width:${(anteil * 100).toFixed(1)}%;
      background:${anteil > .9 ? '#ff5c7a' : anteil > .7 ? '#ffd25c' : '#7cff9d'}"></i></div>
    <div class="awreihe">${knoepfe}</div>
  </div>`;
}

function ausruestungUmschalten(id) {
  const platz = lauf.ausruestung.indexOf(id);
  if (platz >= 0) {
    if (id === 'pistole') return;                  // die bleibt immer dabei
    if (lauf.ausruestung.length <= 1) return;
    lauf.ausruestung.splice(platz, 1);
  } else {
    if (getragen() + gewichtVon(id) > traglast()) return;   // zu schwer
    lauf.ausruestung.push(id);
    ausruestungSortieren();
  }
  if (meineWaffen().indexOf(lauf.waffe) < 0) lauf.waffe = meineWaffen()[0];
  fortschritt.selbstGepackt = true;       // ab jetzt packst du selbst
  fortschritt.ausruestung = lauf.ausruestung.slice();
  KLANG.kaufen();
  speichern();
  hudAktualisieren();
  zeigeLaden(0, false);
}

// Das Labor als zweiter Reiter im Laden.
let ladenReiter = 'forschung';

function laborHtml() {
  // Größe aus den Knoten ableiten - so wächst das Labor einfach mit.
  const maxSp = Math.max(...LABOR.map(k => k.spalte));
  const maxZe = Math.max(...LABOR.map(k => k.zeile));
  const breite = maxSp * SP_BREITE + KN_BREITE;
  const hoehe  = maxZe * ZE_HOEHE + KN_HOEHE;

  let linien = '';
  for (const k of LABOR) {
    for (const vid of k.vor) {
      if (!LABOR_NACH_ID[vid]) continue;      // Voraussetzung liegt im Baum, nicht hier
      const v = LABOR_NACH_ID[vid];
      const ax = v.spalte * SP_BREITE + KN_BREITE, ay = v.zeile * ZE_HOEHE + KN_HOEHE / 2;
      const bx = k.spalte * SP_BREITE,             by = k.zeile * ZE_HOEHE + KN_HOEHE / 2;
      const mx = (ax + bx) / 2;
      const farbe = (fortschritt.gekauft[vid] && fortschritt.gekauft[k.id]) ? '#6b4a9c' : '#2a2340';
      linien += `<path d="M${ax} ${ay} H${mx} V${by} H${bx}" fill="none" stroke="${farbe}" stroke-width="2"/>`;
    }
  }

  const knoten = LABOR.map(k => {
    const gekauft = !!fortschritt.gekauft[k.id];
    const frei = istFrei(k);
    const bezahlbar = fortschritt.daten >= k.preis;
    let klasse = 'tk labor';
    if (gekauft)         klasse += ' gekauft';
    else if (!frei)      klasse += ' gesperrt';
    else if (!bezahlbar) klasse += ' zuteuer';
    else                 klasse += ' kaufbar';
    const fehlt = k.vor.filter(v => !fortschritt.gekauft[v]).map(knotenName).join(', ');
    const preisText = gekauft ? '✓ erforscht' : (frei ? k.preis + ' ⚗' : '🔒 braucht ' + fehlt);
    return `<button class="${klasse}" data-labor="${k.id}" title="${k.info}${
              WAFFEN[k.id] ? ' — ≈ ' + schadenProSekunde(k.id) + ' Schaden/s, ' + gewichtVon(k.id) + ' kg' : ''}"
              style="left:${k.spalte * SP_BREITE}px;top:${k.zeile * ZE_HOEHE}px">
              <span class="tkname">${k.name}</span>
              <span class="tkpreis">${preisText}</span>
            </button>`;
  }).join('');

  return `<div class="baumflaeche"><div class="bauminhalt" style="width:${breite}px;height:${hoehe}px">
            <svg width="${breite}" height="${hoehe}" style="position:absolute;left:0;top:0">${linien}</svg>
            ${knoten}
          </div></div>
          <div class="legende">
            <span><i style="background:#c78bff"></i>Laborwaffe</span>
            <span>Bezahlt wird mit ⚗ Forschungsdaten — die gibt es nur für Bosse und Mini-Bosse</span>
          </div>`;
}

// Ein einfacher Waffenladen: eine Liste mit Kacheln zum Kaufen.
// Wird von Schmiede, Arsenal und dem Fallen-Teil der Werkstatt benutzt.
function waffenladenHtml(liste, waehrung, symbol, hinweis) {
  const habe = fortschritt[waehrung] || 0;
  const karten = liste.map(k => {
    const gekauft = !!fortschritt.gekauft[k.id];
    const bezahlbar = habe >= k.preis;
    const w = WAFFEN[k.id];
    let klasse = 'ladenware';
    if (gekauft)         klasse += ' gekauft';
    else if (!bezahlbar) klasse += ' zuteuer';
    else                 klasse += ' kaufbar';
    return `<button class="${klasse}" data-ladenwaffe="${k.id}" ${gekauft ? 'disabled' : ''}>
        <span class="lwname">${k.name}</span>
        <span class="lwinfo">${k.info}</span>
        <span class="lwfuss">
          <span class="lwdaten">${gewichtVon(k.id)} kg · ${
            magazinVon(k.id) ? magazinVon(k.id) + ' Schuss' : 'ohne Munition'}
            · <span style="color:#7cff9d">≈ ${schadenProSekunde(k.id)} Sch/s</span></span>
          <span class="lwpreis">${gekauft ? '✓ gekauft' : k.preis + ' ' + symbol}</span>
        </span>
      </button>`;
  }).join('');
  return `<div class="ladenliste">${karten}</div>
          <div class="legende"><span>${hinweis}</span></div>`;
}

// Kaufen aus Schmiede, Arsenal oder Werkstatt-Fallen.
function ladenwaffeKaufen(id) {
  const e = LADENWAFFEN[id];
  if (!e || fortschritt.gekauft[id]) return;
  if ((fortschritt[e.waehrung] || 0) < e.k.preis) return;
  fortschritt[e.waehrung] -= e.k.preis;
  fortschritt.gekauft[id] = true;
  if (!lauf.ausruestung) lauf.ausruestung = [];
  if (lauf.ausruestung.indexOf(id) < 0 && getragen() + gewichtVon(id) <= traglast()) {
    lauf.ausruestung.push(id);
    ausruestungSortieren();
    fortschritt.ausruestung = lauf.ausruestung.slice();
  }
  if (lauf.ausruestung.indexOf(id) >= 0) lauf.waffe = id;
  KLANG.kaufen();
  speichern();
  hudAktualisieren();
  zeigeLaden(0, false);
}

function schmiedeHtml() {
  return waffenladenHtml(SCHMIEDE, 'glut', '🔥',
    'Nahkampf: keine Munition, dafür musst du ganz nah heran. Bezahlt wird mit 🔥 Glut — die lassen nur Bosse fallen.');
}

function arsenalHtml() {
  return waffenladenHtml(ARSENAL, 'glut', '🔥',
    'Das Stärkste, was es gibt. Schwer, wenig Schuss — und teuer. Bezahlt wird mit 🔥 Glut.');
}

function werkstattHtml() {
  const plaetze = lauf.faehigkeitPlaetze || [];
  const karten = FAEHIGKEITEN_REIHENFOLGE.map(id => {
    const f = FAEHIGKEITEN[id];
    const stufe = faehigkeitStufe(id);
    const naechste = f.stufen[stufe];                  // undefined = voll ausgebaut
    const bezahlbar = naechste && fortschritt.bauteile >= naechste.preis;
    const drin = plaetze.indexOf(id) >= 0;

    const balken = f.stufen.map((_, i) =>
      `<i class="${i < stufe ? 'voll' : ''}"></i>`).join('');

    const knopf = naechste
      ? `<button class="kaufen" data-fk="${id}" ${bezahlbar ? '' : 'disabled'}>
           ${stufe === 0 ? 'Bauen' : 'Stufe ' + (stufe + 1)} · ${naechste.preis} 🔩</button>`
      : `<button class="kaufen voll" disabled>✓ voll ausgebaut</button>`;

    const mit = stufe > 0
      ? `<button class="kaufen ${drin ? 'voll' : ''}" data-fkslot="${id}">
           ${drin ? '✓ dabei' : 'mitnehmen'}</button>`
      : '';

    return `<div class="fk" style="border-left:3px solid ${f.farbe}">
        <span class="zeichen">${f.zeichen}</span>
        <span class="mitte">
          <span class="fkname">${f.name}${stufe ? ' ' + 'I'.repeat(stufe) : ''}</span>
          <div class="fkinfo">${f.info}</div>
          <div class="fkinfo" style="color:#7f92b3">${
            naechste ? '<b>Nächste Stufe:</b> ' + naechste.zusatz
                     : '<b>Höchste Stufe erreicht.</b>'}</div>
          <div class="stufen">${balken}</div>
        </span>
        ${mit}${knopf}
      </div>`;
  }).join('');

  return `<div class="ausruestung" style="text-align:left">
      <div class="awkopf">🔧 <b>${plaetze.length} von ${EINSTELLUNGEN.faehigkeitSlots}</b> Plätzen belegt.
        Platz 1 löst du mit der <kbd>Leertaste</kbd> aus, Platz 2 mit <kbd>F</kbd>.
        Bezahlt wird mit 🔩 Bauteilen — die fallen beim Zerlegen von Gegnern an.</div>
    </div>
    <div class="fkliste">${karten}</div>
    <div class="awkopf" style="margin-top:18px">🪤 <b>Fallen und Fesseln</b> —
      Waffen, die keinen großen Schaden machen, sondern Gegner festhalten.
      Sie kommen in den Rucksack wie jede andere Waffe.</div>
    ${waffenladenHtml(WERKSTATT_WAFFEN, 'bauteile', '🔩',
      'Auch diese bezahlst du mit 🔩 Bauteilen.')}`;
}

function faehigkeitKaufen(id) {
  const f = FAEHIGKEITEN[id];
  const stufe = faehigkeitStufe(id);
  const naechste = f.stufen[stufe];
  if (!naechste || fortschritt.bauteile < naechste.preis) return;
  fortschritt.bauteile -= naechste.preis;
  if (!fortschritt.faehigkeiten) fortschritt.faehigkeiten = {};
  fortschritt.faehigkeiten[id] = stufe + 1;
  if (stufe === 0) {                                   // neu gebaut: gleich mitnehmen
    if (!lauf.faehigkeitPlaetze) lauf.faehigkeitPlaetze = [];
    if (lauf.faehigkeitPlaetze.length < EINSTELLUNGEN.faehigkeitSlots)
      lauf.faehigkeitPlaetze.push(id);
    fortschritt.faehigkeitPlaetze = lauf.faehigkeitPlaetze.slice();
  }
  KLANG.kaufen();
  speichern();
  hudAktualisieren();
  zeigeLaden(0, false);
}

function laborKaufen(id) {
  const k = LABOR_NACH_ID[id];
  if (!k || fortschritt.gekauft[id] || !istFrei(k) || fortschritt.daten < k.preis) return;
  fortschritt.daten -= k.preis;
  fortschritt.gekauft[id] = true;
  if (!lauf.ausruestung) lauf.ausruestung = [];
  if (lauf.ausruestung.indexOf(id) < 0 && getragen() + gewichtVon(id) <= traglast()) {
    lauf.ausruestung.push(id);
    ausruestungSortieren();
    fortschritt.ausruestung = lauf.ausruestung.slice();
  }
  if (lauf.ausruestung.indexOf(id) >= 0) lauf.waffe = id;
  KLANG.kaufen();
  speichern();
  hudAktualisieren();
  zeigeLaden(0, false);
}

function knotenKaufen(id) {
  const k = BAUM_NACH_ID[id];
  if (!k || fortschritt.gekauft[id] || !istFrei(k) || fortschritt.muenzen < k.preis) return;
  fortschritt.muenzen -= k.preis;
  fortschritt.gekauft[id] = true;
  KLANG.kaufen();
  if (k.typ === 'waffe') {
    // Ist noch ein Platz frei, wandert die neue Waffe direkt in die Ausrüstung.
    if (!lauf.ausruestung) lauf.ausruestung = [];
    if (lauf.ausruestung.indexOf(id) < 0 &&
        getragen() + gewichtVon(id) <= traglast()) {
      lauf.ausruestung.push(id);
      ausruestungSortieren();
      fortschritt.ausruestung = lauf.ausruestung.slice();
    }
    if (lauf.ausruestung.indexOf(id) >= 0) lauf.waffe = id;
  }
  // Eine Panzerung gibt die neuen HP sofort dazu
  if (id.indexOf('panzerung') === 0) lauf.hp += EINSTELLUNGEN.hpProPanzerung;
  speichern();
  hudAktualisieren();
  zeigeLaden(0, false);
}

function zeigeLaden(verdient, warBoss) {
  MUSIK.spiele('laden');
  zustand = 'laden';
  overlay.classList.remove('aus');
  overlay.classList.remove('menue');
  document.getElementById('hud').classList.remove('aus');
  karte.className = 'karte breit';

  // Beim Neuaufbau soll der Baum nicht zurückspringen.
  const alt = karte.querySelector('.baumflaeche');
  const scrollX = alt ? alt.scrollLeft : 0, scrollY = alt ? alt.scrollTop : 0;

  let neuHinweis = '';
  if (lauf.level % 10 === 0) {
    const ba = bossPool(lauf.level)[(Math.floor(lauf.level / 10) - 1) % bossPool(lauf.level).length];
    neuHinweis = `<p class="unterzeile" style="color:#ffd25c;margin:0 0 12px">☠️ <b>${ba.name}</b> — ${ba.info}</p>`;
  } else if (ARTEN_AB[lauf.level]) {
    const a = GEGNERARTEN[ARTEN_AB[lauf.level]];
    const nachBoss = lauf.level % 10 === 1 && lauf.level > 10;
    neuHinweis = `<p class="unterzeile" style="color:${a.farbe};margin:0 0 12px;
        ${nachBoss ? 'border:1px solid ' + a.farbe + '55;border-radius:10px;padding:10px' : ''}">
      ${nachBoss ? '🆕 Der Boss ist besiegt — ein neuer Gegner betritt das Feld:' : '⚠️ Neu ab jetzt:'}
      ${formSvg(a.form, a.farbe, 22)} <b>${a.name}</b> — ${a.info}</p>`;
  }

  const kopf = verdient > 0
    ? `<h2>${warBoss ? 'Boss besiegt! 🏆' : 'Level geschafft!'}</h2>
       <p class="unterzeile" style="margin:0 0 12px">+${verdient} Münzen verdient${
         lauf.datenGerade ? `, dazu <b style="color:#c78bff">+${lauf.datenGerade} ⚗ Forschungsdaten</b>` : ''}${
         lauf.bauteileGerade ? ` und <b style="color:#7cff9d">+${lauf.bauteileGerade} 🔩 Bauteile</b>` : ''}</p>`
    : `<h2>Forschung</h2><p class="unterzeile" style="margin:0 0 12px">Wähle deinen nächsten Zweig.</p>`;

  // Hinweis, solange eine Währung noch gar nicht anfällt
  const jetzigeStufe = stufeNr(lauf.level);
  let sperrHinweis = '';
  if (jetzigeStufe < EINSTELLUNGEN.datenAbStufe)
    sperrHinweis = `<p class="unterzeile" style="margin:0 0 12px;font-size:12px">
      ⚗ Forschungsdaten und 🔩 Bauteile gibt es erst ab Stufe ${EINSTELLUNGEN.datenAbStufe}
      bzw. ${EINSTELLUNGEN.bauteileAbStufe} — hier lohnt sich Sammeln noch nicht.</p>`;
  else if (jetzigeStufe < EINSTELLUNGEN.bauteileAbStufe)
    sperrHinweis = `<p class="unterzeile" style="margin:0 0 12px;font-size:12px">
      🔩 Bauteile gibt es erst ab Stufe ${EINSTELLUNGEN.bauteileAbStufe}, wenn die Werkstatt aufmacht.</p>`;

  const naechsteKarte = karteFuer(lauf.level);
  const naechstesBiom = biomVon(naechsteKarte.biom);
  const kartenHinweis = `<p class="unterzeile" style="margin:0 0 12px">
      ${naechstesBiom.symbol} Nächste Landschaft: <b style="color:#cfdcf0">${naechstesBiom.name}</b>
      — ${naechstesBiom.info}<br>
      🗺️ Karte: <b style="color:#cfdcf0">${naechsteKarte.name} #${naechsteKarte.nummer}</b>
      — ${naechsteKarte.info}${naechsteKarte.dunkel ? ' <b style="color:#5fd0ff">Und es ist stockdunkel.</b>' : ''}</p>`;

  const heilPreis = heilKosten();
  const voll      = lauf.hp >= maxHp();
  const kannHeilen = !voll && !lauf.heilungImLevel && fortschritt.muenzen >= heilPreis;

  const heilText = voll                ? '❤️ HP sind voll'
                 : lauf.heilungImLevel ? '❤️ Schon geheilt — erst nach dem nächsten Level wieder'
                 : `❤️ +${EINSTELLUNGEN.heilMenge} HP · ${heilPreis} ⛁`;

  // Nach einem Stufenaufstieg oben eine Ankündigung
  const stufe = stufeVon(lauf.level);
  const aufstieg = lauf.aufgestiegen ? `
    <p class="unterzeile" style="color:#ffd25c;margin:0 0 12px;border:1px solid #ffd25c55;
       border-radius:10px;padding:11px">
      ★ <b>Stufe ${lauf.aufgestiegen.nr} erreicht: ${lauf.aufgestiegen.name}</b><br>
      ${lauf.aufgestiegen.info}</p>` : '';

  const band = `<div class="stufenband">` + STUFEN.map(st =>

  // Das Labor gibt es ab Stufe 2

  if (ladenReiter === 'schmiede' && !schmiedeOffen) ladenReiter = 'forschung';
  if (ladenReiter === 'arsenal' && !arsenalOffen) ladenReiter = 'forschung';
  const reiter = `<div class="reiter">
      <button id="reiterForschung" class="${ladenReiter === 'forschung' ? 'aktiv' : ''}">
        🔬 Forschungsbaum</button>
      <button id="reiterLabor" class="${ladenReiter === 'labor' ? 'aktiv' : ''}"
        ${laborOffen ? '' : 'disabled'}>
        ⚗ Labor${laborOffen ? '' : ' (ab Stufe 2)'}</button>
      <button id="reiterWerkstatt" class="${ladenReiter === 'werkstatt' ? 'aktiv' : ''}"
        ${werkstattOffen ? '' : 'disabled'}>
        🔧 Werkstatt${werkstattOffen ? '' : ' (ab Stufe 3)'}</button>
      <button id="reiterSchmiede" class="${ladenReiter === 'schmiede' ? 'aktiv' : ''}"
        ${schmiedeOffen ? '' : 'disabled'}>
        🔥 Schmiede${schmiedeOffen ? '' : ' (ab Stufe 4)'}</button>
      <button id="reiterArsenal" class="${ladenReiter === 'arsenal' ? 'aktiv' : ''}"
        ${arsenalOffen ? '' : 'disabled'}>
        🏹 Arsenal${arsenalOffen ? '' : ' (ab Stufe 5)'}</button>
    </div>`;

  karte.innerHTML = kopf + aufstieg + band + sperrHinweis + neuHinweis + kartenHinweis + `
    <div class="baumkopf">
      <span class="bestwert" style="margin:0">Münzen <b>${fortschritt.muenzen} ⛁</b>
        &nbsp;·&nbsp; Daten <b style="color:#c78bff">${fortschritt.daten} ⚗</b>${
          (fortschritt.hoechsteStufe||1) >= 3
            ? ` &nbsp;·&nbsp; Bauteile <b style="color:#7cff9d">${fortschritt.bauteile} 🔩</b>` : ''}${
          (fortschritt.hoechsteStufe||1) >= 4
            ? ` &nbsp;·&nbsp; Glut <b style="color:#ff9d5c">${fortschritt.glut || 0} 🔥</b>` : ''}
        &nbsp;·&nbsp; HP <b>${Math.ceil(lauf.hp)}/${maxHp()}</b>${
          lauf.heilungen > 0 ? ` &nbsp;·&nbsp; <span style="color:#8fa3c4">${lauf.heilungen}× geheilt</span>` : ''}</span>
      <button class="knopf" id="heilen" ${kannHeilen ? '' : 'disabled'}
              style="background:#2a3450;color:#cfe0ff">${heilText}</button>
      <button class="knopf" id="weiter">Weiter zu Level ${lauf.level} →</button>
    </div>` + ausruestungHtml() + reiter +
    (ladenReiter === 'labor'     ? laborHtml() :
     ladenReiter === 'werkstatt' ? werkstattHtml() :
     ladenReiter === 'schmiede'  ? schmiedeHtml() :
     ladenReiter === 'arsenal'   ? arsenalHtml() : baumHtml());

  const flaeche = karte.querySelector('.baumflaeche');
  if (flaeche) { flaeche.scrollLeft = scrollX; flaeche.scrollTop = scrollY; }

  karte.querySelectorAll('.tk.kaufbar').forEach(b => {
    b.onclick = () => knotenKaufen(b.dataset.id);
  });
  karte.querySelectorAll('.wwahl').forEach(b => {
    b.onclick = () => ausruestungUmschalten(b.dataset.w);
  });
  karte.querySelectorAll('.tk.labor.kaufbar').forEach(b => {
    b.onclick = () => laborKaufen(b.dataset.labor);
  });
  karte.querySelectorAll('[data-fk]').forEach(b => {
    b.onclick = () => faehigkeitKaufen(b.dataset.fk);
  });
  karte.querySelectorAll('[data-fkslot]').forEach(b => {
    b.onclick = () => faehigkeitUmschalten(b.dataset.fkslot);
  });
  const rF = document.getElementById('reiterForschung');
  const rL = document.getElementById('reiterLabor');
  const rW = document.getElementById('reiterWerkstatt');
  if (rF) rF.onclick = () => { ladenReiter = 'forschung'; zeigeLaden(0, false); };
  if (rL && laborOffen) rL.onclick = () => { ladenReiter = 'labor'; zeigeLaden(0, false); };
  if (rW && werkstattOffen) rW.onclick = () => { ladenReiter = 'werkstatt'; zeigeLaden(0, false); };
  const rS = document.getElementById('reiterSchmiede');
  const rA = document.getElementById('reiterArsenal');
  if (rS && schmiedeOffen) rS.onclick = () => { ladenReiter = 'schmiede'; zeigeLaden(0, false); };
  if (rA && arsenalOffen)  rA.onclick = () => { ladenReiter = 'arsenal';  zeigeLaden(0, false); };
  karte.querySelectorAll('[data-ladenwaffe]').forEach(b => {
    b.onclick = () => ladenwaffeKaufen(b.dataset.ladenwaffe);
  });
  const heilKnopf = document.getElementById('heilen');
  if (kannHeilen) heilKnopf.onclick = () => {
    fortschritt.muenzen -= heilPreis;
    KLANG.heilen();
    lauf.hp = Math.min(maxHp(), lauf.hp + EINSTELLUNGEN.heilMenge);
    lauf.heilungen++;                     // die nächste Heilung wird teurer
    lauf.heilungImLevel = true;           // und erst im nächsten Level wieder möglich
    speichern(); hudAktualisieren(); zeigeLaden(0, false);
  };
  document.getElementById('weiter').onclick = () => levelStarten(lauf.level);
}

// ============================================================================
// Hauptschleife
// ============================================================================
let letzteZeit = performance.now();
let uhr = 0;                       // läuft immer mit, auch im Menü
function schleife(zeit) {
  const dt = Math.min((zeit - letzteZeit) / 1000, 0.05);
  letzteZeit = zeit;
  uhr += dt;
  MUSIK.planer();                     // plant die nächsten Töne im Voraus
  if (zustand === 'spiel') aktualisieren(dt);
  zeichnen(dt);
  requestAnimationFrame(schleife);
}

document.getElementById('hudMusik').onclick = () => {
  KLANG.starten();
  MUSIK.an = !MUSIK.an;
  fortschritt.musik = MUSIK.an;
  speichern();
  hudAktualisieren();
};

document.getElementById('hudTon').onclick = () => {
  KLANG.starten();
  KLANG.an = !KLANG.an;
  if (!KLANG.an) KLANG.dauerton(null);
  fortschritt.ton = KLANG.an;
  speichern();
  hudAktualisieren();
};

hudAktualisieren();
zeigeMenu();
requestAnimationFrame(schleife);
</script>
</body>
</html>
