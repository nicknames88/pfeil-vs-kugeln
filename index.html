    // Der Dunkle-Materie-Blaster verschluckt gegnerische Schüsse.
    if (k.schluckt)
      for (const gk of gegnerSchuesse) {
        if (gk.tot) continue;
        if (Math.hypot(gk.x - k.x, gk.y - k.y) < k.schluckt) {
          gk.tot = true;
          funken(gk.x, gk.y, '#c78bff', 3);
        }
      }

    k.x += k.vx * dt; k.y += k.vy * dt;

    // Das Katapult schlägt nach seiner Flugzeit ein, egal wo es gerade ist.
    if (k.einschlagNach) {
      k.einschlagNach -= dt;
      if (k.einschlagNach <= 0) { explodieren(k); k.tot = true; continue; }
    }

    // Gegen eine Mauer? Dann ist hier Schluss - außer die Waffe fliegt drüber.
    if (!k.ueberMauern && stecktFest(k.x, k.y, k.r)) {
      if (k.sprengradius) explodieren(k);
      else funken(k.x, k.y, '#ffd25c', 4);
      k.tot = true;
    }
  }
  schuesse = schuesse.filter(k => !k.tot && inDerWelt(k));

  for (const k of schuesse) {
    // Minen zünden über ihren Zündradius, schwarze Löcher gehen nicht bei
    // Berührung kaputt - sie sollen ja erst saugen und dann hochgehen.
    if (k.tot || k.mine || k.loch) continue;
    for (const g of gegner) {
      if (g.leben <= 0 || k.getroffen.indexOf(g) >= 0) continue;
      if (g.verbuendet > 0) continue;              // auf eigene Leute schießt man nicht
      if (Math.hypot(k.x - g.x, k.y - g.y) < k.r + g.r) {
        let wucht = k.schaden;
        if (k.fernbonus) {
          // Je weiter die Kugel geflogen ist, desto härter schlägt sie ein.
          const strecke = Math.hypot(k.x - k.startX, k.y - k.startY);
          wucht *= 1 + Math.min(1, strecke / k.fernbonus) * k.fernFaktor;
        }
        schadenAn(g, wucht, k.x - k.vx * .05, k.y - k.vy * .05);
        if (k.frostet) g.frost = k.frostet;
        trefferWirkung(k, g);
        k.getroffen.push(g);
        if (k.sprengradius) { explodieren(k); k.tot = true; }
        else {
          funken(k.x, k.y, '#ffd25c', 5);
          KLANG.treffer(k.x, k.y);
          k.rest--;
          if (k.rest <= 0) k.tot = true;
        }
        if (k.tot) break;
      }
    }
  }
  schuesse = schuesse.filter(k => !k.tot);

  // --- Gegner ---
  // In der Zeitlupe läuft für sie die Zeit langsamer, für dich nicht.
  const gdt = dt * (zeitlupeRest > 0 ? zeitlupeFaktor : 1);
  nachschub = [];

  // Wegfeld neu rechnen, wenn du die Rasterzelle wechselst (oder alle .4 s)
  feldTimer -= dt;
  const jetztZelle = zelleVon(s.x, s.y);
  if (jetztZelle !== feldZelle || feldTimer <= 0) {
    feldZelle = jetztZelle;
    feldTimer = .4;
    wegfeldRechnen(jetztZelle);
  }

  markenVerteilen(dt, level);
  const bedrohung = bedrohungDurchSpieler();

  for (const g of gegner) {
    if (g.treffer > 0) g.treffer -= gdt;
    // Steht ein übernommener Gegner näher als du? Dann gilt der als Ziel -
    // sonst wäre der Gehirn-Hacker nur ein hübscher Farbwechsel.
    let zielX = s.x, zielY = s.y;
    if (!g.verbuendet) {
      let naechsterFreund = null, bestFreund = 340;
      for (const v of gegner) {
        if (!(v.verbuendet > 0) || v.leben <= 0) continue;
        const e = Math.hypot(v.x - g.x, v.y - g.y);
        if (e < bestFreund) { bestFreund = e; naechsterFreund = v; }
      }
      if (naechsterFreund && bestFreund < Math.hypot(s.x - g.x, s.y - g.y)) {
        zielX = naechsterFreund.x; zielY = naechsterFreund.y;
        g.greiftFreundAn = naechsterFreund;
        // Berührung tut dem Verbündeten weh - so kann er auch fallen.
        if (bestFreund < g.r + naechsterFreund.r + 8)
          schadenAn(naechsterFreund, 22 * gdt, g.x, g.y);
      } else g.greiftFreundAn = null;
    }

    const dx = zielX - g.x, dy = zielY - g.y;
    const d = Math.hypot(dx, dy) || 1;
    const zielWinkel = Math.atan2(dy, dx);
    g.winkel = zielWinkel;                       // gerichtete Formen schauen dich an
    g.eigenDrehung += dt * 0.7;                  // runde Formen drehen sich langsam

    // Eingefroren? Dann alles nur noch im Zeitlupentempo.
    if (g.frost > 0) g.frost -= gdt;
    const frostF = g.frost > 0 ? 0.45 : 1;

    // --- Wirkungen der neuen Waffen ------------------------------------
    // Nanobots nagen weiter, auch wenn der Schuss längst vorbei ist.
    if (g.nanoZeit > 0) {
      g.nanoZeit -= gdt;
      schadenAn(g, g.nano * gdt, g.x, g.y);
      if (Math.random() < .25)
        partikel.push({ x: g.x + zufall(-g.r, g.r), y: g.y + zufall(-g.r, g.r),
                        vx: 0, vy: -20, leben: .3, farbe: '#7cff9d' });
    }

    // Der Parasit saugt - und springt weiter, wenn seine Zeit um ist.
    if (g.parasit) {
      g.parasit.zeit -= gdt;
      schadenAn(g, g.parasit.schaden * gdt, g.x, g.y);
      if (Math.random() < .3)
        partikel.push({ x: g.x + zufall(-g.r, g.r), y: g.y + zufall(-g.r, g.r),
                        vx: zufall(-15, 15), vy: zufall(-15, 15), leben: .35, farbe: '#c78bff' });
      if (g.parasit.zeit <= 0) {
        const alt = g.parasit;
        g.parasit = null;
        let naechster = null, best = alt.sprungWeite;
        for (const a of gegner) {
          if (a === g || a.leben <= 0 || a.parasit) continue;
          const d = Math.hypot(a.x - g.x, a.y - g.y);
          if (d < best) { best = d; naechster = a; }
        }
        // Der Parasit springt weiter - beim Sprung verliert er etwas Kraft.
        if (naechster) {
          naechster.parasit = { zeit: 3.2, schaden: alt.schaden * .8,
                                sprungWeite: alt.sprungWeite };
          funken(naechster.x, naechster.y, '#c78bff', 10);
        }
      }
    }

    // Blitzfessel: die Gefesselten ziehen sich gegenseitig und nehmen Schaden.
    if (g.gefesselt) {
      g.gefesselt.zeit -= gdt;
      schadenAn(g, g.gefesselt.schaden * gdt, g.x, g.y);
      for (const a of g.gefesselt.gruppe) {
        if (a === g || a.leben <= 0) continue;
        const dx = a.x - g.x, dy = a.y - g.y, d = Math.hypot(dx, dy) || 1;
        if (d > 120) { g.x += dx / d * 90 * gdt; g.y += dy / d * 90 * gdt; }
      }
      if (g.gefesselt.zeit <= 0) g.gefesselt = null;
    }

    // Versteinert: der Gegner steht einfach nur da.
    if (g.stein > 0) {
      g.stein -= gdt;
      if (Math.random() < .12)
        partikel.push({ x: g.x + zufall(-g.r, g.r), y: g.y + zufall(-g.r, g.r),
                        vx: 0, vy: 30, leben: .4, farbe: '#b8a890' });
      continue;                          // tut diese Runde gar nichts
    }

    // Übernommen: kämpft für dich, bis die Zeit um ist.
    if (g.verbuendet > 0) {
      g.verbuendet -= gdt;
      let ziel = null, best = 1e9;
      for (const a of gegner) {
        if (a === g || a.leben <= 0 || a.verbuendet > 0) continue;
        const d = Math.hypot(a.x - g.x, a.y - g.y);
        if (d < best) { best = d; ziel = a; }
      }
      if (ziel) {
        const dx = ziel.x - g.x, dy = ziel.y - g.y, d = Math.hypot(dx, dy) || 1;
        g.winkel = Math.atan2(dy, dx);
        bewegenMitMauern(g, dx / d, dy / d, g.tempo * 1.15 * gdt);
        if (d < g.r + ziel.r + 6) schadenAn(ziel, 26 * gdt, g.x, g.y);
      }
      if (Math.random() < .3)
        partikel.push({ x: g.x + zufall(-g.r, g.r), y: g.y + zufall(-g.r, g.r),
                        vx: 0, vy: -25, leben: .3, farbe: '#7cff9d' });
      if (g.verbuendet <= 0) { g.leben = 0; funken(g.x, g.y, '#7cff9d', 16); }
      continue;                          // kümmert sich nicht mehr um dich
    }

    // Rückstoß aus einer Schockwelle klingt schnell ab.
    if (g.stossX) {
      g.x += g.stossX * gdt; g.y += g.stossY * gdt;
      const abkling = Math.pow(0.02, dt);
      g.stossX *= abkling; g.stossY *= abkling;
      if (Math.abs(g.stossX) + Math.abs(g.stossY) < 8) { g.stossX = 0; g.stossY = 0; }
    }

    // --- Sehen, merken, suchen -----------------------------------------
    const sieht = kannSehen(g);
    if (sieht) {
      g.siehtSpieler = true;
      g.letzterOrtX = s.x; g.letzterOrtY = s.y;
      g.suchZeit = EINSTELLUNGEN.suchDauer;
      // Kameraden in der Nähe Bescheid geben
      if (!g.alarmiert) {
        g.alarmiert = true;
        for (const a of gegner) {
          if (a === g || a.siehtSpieler) continue;
          if (Math.hypot(a.x - g.x, a.y - g.y) > EINSTELLUNGEN.alarmWeite) continue;
          a.letzterOrtX = s.x; a.letzterOrtY = s.y;
          a.suchZeit = Math.max(a.suchZeit || 0, EINSTELLUNGEN.suchDauer);
        }
      }
    } else {
      g.siehtSpieler = false;
      g.alarmiert = false;
      if (g.suchZeit > 0) {
        g.suchZeit -= gdt;
        if (g.suchZeit <= 0) {
          // Nichts gefunden - also weiter in die Gegend, aus der der Lärm kam.
          // Sie verlieren dich kurz, aber nicht für immer.
          g.letzterOrtX = s.x + zufall(-EINSTELLUNGEN.streifZone, EINSTELLUNGEN.streifZone);
          g.letzterOrtY = s.y + zufall(-EINSTELLUNGEN.streifZone, EINSTELLUNGEN.streifZone);
          g.suchZeit = EINSTELLUNGEN.suchDauer;
        }
      }
    }

    // Blickrichtung: zum Spieler, sonst zur letzten bekannten Stelle
    const blickZiel = sieht ? Math.atan2(s.y - g.y, s.x - g.x)
                    : (g.suchZeit > 0 ? Math.atan2(g.letzterOrtY - g.y, g.letzterOrtX - g.x)
                                      : g.blick + .6);
    let bd = blickZiel - g.blick;
    while (bd >  Math.PI) bd -= Math.PI * 2;
    while (bd < -Math.PI) bd += Math.PI * 2;
    g.blick += grenze(bd, -EINSTELLUNGEN.blickDrehen * gdt, EINSTELLUNGEN.blickDrehen * gdt);

    // Reaktionszeit: Gegner sehen deine Position erst mit kurzer Verzögerung.
    g.merkZeit -= gdt;
    if (g.merkZeit <= 0) {
      g.merkZeit = EINSTELLUNGEN.kiReaktion;
      g.zielX = s.x; g.zielY = s.y; g.zielVX = s.vx; g.zielVY = s.vy;
      // Auch die Ausweichrichtung wird nur so oft neu überlegt. Dadurch reagieren
      // sie ruckartig wie ein Mensch statt die Flugbahn perfekt zu verfolgen.
      let aus = null;
      if (level >= EINSTELLUNGEN.kiAusweichenAb && g.art.ausweichen) aus = ausweichRichtung(g);
      g.ausweichX = aus ? aus.x : 0;
      g.ausweichY = aus ? aus.y : 0;

      // Lange Nachladepause oder fast tot? Dann lieber hinter eine Mauer.
      const angeschlagen = g.leben / g.maxLeben < EINSTELLUNGEN.deckungLeben;
      const pause = !g.marke && g.nachladen > EINSTELLUNGEN.deckungAb;
      if (!g.boss && !g.marke && hindernisse.length && (angeschlagen || pause) && !g.deckung)
        g.deckung = deckungSuchen(g);
      else if (g.deckung && !angeschlagen && g.nachladen < .3) g.deckung = null;
    }

    // --- Sonderfähigkeiten der späteren Gegnertypen ---------------------
    if (g.art.frontschild) {                    // Schild dreht sich nur langsam mit
      let diff = zielWinkel - g.schildWinkel;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      g.schildWinkel += grenze(diff, -g.art.frontschild.drehTempo * gdt,
                                      g.art.frontschild.drehTempo * gdt);
    }

    if (g.art.heilt) {                          // Sanitäter flickt seine Kollegen
      g.heilTimer -= gdt * frostF;
      if (g.heilTimer <= 0) {
        g.heilTimer = g.art.heilt.takt;
        for (const anderer of gegner) {
          if (anderer === g || anderer.leben >= anderer.maxLeben) continue;
          if (Math.hypot(anderer.x - g.x, anderer.y - g.y) > g.art.heilt.reichweite) continue;
          anderer.leben = Math.min(anderer.maxLeben, anderer.leben + g.art.heilt.menge);
          heilstrahlen.push({ x1: g.x, y1: g.y, x2: anderer.x, y2: anderer.y, leben: .45, dauer: .45 });
        }
      }
    }

    if (g.art.springt) {                        // Springer blinzelt weg
      g.springTimer -= gdt * frostF;
      if (g.springTimer <= 0) {
        // Mini-Bosse blinzeln seltener - sonst kriegt man sie kaum zu fassen.
        g.springTimer = g.art.springt.takt * (g.mini ? 1.7 : 1) * zufall(.7, 1.3);
        funken(g.x, g.y, g.art.farbe, 14);
        // Er springt bevorzugt dorthin, wo du gerade NICHT hinschaust:
        // hinter deinen Rücken. Notfalls irgendwohin, wo Platz ist.
        for (let versuch = 0; versuch < 10; versuch++) {
          const w = versuch < 5 ? s.winkel + Math.PI + zufall(-.7, .7)
                                : g.ringWinkel + zufall(1.2, 2.6) * (Math.random() < .5 ? 1 : -1);
          const nx = grenze(s.x + Math.cos(w) * g.art.abstand, g.r, WELT.b - g.r);
          const ny = grenze(s.y + Math.sin(w) * g.art.abstand, g.r, WELT.h - g.r);
          if (!stecktFest(nx, ny, g.r)) { g.ringWinkel = w; g.x = nx; g.y = ny; break; }
        }
        funken(g.x, g.y, g.art.farbe, 14);
        KLANG.teleport(g.x, g.y);
      }
    }

    if (g.art.gebaert) {                        // Schwarmmutter schickt Nachwuchs
      g.gebaerTimer -= gdt * frostF;
      if (g.gebaerTimer <= 0) {
        g.gebaerTimer = g.art.gebaert.takt;
        let vorhanden = 0;
        for (const a of gegner) if (a.artName === g.art.gebaert.art) vorhanden++;
        const grenzeKinder = g.mini ? Math.ceil(g.art.gebaert.max / 2) : g.art.gebaert.max;
        if (vorhanden < grenzeKinder) {
          const kind = neuerGegner(level, g.art.gebaert.art);
          const a = Math.random() * Math.PI * 2;
          kind.x = grenze(g.x + Math.cos(a) * 60, 70, WELT.b - 70);
          kind.y = grenze(g.y + Math.sin(a) * 60, 70, WELT.h - 70);
          nachschub.push(kind);
          funken(kind.x, kind.y, g.art.farbe, 10);
        }
      }
    }

    if (g.boss && g.art.angriff === 'sturm') {
      sturmBossBewegen(g, dt, zielWinkel);
    } else if (g.art.sturm && g.marke) {
      rammbockBewegen(g, dt, s, frostF);
    } else if (g.art.jagt && g.marke) {
      // Bomber laufen nicht mehr hinterher, sondern schneiden den Weg ab:
      // Sie zielen dorthin, wo du sein wirst, wenn sie ankommen.
      const weg = sichtFrei(g.x, g.y, s.x, s.y) ? null : wegRichtung(g.x, g.y);
      if (weg) {
        bewegenMitMauern(g, weg.x, weg.y, g.tempo * frostF * gdt);
      } else {
        const flug = d / Math.max(1, g.tempo);
        const zx = s.x + s.vx * flug * .85, zy = s.y + s.vy * flug * .85;
        const ax = zx - g.x, ay = zy - g.y, al = Math.hypot(ax, ay) || 1;
        bewegenMitMauern(g, ax / al, ay / al, g.tempo * frostF * gdt);
      }
    } else {
      // Statt stumpf auf den Spieler zuzulaufen, steuert jeder Gegner einen
      // Punkt auf einem Ring um dich herum an - und wandert langsam darauf
      // weiter. Dadurch umzingeln sie dich von selbst.
      g.wechsel -= gdt;
      if (g.wechsel <= 0) { g.richtung *= -1; g.wechsel = zufall(2.5, 5); }

      if (g.marke && g.slotWinkel !== undefined) {
        // Angreifer schwenken auf ihren zugewiesenen Platz im Kreuzfeuer.
        let diff = g.slotWinkel - g.ringWinkel;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        g.ringWinkel += grenze(diff, -EINSTELLUNGEN.slotDrehen * gdt,
                                      EINSTELLUNGEN.slotDrehen * gdt);
      } else {
        g.ringWinkel += (g.art.umkreisen || .3) * g.richtung * gdt;
      }

      // Wie weit will er weg stehen? Das hängt jetzt von vielem ab:
      // Marke, Rolle, deiner Waffe, seinem Zustand und der Kampfmoral.
      let wunsch = g.art.abstand + bedrohung.plus;
      if (!g.marke) wunsch *= EINSTELLUNGEN.warteAbstand;
      if (g.art.rolle === 'front') wunsch *= .78;          // Panzer gehen näher ran
      if (g.art.rolle === 'hinten') wunsch *= 1.15;        // Schützen bleiben zurück
      if (g.leben / g.maxLeben < EINSTELLUNGEN.deckungLeben) wunsch *= 1.6;
      wunsch *= grenze(1.9 - moral, .72, 1.4);             // mutig = näher dran
      wunsch = Math.max(90, wunsch);

      let bx, by;
      const freieSicht = sichtFrei(g.x, g.y, s.x, s.y);

      // Der Sanitäter sucht sich einen Panzer und bleibt in seinem Windschatten.
      let schuetzling = null;
      if (g.art.rolle === 'stuetze') {
        let kurz = 1e9;
        for (const a of gegner) {
          if (a === g || a.art.rolle !== 'front') continue;
          const d2 = Math.hypot(a.x - g.x, a.y - g.y);
          if (d2 < kurz) { kurz = d2; schuetzling = a; }
        }
      }

      if (!g.siehtSpieler && g.suchZeit > 0 && !g.deckung) {
        // Er hat dich verloren und geht zur letzten bekannten Stelle.
        const dx2 = g.letzterOrtX - g.x, dy2 = g.letzterOrtY - g.y;
        if (Math.hypot(dx2, dy2) > 70) { bx = dx2; by = dy2; }
        else { bx = Math.cos(g.blick); by = Math.sin(g.blick); }   // dort umsehen
      } else if (schuetzling) {
        // hinter den Panzer stellen, vom Spieler aus gesehen
        const wx = schuetzling.x - s.x, wy = schuetzling.y - s.y;
        const wl = Math.hypot(wx, wy) || 1;
        const zx = schuetzling.x + (wx / wl) * EINSTELLUNGEN.stuetzeAbstand;
        const zy = schuetzling.y + (wy / wl) * EINSTELLUNGEN.stuetzeAbstand;
        bx = zx - g.x; by = zy - g.y;
      } else if (g.deckung) {
        // Auf dem Weg in die Deckung
        bx = g.deckung.x - g.x; by = g.deckung.y - g.y;
        if (Math.hypot(bx, by) < 40) g.deckung = null;
      } else if (!freieSicht) {
        // Keine Sicht: dem Strömungsfeld folgen, bis er dich wieder sieht
        const weg = wegRichtung(g.x, g.y);
        if (weg) { bx = weg.x; by = weg.y; }
        else { bx = s.x - g.x; by = s.y - g.y; }
      } else {
        const zx = s.x + Math.cos(g.ringWinkel) * wunsch;
        const zy = s.y + Math.sin(g.ringWinkel) * wunsch;
        bx = zx - g.x; by = zy - g.y;
      }
      const bl = Math.hypot(bx, by) || 1;
      bx /= bl; by /= bl;

      // Der Ziellinie eines Lasers ausweichen: seitlich wegtreten,
      // statt brav in der Schusslinie stehen zu bleiben.
      if (bedrohung.linie) {
        const rx = Math.cos(s.winkel), ry = Math.sin(s.winkel);
        const t = (g.x - s.x) * rx + (g.y - s.y) * ry;
        if (t > 0 && t < 700) {
          const quer = (g.x - s.x) * ry - (g.y - s.y) * rx;
          if (Math.abs(quer) < 90) {
            const seite = quer >= 0 ? 1 : -1;
            bx += ry * seite * EINSTELLUNGEN.laserMeiden;
            by += -rx * seite * EINSTELLUNGEN.laserMeiden;
          }
        }
      }

      // Ankommenden Kugeln ausweichen (erst ab einem gewissen Level)
      const kraft = EINSTELLUNGEN.kiAusweichKraft * (g.art.ausweichen || 0);
      bx += g.ausweichX * kraft;
      by += g.ausweichY * kraft;
      // Abstand zu den eigenen Leuten halten
      const tr = trennung(g);
      bx += tr.x * 1.6; by += tr.y * 1.6;

      // Nach einem Schuss kurz die Stellung wechseln (Scharfschütze)
      if (g.versetzen > 0) {
        g.versetzen -= gdt;
        bx += -Math.sin(g.ringWinkel) * g.richtung * 1.8;
        by +=  Math.cos(g.ringWinkel) * g.richtung * 1.8;
      }

      const bl2 = Math.hypot(bx, by) || 1;
      bewegenMitMauern(g, bx / bl2, by / bl2, g.tempo * frostF * gdt);
    }
    g.x = grenze(g.x, g.r, WELT.b - g.r);
    g.y = grenze(g.y, g.r, WELT.h - g.r);
    ausMauerSchieben(g);

    g.nachladen -= gdt * frostF;                  // eingefroren wird auch langsamer geschossen
    if (g.nachladen <= 0) {
      // Fair bleiben: aus dem Nichts weit außerhalb des Bildes wird nicht gefeuert.
      if (!g.siehtSpieler) {
        g.nachladen = 0.4;                 // sieht dich nicht: gleich nochmal prüfen
      } else if (!g.marke) {
        g.nachladen = 0.5;                 // wartet auf seinen Zug
      } else if (g.boss) {
        bossAngriff(g, level, zielWinkel);
        if (g.mini) g.nachladen *= EINSTELLUNGEN.miniTakt;   // gemächlicher als das Original
      } else {
        gegnerSchiessen(g, level, zielWinkel);
        // Angreifer feuern genau so viel schneller, wie andere gerade pausieren -
        // und mutige Gruppen feuern zusätzlich schneller.
        g.nachladen /= markenAusgleich * grenze(moral, .75, 1.35) * EINSTELLUNGEN.kiDruck;
        if (g.art.versetzen) g.versetzen = g.art.versetzen;
      }
    }

    // Zusätzliches Dauerfeuer zwischen den großen Angriffen (nur manche Bosse).
    if (g.boss && g.art.nebenfeuer) {
      const nf = g.art.nebenfeuer;
      g.nebenNachladen -= gdt;
      if (g.nebenNachladen <= 0) {
        g.nebenNachladen = nf.takt;
        for (let i = 0; i < nf.anzahl; i++) {
          const versatz = (i - (nf.anzahl - 1) / 2) * nf.streuung;
          gegnerSchuss(g, zielWinkel + versatz, level, { tempoF: nf.tempoF });
        }
      }
    }

    if (d < g.r + s.r) {
      if (g.art.explodiert) g.leben = 0;        // Bomber geht dabei selbst hoch
      else spielerTrifftEs(schadenStufe(g.art.beruehrung || 12, level),
                            (g.boss ? '' : 'Ein ') + g.art.name + (g.boss ? '' : ' hat dich gerammt'));
    }
  }

  for (const g of gegner) {
    if (g.leben > 0) continue;
    funken(g.x, g.y, g.art.farbe, g.boss ? (g.mini ? 34 : 60) : 16);
    ruckeln = Math.min(ruckeln + (g.boss ? (g.mini ? 9 : 14) : 4), 18);
    KLANG.gegnerTod(g.boss && !g.mini, g.x, g.y);
    lauf.abschuesse = (lauf.abschuesse || 0) + (g.boss ? (g.mini ? 3 : 6) : 1);
    lauf.abschuesseGesamt = (lauf.abschuesseGesamt || 0) + 1;
    // Jeder Gefallene drückt auf die Stimmung der Übriggebliebenen.
    moral = grenze(moral - EINSTELLUNGEN.moralVerlust * (g.boss ? 2 : 1),
                   EINSTELLUNGEN.moralMin, EINSTELLUNGEN.moralMax);
    if (g.mini) {
      KLANG.explosion(true, g.x, g.y);
      lauf.bonus = (lauf.bonus || 0) + EINSTELLUNGEN.miniBonus;
      lauf.miniBesiegt = true;
      hinweisZeigen('Mini-Boss besiegt · +' + EINSTELLUNGEN.miniBonus + ' Münzen', '#ffd25c');
    }

    // Teiler zerfällt in kleinere Splitter
    if (g.art.teiltIn) {
      for (let i = 0; i < g.art.teiltIn.anzahl; i++) {
        const teil = neuerGegner(level, g.art.teiltIn.art);
        const a = (i / g.art.teiltIn.anzahl) * Math.PI * 2 + Math.random();
        teil.x = grenze(g.x + Math.cos(a) * 34, 70, WELT.b - 70);
        teil.y = grenze(g.y + Math.sin(a) * 34, 70, WELT.h - 70);
        nachschub.push(teil);
      }
    }

    // Bomber explodiert und reißt dich mit, wenn du zu nah stehst
    if (g.art.explodiert) {
      const ex = g.art.explodiert;
      explosionen.push({ x: g.x, y: g.y, r: ex.radius, leben: .45, dauer: .45, feindlich: true });
      KLANG.explosion(true, g.x, g.y);
      funken(g.x, g.y, '#ff6b3d', 44);
      ruckeln = Math.min(ruckeln + 12, 18);
      if (Math.hypot(spieler.x - g.x, spieler.y - g.y) < ex.radius + spieler.r)
        spielerTrifftEs(schadenStufe(ex.schaden, level), 'Ein ' + g.art.name + ' ist neben dir hochgegangen');
    }
  }
  gegner = gegner.filter(g => g.leben > 0);
  if (nachschub.length) gegner = gegner.concat(nachschub);

  // --- Gegnerschüsse (inklusive Lenkraketen) ---
  const kdt = dt * (zeitlupeRest > 0 ? zeitlupeFaktor : 1);
  for (const k of gegnerSchuesse) {
    if (k.rakete) {
      k.restzeit -= kdt;
      if (k.restzeit <= 0) {                       // nach 3 Sekunden ist Schluss
        k.tot = true;
        funken(k.x, k.y, '#ffd25c', 10);
        continue;
      }
      // Sanft in Richtung Spieler eindrehen - nicht sofort, sondern mit
      // begrenzter Drehkraft. Deshalb kann man sie durch Ausweichen abhängen.
      const ziel = Math.atan2(s.y - k.y, s.x - k.x);
      let jetzt = Math.atan2(k.vy, k.vx);
      let diff = ziel - jetzt;
      while (diff >  Math.PI) diff -= Math.PI * 2;   // kürzesten Drehweg nehmen
      while (diff < -Math.PI) diff += Math.PI * 2;
      jetzt += grenze(diff, -k.drehkraft * kdt, k.drehkraft * kdt);
      const tempo = Math.hypot(k.vx, k.vy);
      k.vx = Math.cos(jetzt) * tempo;
      k.vy = Math.sin(jetzt) * tempo;
      k.winkel = jetzt;
      if (Math.random() < 0.6)                       // Rauchfahne
        partikel.push({ x: k.x, y: k.y, vx: zufall(-25, 25), vy: zufall(-25, 25),
                        leben: zufall(0.12, 0.32), farbe: '#ffa53d' });
    }
    // Bossminen (Der Sämann) bleiben liegen, bis ihre Zeit um ist.
    if (k.liegt) {
      k.liegt -= kdt;
      if (k.liegt <= 0) { funken(k.x, k.y, '#7cff9d', 8); k.tot = true; }
      else if (Math.random() < .15)
        partikel.push({ x: k.x + zufall(-8, 8), y: k.y + zufall(-8, 8),
                        vx: 0, vy: -18, leben: .3, farbe: '#7cff9d' });
      continue;                                  // fliegt nicht, bleibt liegen
    }

    // Schüsse des Echos platzen unterwegs in mehrere auf.
    if (k.teiltNach) {
      k.teiltNach -= kdt;
      if (k.teiltNach <= 0) {
        const tempo = Math.hypot(k.vx, k.vy) || 200;
        const grund = Math.atan2(k.vy, k.vx);
        for (let i = 0; i < k.teilAnzahl; i++) {
          const a = grund + (i - (k.teilAnzahl - 1) / 2) * .38;
          gegnerSchuesse.push({ x: k.x, y: k.y, r: 5, winkel: a,
                                schaden: Math.round(k.schaden * .7),
                                vx: Math.cos(a) * tempo * 1.25,
                                vy: Math.sin(a) * tempo * 1.25 });
        }
        funken(k.x, k.y, '#c78bff', 8);
        k.tot = true;
        continue;
      }
    }

    k.x += k.vx * kdt; k.y += k.vy * kdt;
    if (stecktFest(k.x, k.y, k.r)) {
      funken(k.x, k.y, k.rakete ? '#ffd25c' : '#ff7bb0', k.rakete ? 8 : 4);
      k.tot = true;
    }
  }
  gegnerSchuesse = gegnerSchuesse.filter(k => !k.tot && inDerWelt(k));
  for (const k of gegnerSchuesse) {
    if (Math.hypot(k.x - s.x, k.y - s.y) < k.r + s.r) {
      k.tot = true;
      spielerTrifftEs(k.schaden, k.rakete ? 'Eine Lenkrakete hat dich erwischt'
                                         : 'Ein Schuss hat dich erwischt');
      continue;
    }
    // Übernommene Gegner fangen die Schüsse ihrer früheren Kameraden ab.
    let getroffen = false;
    for (const v of gegner) {
      if (!(v.verbuendet > 0) || v.leben <= 0) continue;
      if (Math.hypot(k.x - v.x, k.y - v.y) < k.r + v.r) {
        schadenAn(v, k.schaden, k.x, k.y);
        k.tot = true; getroffen = true;
        funken(k.x, k.y, '#7cff9d', 4);
        break;
      }
    }
    if (getroffen) continue;

    // Türme fangen Feuer ab - das ist ihr zweiter Zweck
    for (const t of tuerme) {
      if (Math.hypot(k.x - t.x, k.y - t.y) < k.r + t.r) {
        t.leben -= k.schaden; k.tot = true;
        funken(k.x, k.y, '#7cff9d', 4);
        break;
      }
    }
  }
  gegnerSchuesse = gegnerSchuesse.filter(k => !k.tot);

  // --- Orbitallaser: markierte Stellen zünden ---
  for (const e of einschlaege) {
    e.zeit -= dt;
    if (e.zeit > 0) continue;
    e.tot = true;
    explosionen.push({ x: e.x, y: e.y, r: e.radius, leben: .6, dauer: .6 });
    funken(e.x, e.y, '#dffaff', 60);
    ruckeln = Math.min(ruckeln + 16, 20);
    KLANG.orbitalEinschlag(e.x, e.y);
    for (const g of gegner)
      if (Math.hypot(g.x - e.x, g.y - e.y) < e.radius + g.r)
        schadenAn(g, e.schaden, e.x, e.y);
  }
  einschlaege = einschlaege.filter(e => !e.tot);

  // --- Explosionsringe und Blitze ---
  for (const ex of explosionen) ex.leben -= dt;
  explosionen = explosionen.filter(ex => ex.leben > 0);
  for (const b of blitze) b.leben -= dt;
  blitze = blitze.filter(b => b.leben > 0);
  for (const h of heilstrahlen) h.leben -= dt;
  heilstrahlen = heilstrahlen.filter(h => h.leben > 0);

  // --- Funken ---
  for (const p of partikel) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.leben -= dt;
  }
  partikel = partikel.filter(p => p.leben > 0);

  if (ruckeln > 0) ruckeln = Math.max(0, ruckeln - dt * 30);

  // Wie brenzlig ist die Lage gerade? Viele Gegner und wenig Leben treiben
  // die Musik an. Der Wert wandert langsam, damit nichts ruckartig umspringt.
  const dichte = Math.min(1, gegner.length / 7);
  // grenze() ist wichtig: Ohne sie kann der Wert bei mehr Leben als Maximum
  // negativ werden - und ein negatives Tempo bringt die Musik durcheinander.
  const knappheit = grenze(1 - lauf.hp / Math.max(1, hpGrenze()), 0, 1);
  let ziel = grenze(dichte * .55 + knappheit * .45, 0, 1);
  if (lauf.level % 10 === 0) ziel = Math.max(ziel, .72);        // Bosskämpfe sind immer heiß
  MUSIK.spannung = grenze(MUSIK.spannung + (ziel - MUSIK.spannung) * Math.min(1, dt * .9), 0, 1);

  hudGegnerAktualisieren();
  if ((lauf.faehigkeitPlaetze || []).length) faehigkeitsleisteAktualisieren();
  auftragAktualisieren(dt);
  // Im Schießstand ist das Level nie zu Ende - da wird ja nur geübt.
  // Bei einem laufenden Auftrag zählt der Auftrag, nicht das leere Feld.
  if (!lauf.uebung && gegner.length === 0 &&
      (!lauf.auftrag || lauf.auftrag.fertig || lauf.auftrag.art === 'sammeln'))
    levelGeschafft();
}

function spielerTrifftEs(schaden, wodurch) {
  if (spieler.unverwundbar > 0) return;
  if (lauf.uebung) return;                 // im Schießstand passiert dir nichts
  if (wodurch) lauf.todesUrsache = wodurch;   // wer zuletzt getroffen hat
  schaden = schaden || 10;

  // Erst geht das Schild kaputt, erst danach ein Herz.
  if (spieler.schild > 0) {
    spieler.schild--;
    spieler.schildTimer = schildLadezeit();
    spieler.unverwundbar = EINSTELLUNGEN.schildUnverwundbar;
    KLANG.schildBruch();
    funken(spieler.x, spieler.y, '#7cff9d', 22);
    ruckeln = Math.min(ruckeln + 8, 18);
    // Die Schockwelle hat jetzt eine eigene Abklingzeit - sie rettet dich
    // nicht mehr bei jedem einzelnen Schildbruch.
    if (hat('schockwelle') && spieler.schockAbkling <= 0) {
      spieler.schockAbkling = EINSTELLUNGEN.schockwelleAbkling;
      schockwelleAusloesen();
    }
    return;
  }

  lauf.hp = Math.max(0, lauf.hp - schaden);
  // Ein Treffer beflügelt sie.
  moral = grenze(moral + EINSTELLUNGEN.moralTreffer,
                 EINSTELLUNGEN.moralMin, EINSTELLUNGEN.moralMax);
  KLANG.spielerTreffer();
  spieler.unverwundbar = EINSTELLUNGEN.unverwundbarkeit;
  ruckeln = 16;
  funken(spieler.x, spieler.y, '#ff5c7a', 24);
  hudAktualisieren();
  if (lauf.hp <= 0) zeigeTod();
}

function funken(x, y, farbe, anzahl) {
  for (let i = 0; i < anzahl; i++) {
    const a = Math.random() * Math.PI * 2, t = zufall(40, 260);
    partikel.push({ x, y, vx: Math.cos(a) * t, vy: Math.sin(a) * t, leben: zufall(0.2, 0.6), farbe });
  }
}

// ============================================================================
// Zeichnen
// ============================================================================
// Schwebende Figuren als Deko hinter dem Startbildschirm.
let deko = null;
function dekoAufbauen() {
  const arten = Object.keys(GEGNERARTEN).map(k => GEGNERARTEN[k])
                .concat([{ form: 'pfeil', farbe: '#5fd0ff', r: 20 }]);
  deko = [];
  // Drei Tiefenebenen: weit hinten klein, langsam und blass, vorne groß,
  // schnell und kräftig. Dadurch bekommt das Menü Tiefe statt einer Fläche.
  const ebenen = [
    { anzahl: 16, groesse: .55, tempo: .35, deckung: .16 },
    { anzahl: 12, groesse: 1.0, tempo: .75, deckung: .34 },
    { anzahl:  7, groesse: 1.8, tempo: 1.3, deckung: .52 },
  ];
  let i = 0;
  for (const e of ebenen)
    for (let k = 0; k < e.anzahl; k++, i++) {
      const a = arten[i % arten.length];
      deko.push({
        form: a.form, farbe: a.farbe, r: a.r * e.groesse * zufall(.85, 1.35),
        x: Math.random() * B, y: Math.random() * H,
        vx: zufall(-26, 26) * e.tempo, vy: zufall(-26, 26) * e.tempo,
        dreh: Math.random() * 6, drehTempo: zufall(-.5, .5) * e.tempo,
        deckung: e.deckung,
      });
    }
}

// Farbverlauf und Lichtkreise ändern sich nur ganz langsam. Statt sie in
// jedem Bild neu zu berechnen - vier bildschirmgroße Füllungen, das kostete
// gemessen 15 ms je Bild - malen wir sie fünfmal je Sekunde auf eine
// Extra-Leinwand und kopieren die danach nur noch herüber.
let menueGrund = null, menueGrundZeit = -9;

function menueGrundbild(bw) {
  if (!menueGrund) menueGrund = document.createElement('canvas');
  if (menueGrund.width !== B || menueGrund.height !== H) {
    menueGrund.width = B; menueGrund.height = H; menueGrundZeit = -9;
  }
  if (uhr - menueGrundZeit < .2) return menueGrund;
  menueGrundZeit = uhr;

  const c = menueGrund.getContext('2d');
  const v = c.createLinearGradient(0, 0, B * .35, H);
  v.addColorStop(0,   farbeMischen(bw.a.boden2, bw.b.boden2, bw.t));
  v.addColorStop(.55, farbeMischen(bw.a.boden,  bw.b.boden,  bw.t));
  v.addColorStop(1,   farbeMischen(bw.a.aussen, bw.b.aussen, bw.t));
  c.fillStyle = v;
  c.fillRect(0, 0, B, H);

  // Zwei weiche Lichtkreise, die langsam wandern und atmen.
  for (const l of [
    { x: B * (.28 + Math.sin(uhr * .12) * .06), y: H * (.30 + Math.cos(uhr * .09) * .05),
      r: Math.min(B, H) * .55, farbe: 'rgba(95,208,255,' + (.10 + Math.sin(uhr * .5) * .025) + ')' },
    { x: B * (.74 + Math.cos(uhr * .1) * .05),  y: H * (.70 + Math.sin(uhr * .13) * .05),
      r: Math.min(B, H) * .5,  farbe: 'rgba(167,139,250,' + (.09 + Math.cos(uhr * .43) * .02) + ')' },
  ]) {
    const g = c.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    g.addColorStop(0, l.farbe);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  return menueGrund;
}

// Die dunklen Ränder ändern sich nie - einmal malen reicht für immer.
let menueRand = null;

function menueRandbild() {
  if (menueRand && menueRand.width === B && menueRand.height === H) return menueRand;
  if (!menueRand) menueRand = document.createElement('canvas');
  menueRand.width = B; menueRand.height = H;
  const c = menueRand.getContext('2d');
  const g = c.createRadialGradient(B / 2, H / 2, Math.min(B, H) * .35,
                                   B / 2, H / 2, Math.max(B, H) * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.6)');
  c.fillStyle = g;
  c.fillRect(0, 0, B, H);
  return menueRand;
}

// --- Menü-Hintergrund: Landschaftswechsel und kleine Vorführung -------------
// Der Hintergrund wandert langsam durch alle Biome, und ein Pfeil fliegt von
// allein umher und schießt auf die treibenden Formen. Das ist reine Zierde -
// es hat keinerlei Verbindung zum echten Spiel.
let menueBiomA = 0, menueBiomB = 1, menueUeber = 0;

function menueBiome(dt) {
  menueUeber += dt / 13;                       // gut 13 Sekunden je Landschaft
  if (menueUeber >= 1) {
    menueUeber = 0;
    menueBiomA = menueBiomB;
    menueBiomB = (menueBiomB + 1) % BIOME.length;
  }
  return { a: BIOME[menueBiomA], b: BIOME[menueBiomB], t: menueUeber };
}

// Zwei Farben mischen - t = 0 ergibt die erste, t = 1 die zweite.
function farbeMischen(h1, h2, t) {
  const z = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const a = z(h1), b = z(h2);
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
}

let demoPfeil = null, demoSchuesse = [], demoFunken = [];

function demoLauf(dt) {
  if (!demoPfeil)
    demoPfeil = { x: B * .25, y: H * .6, vx: 60, vy: -40, winkel: 0, takt: 0,
                  zielX: B * .5, zielY: H * .5, neuZiel: 0 };
  const p = demoPfeil;

  // Alle paar Sekunden ein neues Ziel, das er gemütlich anfliegt.
  p.neuZiel -= dt;
  if (p.neuZiel <= 0) {
    p.neuZiel = zufall(2.5, 5);
    p.zielX = zufall(B * .12, B * .88);
    p.zielY = zufall(H * .14, H * .86);
  }
  const dx = p.zielX - p.x, dy = p.zielY - p.y, d = Math.hypot(dx, dy) || 1;
  p.vx += (dx / d * 95 - p.vx) * Math.min(1, dt * .8);
  p.vy += (dy / d * 95 - p.vy) * Math.min(1, dt * .8);
  p.x = grenze(p.x + p.vx * dt, 20, B - 20);
  p.y = grenze(p.y + p.vy * dt, 20, H - 20);

  // Auf die nächste große Form zielen - die kleinen hinten sind zu weit weg.
  let ziel = null, best = 1e9;
  for (const k of (deko || [])) {
    if (k.deckung < .4) continue;
    const e = Math.hypot(k.x - p.x, k.y - p.y);
    if (e < best) { best = e; ziel = k; }
  }
  const zielWinkel = ziel ? Math.atan2(ziel.y - p.y, ziel.x - p.x)
                          : Math.atan2(p.vy, p.vx);
  let unterschied = ((zielWinkel - p.winkel + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  p.winkel += unterschied * Math.min(1, dt * 4.5);

  p.takt -= dt;
  if (ziel && p.takt <= 0 && Math.abs(unterschied) < .35 && best < Math.max(B, H) * .6) {
    p.takt = .45;
    demoSchuesse.push({ x: p.x + Math.cos(p.winkel) * 20, y: p.y + Math.sin(p.winkel) * 20,
                        vx: Math.cos(p.winkel) * 560, vy: Math.sin(p.winkel) * 560, leben: 2 });
  }

  // Schüsse fliegen und treffen
  for (let i = demoSchuesse.length - 1; i >= 0; i--) {
    const k = demoSchuesse[i];
    k.x += k.vx * dt; k.y += k.vy * dt; k.leben -= dt;
    let weg = k.leben <= 0 || k.x < -40 || k.x > B + 40 || k.y < -40 || k.y > H + 40;
    if (!weg)
      for (const z of (deko || [])) {
        if (z.deckung < .4) continue;
        if (Math.hypot(z.x - k.x, z.y - k.y) > z.r) continue;
        // Treffer: die Form zerspringt und taucht woanders wieder auf.
        for (let f = 0; f < 11; f++) {
          const w = zufall(0, Math.PI * 2), t = zufall(40, 190);
          demoFunken.push({ x: z.x, y: z.y, vx: Math.cos(w) * t, vy: Math.sin(w) * t,
                            leben: zufall(.3, .75), farbe: z.farbe });
        }
        z.x = Math.random() < .5 ? -50 : B + 50;
        z.y = zufall(0, H);
        weg = true;
        break;
      }
    if (weg) demoSchuesse.splice(i, 1);
  }

  for (let i = demoFunken.length - 1; i >= 0; i--) {
    const f = demoFunken[i];
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= .96; f.vy *= .96;
    f.leben -= dt;
    if (f.leben <= 0) demoFunken.splice(i, 1);
  }
}

function demoZeichnen() {
  for (const f of demoFunken) {
    ctx.globalAlpha = Math.max(0, f.leben) * .9;
    ctx.fillStyle = f.farbe;
    ctx.beginPath(); ctx.arc(f.x, f.y, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = .9;
  ctx.fillStyle = '#dffaff';
  for (const k of demoSchuesse) {
    ctx.beginPath(); ctx.arc(k.x, k.y, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  if (demoPfeil) {
    ctx.globalAlpha = .85;
    ctx.save();
    ctx.translate(demoPfeil.x, demoPfeil.y);
    ctx.rotate(demoPfeil.winkel);
    ctx.fillStyle = '#5fd0ff';
    formZeichnen('pfeil', 15);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function menuHintergrund(dt) {
  // Der Hintergrund wandert langsam durch alle Landschaften des Spiels.
  const bw = menueBiome(dt);
  ctx.drawImage(menueGrundbild(bw), 0, 0);

  const raster = 48, ox = (uhr * 16) % raster, oy = (uhr * 9) % raster;
  ctx.strokeStyle = 'rgba(80,110,170,.09)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -raster + ox; x <= B; x += raster) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -raster + oy; y <= H; y += raster) { ctx.moveTo(0, y); ctx.lineTo(B, y); }
  ctx.stroke();

  if (!deko || deko.laenge !== B) { dekoAufbauen(); deko.laenge = B; }
  for (const d of deko) {
    d.x += d.vx * dt; d.y += d.vy * dt; d.dreh += d.drehTempo * dt;
    if (d.x < -60) d.x = B + 60; if (d.x > B + 60) d.x = -60;
    if (d.y < -60) d.y = H + 60; if (d.y > H + 60) d.y = -60;
    ctx.globalAlpha = d.deckung;
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.dreh);
    ctx.fillStyle = d.farbe;
    formZeichnen(d.form, d.r);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Der Pfeil, der von allein herumfliegt und schießt.
  demoLauf(dt);
  demoZeichnen();

  // Dunkle Ränder, damit der Blick in der Mitte bleibt.
  ctx.drawImage(menueRandbild(), 0, 0);

  // Name der Landschaft, die gerade durchscheint - klein unten links.
  const gezeigt = bw.t < .5 ? bw.a : bw.b;
  ctx.globalAlpha = .38;
  ctx.fillStyle = '#cfdcf0';
  ctx.font = '600 13px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(gezeigt.symbol + '  ' + gezeigt.name, 20, H - 18);
  ctx.globalAlpha = 1;
}

// Boden, Muster und Streuteile des Bioms.
// Der Boden ändert sich während eines Levels überhaupt nicht - deshalb malen
// wir ihn EINMAL auf eine unsichtbare Extra-Leinwand und kopieren danach in
// jedem Bild nur noch das fertige Bild herüber. Das ist um ein Vielfaches
// schneller, als jedes Mal Muster, Flecken und hunderte Streuteile neu zu
// zeichnen. Die Extra-Leinwand ist etwas kleiner als die Welt (BODEN_SKALA),
// das spart Speicher und sieht man dem weichen Untergrund nicht an.
// Auf Handy und Tablet ist der Speicher knapper - dort malen wir den Boden
// gröber vor. 3120 x 2160 Pixel wären sonst gut 27 MB nur für den Untergrund.
const BODEN_SKALA = TIPPGERAET ? .38 : .6;
let bodenBild = null, bodenFuer = '';

// Das Muster wird als kleine Kachel gezeichnet und dann wiederholt.
let musterKachel = null, musterFuer = '';

function musterKachelBauen(biom) {
  if (musterFuer === biom.id) return musterKachel;
  musterFuer = biom.id;
  musterKachel = null;
  if (biom.muster === 'keins') return null;

  const k = document.createElement('canvas');
  const kc = k.getContext('2d');
  if (biom.muster === 'gitter') {
    k.width = k.height = 48;
    kc.strokeStyle = biom.linie; kc.lineWidth = 1.5;
    kc.beginPath();
    kc.moveTo(.75, 0); kc.lineTo(.75, 48);
    kc.moveTo(0, .75); kc.lineTo(48, .75);
    kc.stroke();
  } else if (biom.muster === 'punkte') {
    k.width = k.height = 72;
    kc.fillStyle = biom.linie;
    kc.fillRect(35, 35, 3, 3);
  } else {                                   // Wellen
    k.width = 260; k.height = 224;
    kc.strokeStyle = biom.linie; kc.lineWidth = 2;
    kc.beginPath();
    for (let r = 0; r < 4; r++) {
      const y = 14 + r * 56, ph = r * Math.PI / 2;
      kc.moveTo(0, y + Math.sin(ph) * 9);
      for (let x = 10; x <= 260; x += 10)
        kc.lineTo(x, y + Math.sin(x / 260 * Math.PI * 2 + ph) * 9);
    }
    kc.stroke();
  }
  musterKachel = k;
  return k;
}

// Malt den kompletten Boden einer Karte auf die übergebene Leinwand.
function bodenMalen(c, biom) {
  c.fillStyle = biom.boden;
  c.fillRect(0, 0, WELT.b, WELT.h);

  // Weiche Flecken in der zweiten Bodenfarbe - ohne sie wirkt der Boden
  // wie eine einfarbige Fläche.
  for (const f of ((aktuelleKarte && aktuelleKarte.flecken) || [])) {
    const v = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    v.addColorStop(0, biom.boden2);
    v.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = v;
    c.beginPath(); c.arc(f.x, f.y, f.r, 0, Math.PI * 2); c.fill();
  }

  const kachel = musterKachelBauen(biom);
  if (kachel) { c.fillStyle = c.createPattern(kachel, 'repeat'); c.fillRect(0, 0, WELT.b, WELT.h); }

  // Die festen Kleinigkeiten am Boden - Nieten, Steine, Grasbüschel, Risse.
  const deko = (aktuelleKarte && aktuelleKarte.deko) || [];
  c.fillStyle = biom.dekoFarbe; c.strokeStyle = biom.dekoFarbe;

  if (biom.deko === 'nieten' || biom.deko === 'steine') {
    const f = biom.deko === 'nieten' ? 1.9 : 4;
    c.beginPath();
    for (const d of deko) { c.moveTo(d.x + f * d.g, d.y); c.arc(d.x, d.y, f * d.g, 0, Math.PI * 2); }
    c.fill();

  } else if (biom.deko === 'gras') {
    c.lineWidth = 1.6;
    c.beginPath();
    for (const d of deko)
      for (let k = -1; k <= 1; k++) {
        c.moveTo(d.x + k * 3 * d.g, d.y + 4 * d.g);
        c.lineTo(d.x + k * 5.5 * d.g, d.y - 7 * d.g);
      }
    c.stroke();

  } else if (biom.deko === 'risse') {
    // Glühende Risse bekommen erst einen breiten Schein, dann einen hellen
    // Kern - so sieht man die Glut, statt nur einen orangen Strich.
    for (const stufe of (biom.glut ? [7, 3, 1.2] : [1.4])) {
      c.globalAlpha = !biom.glut ? 1 : stufe > 5 ? .16 : stufe > 2 ? .5 : 1;
      c.strokeStyle = (biom.glut && stufe < 2 && biom.dekoKern) ? biom.dekoKern : biom.dekoFarbe;
      c.lineWidth = stufe;
      c.beginPath();
      for (const d of deko) {
        const co = Math.cos(d.d), sn = Math.sin(d.d), L = 15 * d.g;
        c.moveTo(d.x - co * L, d.y - sn * L);
        c.lineTo(d.x + sn * 3.5 * d.g, d.y - co * 3.5 * d.g);
        c.lineTo(d.x + co * L, d.y + sn * L);
      }
      c.stroke();
    }
    c.globalAlpha = 1;

  } else if (biom.deko === 'sterne') {
    c.lineWidth = 1;
    c.beginPath();
    for (const d of deko) {
      const f = 2.6 * d.g;
      c.moveTo(d.x - f, d.y); c.lineTo(d.x + f, d.y);
      c.moveTo(d.x, d.y - f); c.lineTo(d.x, d.y + f);
    }
    c.stroke();
  }
}

function bodenZeichnen(biom) {
  const schluessel = biom.id + '#' + (aktuelleKarte ? aktuelleKarte.nummer : 0);
  if (bodenFuer !== schluessel) {
    if (!bodenBild) {
      bodenBild = document.createElement('canvas');
      bodenBild.width  = Math.round(WELT.b * BODEN_SKALA);
      bodenBild.height = Math.round(WELT.h * BODEN_SKALA);
    }
    const c = bodenBild.getContext('2d');
    c.setTransform(BODEN_SKALA, 0, 0, BODEN_SKALA, 0, 0);
    bodenMalen(c, biom);
    bodenFuer = schluessel;
  }
  // Nur den sichtbaren Ausschnitt herüberkopieren - und ohne Weichzeichnen.
  // Das Weichzeichnen beim Vergrößern kostet fast zehnmal so viel Zeit wie
  // die Kopie selbst; ohne es bleibt das Spiel flüssig.
  const sx = Math.max(0, kamera.x * BODEN_SKALA), sy = Math.max(0, kamera.y * BODEN_SKALA);
  const sb = Math.min(bodenBild.width  - sx, B * BODEN_SKALA);
  const sh = Math.min(bodenBild.height - sy, H * BODEN_SKALA);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bodenBild, sx, sy, sb, sh,
                sx / BODEN_SKALA, sy / BODEN_SKALA, sb / BODEN_SKALA, sh / BODEN_SKALA);
  ctx.imageSmoothingEnabled = true;
}

// Was durch die Luft schwebt. Die Teilchen kleben am Bildschirm (nicht an der
// Welt) - deshalb kommt die Kameraposition wieder drauf. Beim Biomwechsel
// werden sie einmal neu gewürfelt.
let schwebeTeile = [], schwebeArt = '';

function schwebeZeichnen(biom, dt) {
  if (!biom.schweben) { schwebeArt = ''; schwebeTeile.length = 0; return; }
  if (schwebeArt !== biom.schweben) {
    schwebeArt = biom.schweben;
    schwebeTeile = [];
    for (let i = 0; i < 70; i++)
      schwebeTeile.push({ x: zufall(0, B), y: zufall(0, H),
                          g: zufall(.6, 2.2), p: zufall(0, 6.3), v: zufall(.6, 1.6) });
  }

  const hoch = biom.schweben === 'funken' || biom.schweben === 'blasen';
  ctx.fillStyle = biom.schwebeFarbe; ctx.strokeStyle = biom.schwebeFarbe;
  for (const t of schwebeTeile) {
    t.p += dt * 1.6;
    if (biom.schweben === 'staub') {
      t.x += (25 + t.v * 40) * dt;
      t.y += Math.sin(t.p) * 8 * dt;
    } else if (hoch) {
      t.y -= (28 + t.v * 45) * dt;
      t.x += Math.sin(t.p) * 14 * dt;
    } else if (biom.schweben === 'flocken') {
      t.y += (22 + t.v * 30) * dt;
      t.x += Math.sin(t.p) * 20 * dt;
    } else {                                   // Pollen: langsam nach oben rechts
      t.y -= (8 + t.v * 10) * dt;
      t.x += (6 + t.v * 12) * dt;
    }
    // Am Rand wieder von vorne
    if (t.x < -20) t.x = B + 20;  if (t.x > B + 20) t.x = -20;
    if (t.y < -20) t.y = H + 20;  if (t.y > H + 20) t.y = -20;

    const x = t.x + kamera.x, y = t.y + kamera.y;
    if (biom.schweben === 'blasen') {
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, 2 + t.g * 2, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = biom.schweben === 'funken' ? .5 + Math.sin(t.p * 2) * .4 : 1;
      ctx.beginPath(); ctx.arc(x, y, t.g, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function zeichnen(dt) {
  // Alles wird in CSS-Pixeln gezeichnet; diese Zeile rechnet auf echte
  // Bildschirmpixel hoch, damit nichts unscharf aussieht.
  ctx.setTransform(pixelDichte, 0, 0, pixelDichte, 0, 0);

  if (zustand === 'menu' || zustand === 'bosswahl') { menuHintergrund(dt || 0); return; }

  const biom = biomVon(aktuelleKarte && aktuelleKarte.biom);
  ctx.fillStyle = biom.aussen;         // alles außerhalb der Welt
  ctx.fillRect(0, 0, B, H);
  if (!spieler) return;

  ctx.save();
  if (ruckeln > 0) ctx.translate(zufall(-ruckeln, ruckeln), zufall(-ruckeln, ruckeln));
  ctx.translate(-kamera.x, -kamera.y);   // <<< ab hier zeichnen wir in Weltkoordinaten

  // Boden, Muster und Streuteile des Bioms
  bodenZeichnen(biom);

  // Weltrand
  ctx.strokeStyle = biom.rand; ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, WELT.b - 6, WELT.h - 6);

  // Mauern - nur die, die gerade im Bild sind
  for (const h of hindernisse) {
    if (h.x + h.b < kamera.x - 40 || h.x > kamera.x + B + 40 ||
        h.y + h.h < kamera.y - 40 || h.y > kamera.y + H + 40) continue;
    ctx.fillStyle = biom.mauer;
    ctx.fillRect(h.x, h.y, h.b, h.h);
    ctx.fillStyle = biom.kante;                    // Lichtkante oben
    ctx.fillRect(h.x, h.y, h.b, 7);
    ctx.strokeStyle = biom.mauerRand; ctx.lineWidth = 2;
    ctx.strokeRect(h.x + 1, h.y + 1, h.b - 2, h.h - 2);
  }

  // Was durch die Luft schwebt: Funken, Schneeflocken, Blasen, Staub.
  schwebeZeichnen(biom, dt || 0);

  // Laserstrahl
  const w = WAFFEN[lauf.waffe];
  if (w.art === 'laser' && maus.gedrueckt && !lauf.ueberhitzt) {
    for (const winkel of strahlWinkel(w)) {
      const dx = Math.cos(winkel), dy = Math.sin(winkel);
      const weite = strahlLaenge(spieler.x, spieler.y, dx, dy, w.reichweite);
      const ax = spieler.x + dx * 18,     ay = spieler.y + dy * 18;
      const ex = spieler.x + dx * weite,  ey = spieler.y + dy * weite;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(124,231,255,.35)'; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = '#dffaff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
      // Der Strahl franst am Ende aus - so sieht man, wo die Reichweite aufhört.
      ctx.fillStyle = 'rgba(124,231,255,.5)';
      ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Ziellinie des Scharfschützen - dünn, aber sie zeigt genau, wohin es geht
  if (w.zielhilfe) {
    const dx = Math.cos(spieler.winkel), dy = Math.sin(spieler.winkel);
    const weite = strahlLaenge(spieler.x, spieler.y, dx, dy, 2600);
    const ex = spieler.x + dx * weite, ey = spieler.y + dy * weite;
    ctx.strokeStyle = 'rgba(255,92,122,.32)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([12, 10]);
    ctx.beginPath();
    ctx.moveTo(spieler.x + dx * 24, spieler.y + dy * 24);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,92,122,.5)';
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fill();
  }

  // Kisten und Sender eines Auftrags
  auftragZeichnen();

  // Der Schlagbogen einer Nahkampfwaffe
  schwungZeichnen();

  // Feuerkegel des Flammenwerfers
  if (w.art === 'flamme' && maus.gedrueckt && !lauf.ueberhitzt) {
    ctx.save();
    ctx.translate(spieler.x, spieler.y);
    ctx.rotate(spieler.winkel);
    ctx.fillStyle = 'rgba(255,140,60,.16)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, w.reichweite, -w.oeffnung, w.oeffnung);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Druckwellen von Explosionen
  for (const ex of explosionen) {
    const anteil = 1 - ex.leben / ex.dauer;
    ctx.globalAlpha = (1 - anteil) * 0.7;
    ctx.strokeStyle = ex.feindlich ? '#ff6b3d' : '#ffb35c';
    ctx.lineWidth = ex.feindlich ? 7 : 5;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r * (0.35 + anteil * 0.75), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Funken
  for (const p of partikel) {
    ctx.globalAlpha = Math.max(0, p.leben * 2);
    ctx.fillStyle = p.farbe;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Gegner
  for (const g of gegner) {
    // Ziellinie des Scharfschützen kurz bevor er abdrückt - Vorwarnung ist fair.
    if (!g.boss && g.art.muster === 'zielen' && g.nachladen < 0.5) {
      ctx.strokeStyle = 'rgba(124,255,157,.45)'; ctx.lineWidth = 2;
      ctx.setLineDash([9, 9]);
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.winkel) * 1400, g.y + Math.sin(g.winkel) * 1400);
      ctx.stroke(); ctx.setLineDash([]);
    }
    // Auch der kleine Rammbock kündigt seinen Sturmangriff an.
    if (!g.boss && g.art.sturm && g.phase === 'zielen') {
      ctx.strokeStyle = 'rgba(255,123,213,.45)'; ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.sturmWinkel) * 460, g.y + Math.sin(g.sturmWinkel) * 460);
      ctx.stroke(); ctx.setLineDash([]);
    }
    // Der Rammbock-Boss zeigt an, wohin er gleich stürmt.
    if (g.boss && g.art.angriff === 'sturm' && g.phase === 'zielen') {
      ctx.strokeStyle = 'rgba(255,92,213,.4)'; ctx.lineWidth = 5;
      ctx.setLineDash([16, 12]);
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.sturmWinkel) * 900, g.y + Math.sin(g.sturmWinkel) * 900);
      ctx.stroke(); ctx.setLineDash([]);
    }

    // Der Bomber pulsiert, je näher er kommt - Vorwarnung vor der Explosion
    if (g.art.explodiert) {
      const naehe = 1 - Math.min(1, Math.hypot(g.x - spieler.x, g.y - spieler.y) / 500);
      const puls = .5 + .5 * Math.sin(uhr * (5 + naehe * 14));
      ctx.strokeStyle = 'rgba(255,107,61,' + (.15 + puls * .35 * (0.3 + naehe)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.art.explodiert.radius, 0, Math.PI * 2); ctx.stroke();
    }

    // Der Omega-Kern pulsiert und wechselt die Farbe mit seiner Phase
    if (g.art.aura) {
      const anteil = g.leben / g.maxLeben;
      const phasenFarbe = anteil > .66 ? '255,210,92' : anteil > .33 ? '255,140,60' : '255,80,80';
      for (let i = 0; i < 3; i++) {
        const puls = (uhr * .7 + i / 3) % 1;
        ctx.strokeStyle = 'rgba(' + phasenFarbe + ',' + (.5 * (1 - puls)) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(g.x, g.y, g.r + puls * 130, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Der Frontschild des Bollwerks als dicker Bogen
    if (g.art.frontschild) {
      const fs = g.art.frontschild;
      ctx.strokeStyle = 'rgba(224,208,255,.85)';
      ctx.lineWidth = 6; ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r + 8, g.schildWinkel - fs.winkel, g.schildWinkel + fs.winkel);
      ctx.stroke();
    }

    // Kurz bevor jemand abdrückt, blitzt sein Umriss auf. Damit bleibt auch
    // ein harter Kampf lesbar - man sieht, was gleich passiert.
    if (!g.boss && g.marke && g.siehtSpieler && g.art.muster !== 'keins' &&
        g.nachladen > 0 && g.nachladen < .24) {
      ctx.globalAlpha = (1 - g.nachladen / .24) * .8;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Wer gerade angreift, bekommt einen pulsierenden Ring. Ohne dieses
    // Zeichen wüsstest du nicht, wer als Nächstes kommt - und genau das
    // macht den Unterschied zwischen "unfair" und "taktisch".
    if (g.marke && !g.boss) {
      ctx.globalAlpha = .3 + .25 * Math.sin(uhr * 4.5);
      ctx.strokeStyle = g.art.farbe;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Wer dich verloren hat und sucht, bekommt ein Fragezeichen - so merkst
    // du, dass dein Verstecken funktioniert hat.
    if (!g.boss && !g.siehtSpieler && g.suchZeit > 0) {
      ctx.globalAlpha = .55;
      ctx.fillStyle = '#ffd25c';
      ctx.font = '700 15px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('?', g.x, g.y - g.r - 12);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    // Körper in der Form seines Typs
    const gerichtet = g.art.form === 'pfeil' || g.art.form === 'raute' || g.art.form === 'dreieck';
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(gerichtet ? g.winkel : g.eigenDrehung);
    ctx.fillStyle = g.treffer > 0 ? '#ffffff' : g.art.farbe;
    formZeichnen(g.art.form, g.r);
    ctx.fill();
    // Tarnflecken in den Bodenfarben - beim Trefferblitz weggelassen,
    // damit man den Treffer klar sieht.
    if (g.treffer <= 0) tarnfleckenZeichnen(g);
    // Versteinert: grauer Überzug. Übernommen: grüner.
    if (g.stein > 0) {
      ctx.fillStyle = 'rgba(184,168,144,.72)';
      formZeichnen(g.art.form, g.r); ctx.fill();
    } else if (g.verbuendet > 0) {
      ctx.fillStyle = 'rgba(124,255,157,.45)';
      formZeichnen(g.art.form, g.r); ctx.fill();
    }
    if (g.frost > 0) {                     // eingefroren: bläulicher Überzug
      ctx.fillStyle = 'rgba(124,231,255,.45)';
      formZeichnen(g.art.form, g.r);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.arc(0, 0, g.r * 0.33, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Mini-Bosse bekommen ein Namensschild, damit man sie nicht mit einem
    // normalen Gegner verwechselt.
    if (g.mini) {
      ctx.globalAlpha = .35 + .3 * Math.sin(uhr * 3.5);
      ctx.strokeStyle = g.art.farbe; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r + 12, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = g.art.farbe;
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Kleiner ' + g.art.name, g.x, g.y - g.r - 20);
      ctx.textAlign = 'left';
    }

    if (g.leben < g.maxLeben) {
      const bb = g.r * 2, hh = 4, oy = g.y - g.r - 10;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(g.x - bb / 2, oy, bb, hh);
      ctx.fillStyle = '#7cff9d';
      ctx.fillRect(g.x - bb / 2, oy, bb * Math.max(0, g.leben / g.maxLeben), hh);
    }
  }

  // Schüsse
  // Schwarze Löcher
  for (const k of schuesse) {
    if (!k.loch) continue;
    if (k.loch.offen) {
      const anteil = k.loch.dauer / WAFFEN.singularitaet.loch.dauer;
      ctx.strokeStyle = 'rgba(199,139,255,.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(k.x, k.y, k.loch.sogWeite * (.35 + .65 * anteil), 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#c78bff';
      ctx.beginPath(); ctx.arc(k.x, k.y, 16 + 8 * Math.sin(uhr * 12), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#120820';
      ctx.beginPath(); ctx.arc(k.x, k.y, 10 + 5 * Math.sin(uhr * 12), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#c78bff';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Markierte Einschlagstellen des Orbitallasers
  for (const e of einschlaege) {
    const anteil = 1 - e.zeit / e.vorlauf;
    ctx.strokeStyle = 'rgba(223,250,255,' + (.25 + anteil * .55) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * (1 - anteil), 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(223,250,255,' + (.1 + anteil * .3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(e.x - e.radius, e.y); ctx.lineTo(e.x + e.radius, e.y);
    ctx.moveTo(e.x, e.y - e.radius); ctx.lineTo(e.x, e.y + e.radius);
    ctx.stroke();
  }

  for (const k of schuesse) {
    if (k.loch) continue;
    if (k.fernbonus) {                     // Scharfschützenkugel: schlanke Spur
      ctx.strokeStyle = 'rgba(255,214,214,.8)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(k.x, k.y);
      ctx.lineTo(k.x - Math.cos(k.winkel) * 46, k.y - Math.sin(k.winkel) * 46);
      ctx.stroke();
      continue;
    }
    if (k.railgun) {                       // heller Leuchtstreifen statt Kugel
      const l = 70 + k.wucht * 90;
      ctx.strokeStyle = 'rgba(223,250,255,.85)'; ctx.lineWidth = 2 + k.wucht * 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(k.x, k.y);
      ctx.lineTo(k.x - Math.cos(k.winkel) * l, k.y - Math.sin(k.winkel) * l);
      ctx.stroke();
      continue;
    }
    if (k.mine) {
      ctx.fillStyle = k.scharf ? '#ff7b8f' : '#8fa3c4';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r * .4, 0, Math.PI * 2); ctx.fill();
      if (k.scharf) {                      // pulsierender Zündradius als Warnung
        const puls = .5 + .5 * Math.sin(uhr * 8);
        ctx.strokeStyle = 'rgba(255,123,143,' + (.18 + puls * .3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(k.x, k.y, k.zuendradius, 0, Math.PI * 2); ctx.stroke();
      }
      continue;
    }
    if (k.chakram) {
      // Laser-Chakram als echter Bumerang: zwei gebogene Arme in einem Winkel,
      // die sich beim Fliegen drehen. Der blasse Ring ist die Wirbelspur.
      ctx.globalAlpha = .22;
      ctx.strokeStyle = '#7ce7ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r * 1.5, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.winkel);
      const L = k.r * 1.7;                  // Länge eines Arms
      ctx.strokeStyle = '#dffaff';
      ctx.lineWidth = k.r * .62; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(L, -L * .35);
      ctx.quadraticCurveTo(L * .2, -L * .1, 0, 0);
      ctx.quadraticCurveTo(L * .1, L * .45, L * .55, L * .95);
      ctx.stroke();
      ctx.strokeStyle = '#7ce7ff';          // leuchtende Kante
      ctx.lineWidth = k.r * .22;
      ctx.stroke();
      ctx.restore();
      continue;
    }
    if (k.zielsuchend || k.sprengradius) {
      // Raketen und Plasmakugeln als Pfeilspitze mit Glut dahinter
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.winkel || Math.atan2(k.vy, k.vx));
      ctx.fillStyle = k.sprengradius > 120 ? '#c78bff' : '#7ce7ff';
      ctx.beginPath();
      ctx.moveTo(k.r * 1.6, 0); ctx.lineTo(-k.r, k.r * .8);
      ctx.lineTo(-k.r * .5, 0); ctx.lineTo(-k.r, -k.r * .8);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffd25c';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  for (const k of gegnerSchuesse) {
    if (k.liegt) {                                 // Bossmine: pulsierender Ring
      const puls = .5 + .5 * Math.sin(uhr * 7);
      ctx.strokeStyle = 'rgba(124,255,157,' + (.25 + puls * .4) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r + 7 + puls * 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#7cff9d';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r * .4, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (k.rakete) {
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.winkel);
      ctx.fillStyle = '#ffd25c';
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(-6, 5); ctx.lineTo(-3, 0); ctx.lineTo(-6, -5);
      ctx.closePath(); ctx.fill();
      // Der schrumpfende Ring zeigt, wie lange sie dich noch verfolgt.
      ctx.strokeStyle = 'rgba(255,210,92,.55)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2 * (k.restzeit / EINSTELLUNGEN.raketenLebenszeit));
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff7bb0';
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Heilstrahlen des Sanitäters
  for (const h of heilstrahlen) {
    ctx.globalAlpha = (h.leben / h.dauer) * .8;
    ctx.strokeStyle = '#9dffcf'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(h.x1, h.y1); ctx.lineTo(h.x2, h.y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // Kettenblitze
  for (const b of blitze) {
    ctx.globalAlpha = b.leben / b.dauer;
    ctx.strokeStyle = '#c4b5fd'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < b.punkte.length - 1; i++) {
      const x1 = b.punkte[i][0], y1 = b.punkte[i][1];
      const x2 = b.punkte[i + 1][0], y2 = b.punkte[i + 1][1];
      ctx.moveTo(x1, y1);
      const stufen = 4;
      for (let j = 1; j <= stufen; j++) {   // gezackt statt schnurgerade
        const t = j / stufen, letzte = j === stufen;
        ctx.lineTo(x1 + (x2 - x1) * t + (letzte ? 0 : zufall(-13, 13)),
                   y1 + (y2 - y1) * t + (letzte ? 0 : zufall(-13, 13)));
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Geschütztürme
  for (const t of tuerme) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.winkel);
    ctx.fillStyle = '#7cff9d';
    ctx.fillRect(-4, -7, 26, 14);                     // Lauf
    ctx.restore();
    ctx.fillStyle = '#5fbf7d';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .45, 0, Math.PI * 2); ctx.fill();
    // Restlebensdauer als Ring
    ctx.strokeStyle = 'rgba(124,255,157,.7)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r + 6, -Math.PI / 2,
            -Math.PI / 2 + Math.PI * 2 * Math.max(0, t.dauer / 20));
    ctx.stroke();
    if (t.leben < t.maxLeben) {
      const bb = 42, oy = t.y - t.r - 14;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(t.x - bb/2, oy, bb, 4);
      ctx.fillStyle = '#7cff9d';
      ctx.fillRect(t.x - bb/2, oy, bb * Math.max(0, t.leben / t.maxLeben), 4);
    }
  }

  // Abwehrdrohnen
  for (const d of drohnen) {
    ctx.fillStyle = '#7cff9d';
    ctx.beginPath(); ctx.arc(d.x, d.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Schildringe: ein voller Ring je Ladung, dazu der Ladefortschritt
  const schildMax = maxSchild();
  if (schildMax > 0) {
    for (let i = 0; i < spieler.schild; i++) {
      ctx.strokeStyle = 'rgba(124,255,157,' + (.75 - i * .22) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(spieler.x, spieler.y, spieler.r + 11 + i * 6, 0, Math.PI * 2); ctx.stroke();
    }
    if (spieler.schild < schildMax) {
      const anteil = 1 - Math.max(0, spieler.schildTimer) / schildLadezeit();
      ctx.strokeStyle = 'rgba(124,255,157,.3)'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(spieler.x, spieler.y, spieler.r + 11 + spieler.schild * 6,
              -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * anteil);
      ctx.stroke();
    }
  }

  // Der Pfeil (du) - sitzt immer auf kamera + Bildschirmmitte
  const blinkt = spieler.unverwundbar > 0 && Math.floor(spieler.unverwundbar * 12) % 2 === 0;
  if (!blinkt) {
    ctx.save();
    ctx.translate(spieler.x, spieler.y);
    ctx.rotate(spieler.winkel);
    ctx.fillStyle = '#5fd0ff';
    ctx.beginPath();
    ctx.moveTo(20, 0); ctx.lineTo(-13, 12); ctx.lineTo(-6, 0); ctx.lineTo(-13, -12);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if (w.aufladen && lauf.ladung > 0) {
    const bb = 120, x = spieler.x - bb / 2, y = spieler.y + spieler.r + 12;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x, y, bb, 5);
    ctx.fillStyle = lauf.ladung >= w.mindestLadung ? '#dffaff' : '#8fa3c4';
    ctx.fillRect(x, y, bb * lauf.ladung, 5);
  }
  if (w.art === 'laser' || w.art === 'flamme') {
    const bb = 120, x = spieler.x - bb / 2, y = spieler.y + spieler.r + 12;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x, y, bb, 5);
    ctx.fillStyle = lauf.ueberhitzt ? '#ff5c7a' : '#7ce7ff';
    ctx.fillRect(x, y, bb * lauf.hitze, 5);
  }

  // Warmer Lichtschimmer im Kegel - noch in Weltkoordinaten
  const istDunkel = aktuelleKarte && aktuelleKarte.dunkel;
  if (istDunkel) {
    ctx.fillStyle = 'rgba(255,232,178,.05)';
    ctx.beginPath();
    ctx.moveTo(spieler.x, spieler.y);
    for (const p of lichtKegel(.82)) ctx.lineTo(p[0], p[1]);
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();   // <<< ab hier wieder Bildschirmkoordinaten

  // Die Dunkelheit legt sich über alles - aber unter HUD und Minikarte.
  if (istDunkel) dunkelheitZeichnen();

  randmarkerZeichnen();
  minikarteZeichnen();
  tippZeichnen();
  uebungAnzeigeZeichnen();
  auftragAnzeigeZeichnen();
  bossLeisteZeichnen();

  // In der Zeitlupe legt sich ein Schleier über das Bild
  if (zeitlupeRest > 0) {
    ctx.fillStyle = 'rgba(255,210,92,' + Math.min(.1, zeitlupeRest * .05) + ')';
    ctx.fillRect(0, 0, B, H);
  }

  // Kurze Einblendung oben (Mini-Boss aufgetaucht oder erlegt)
  if (hinweisZeit > 0) {
    hinweisZeit -= 1 / 60;
    ctx.globalAlpha = Math.min(1, hinweisZeit * 1.6);
    ctx.textAlign = 'center';
    ctx.font = '700 22px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillText(hinweisText, B / 2 + 2, 110 + 2);
    ctx.fillStyle = hinweisFarbe;
    ctx.fillText(hinweisText, B / 2, 110);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// Taschenlampe
// Der Lichtkegel wird als Fächer aus vielen Strahlen gebaut. Jeder Strahl
// endet dort, wo er auf eine Mauer trifft - dadurch entstehen echte Schatten.
// Gezeichnet wird auf einer zweiten, unsichtbaren Leinwand: erst alles
// schwarz einfärben, dann die beleuchteten Stellen wieder wegradieren.
// ---------------------------------------------------------------------------
let dunkelFlaeche = null, dunkelCtx = null;

function lichtKegel(faktor) {
  const punkte = [];
  const halb = EINSTELLUNGEN.lichtOeffnung * (faktor || 1), n = EINSTELLUNGEN.lichtStrahlen;
  for (let i = 0; i <= n; i++) {
    const a = spieler.winkel - halb + (i / n) * halb * 2;
    const dx = Math.cos(a), dy = Math.sin(a);
    const laenge = strahlLaenge(spieler.x, spieler.y, dx, dy, EINSTELLUNGEN.lichtWeite);
    punkte.push([spieler.x + dx * laenge, spieler.y + dy * laenge]);
  }
  return punkte;
}

function dunkelheitZeichnen() {
  if (!dunkelFlaeche) {
    dunkelFlaeche = document.createElement('canvas');
    dunkelCtx = dunkelFlaeche.getContext('2d');
  }
  if (dunkelFlaeche.width !== B || dunkelFlaeche.height !== H) {
    dunkelFlaeche.width = B; dunkelFlaeche.height = H;
  }
  const d = dunkelCtx;
  const sx = spieler.x - kamera.x, sy = spieler.y - kamera.y;   // du bist in der Mitte

  d.setTransform(1, 0, 0, 1, 0, 0);
  d.clearRect(0, 0, B, H);
  d.fillStyle = 'rgba(3,5,11,' + EINSTELLUNGEN.dunkelheit + ')';
  d.fillRect(0, 0, B, H);

  // Ab hier wird Dunkelheit weggeradiert statt Farbe aufgetragen.
  d.globalCompositeOperation = 'destination-out';

  // Zwei Kegel übereinander ergeben einen weichen Rand: der breite radiert
  // nur teilweise weg (Halbschatten), der schmale innen komplett.
  function kegelFuellen(faktor, staerke) {
    const verlauf = d.createRadialGradient(sx, sy, 0, sx, sy, EINSTELLUNGEN.lichtWeite);
    verlauf.addColorStop(0,   'rgba(0,0,0,' + staerke + ')');
    verlauf.addColorStop(.55, 'rgba(0,0,0,' + (staerke * .97) + ')');
    verlauf.addColorStop(1,   'rgba(0,0,0,0)');   // nach außen läuft das Licht aus
    d.fillStyle = verlauf;
    d.beginPath();
    d.moveTo(sx, sy);
    for (const p of lichtKegel(faktor)) d.lineTo(p[0] - kamera.x, p[1] - kamera.y);
    d.closePath();
    d.fill();
  }
  kegelFuellen(1,   .45);      // breiter Halbschatten
  kegelFuellen(.82, .65);      // Übergang
  kegelFuellen(.62, 1);        // heller Kern

  // Schwacher Schein direkt um dich herum, damit du dich selbst siehst
  const nah = d.createRadialGradient(sx, sy, 0, sx, sy, EINSTELLUNGEN.lichtNah);
  nah.addColorStop(0, 'rgba(0,0,0,.85)');
  nah.addColorStop(1, 'rgba(0,0,0,0)');
  d.fillStyle = nah;
  d.beginPath(); d.arc(sx, sy, EINSTELLUNGEN.lichtNah, 0, Math.PI * 2); d.fill();

  d.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.setTransform(pixelDichte, 0, 0, pixelDichte, 0, 0);
  ctx.drawImage(dunkelFlaeche, 0, 0);
  ctx.restore();
}

// Zeichnet die Umrisse eines Gegnertyps rund um den Nullpunkt.
// Wer eine neue Form erfinden will, hängt hier einfach einen Fall an.
// Die Eckpunkte einer Form. null bedeutet: das ist ein Kreis.
// Canvas und Startbildschirm greifen beide hierauf zu - eine Quelle, keine Doppelarbeit.
function formPunkte(form, r) {
  if (form === 'pfeil')   return [[r * 1.4, 0], [-r * .9, r * .85], [-r * .35, 0], [-r * .9, -r * .85]];
  if (form === 'raute')   return [[r * 1.35, 0], [0, r * .95], [-r * 1.35, 0], [0, -r * .95]];
  if (form === 'dreieck') return [[r * 1.3, 0], [-r * .8, r], [-r * .8, -r]];
  if (form === 'sechseck' || form === 'stern') {
    const ecken = form === 'stern' ? 10 : 6, punkte = [];
    for (let i = 0; i < ecken; i++) {
      const a = i / ecken * Math.PI * 2;
      const rr = (form === 'stern' && i % 2) ? r * .5 : r;
      punkte.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return punkte;
  }
  return null;
}

// Tarnflecken: Jeder Gegner trägt ein paar große Flecken in den Farben des
// Bodens - so wirkt er, als gehöre er in die Landschaft. Die eigene Farbe
// bleibt sichtbar, sonst könnte man Freund und Feind nicht unterscheiden.
// Damit nicht alle gleich aussehen, bekommt jeder Gegner EINE von drei
// Musterarten und darin nochmal zufällige Formen:
//   klecks - unregelmäßige Kleckse mit ausgefransten Rändern
//   band   - breite Streifen quer über den Körper
//   kante  - eine große Fläche, die eine Seite des Körpers einnimmt
// Alles wird einmal pro Gegner gewürfelt und bleibt dann gleich.
const TARNARTEN = ['klecks', 'klecks', 'band', 'kante'];   // Kleckse etwas häufiger

function tarnfleckenBauen() {
  const art = TARNARTEN[Math.floor(Math.random() * TARNARTEN.length)];
  const liste = [];

  if (art === 'band') {
    const anzahl = 1 + Math.floor(Math.random() * 2);       // 1 oder 2 Streifen
    const grundwinkel = zufall(0, Math.PI);
    for (let i = 0; i < anzahl; i++)
      liste.push({
        w: grundwinkel + zufall(-.5, .5),                   // Richtung des Streifens
        breite: i === 0 ? zufall(.28, .46) : zufall(.22, .36),
        weg: i === 0 ? zufall(-.25, .25) : zufall(-.85, .85),  // Abstand von der Mitte
        hell: Math.random() < .45,
      });

  } else if (art === 'kante') {
    liste.push({
      w: zufall(0, Math.PI * 2),                            // welche Seite
      abstand: zufall(1.12, 1.45),
      groesse: zufall(.90, 1.15),
      hell: Math.random() < .45,
    });
    if (Math.random() < .5)                                 // manchmal ein Klecks dazu
      liste.push({ x: zufall(-.3, .3), y: zufall(-.3, .3), r: zufall(.18, .28),
                   zacken: zackenBauen(), hell: Math.random() < .5 });

  } else {
    const anzahl = 2 + Math.floor(Math.random() * 3);       // 2 bis 4 Kleckse
    let belegt = 0;
    for (let i = 0; i < anzahl; i++) {
      const w = zufall(0, Math.PI * 2), d = zufall(.15, .75);
      const r = zufall(.30, .60);
      // Zusammen dürfen die Kleckse höchstens gut die Hälfte des Körpers
      // bedecken - sonst erkennt man die eigene Farbe des Gegners nicht mehr.
      if (belegt + r * r > .50) break;
      belegt += r * r;
      liste.push({ x: Math.cos(w) * d, y: Math.sin(w) * d, r,
                   zacken: zackenBauen(), hell: Math.random() < .45 });
    }
    if (!liste.length)
      liste.push({ x: 0, y: -.2, r: .4, zacken: zackenBauen(), hell: false });
  }

  return { art, liste };
}

// Ein Klecks ist kein Kreis: Für jede Ecke wird der Radius ein bisschen
// verzogen. Mal 5 Ecken (kantig wie ein Stein), mal 11 (weich wie ein Fleck).
function zackenBauen() {
  const ecken = 5 + Math.floor(Math.random() * 7);
  const z = [];
  for (let i = 0; i < ecken; i++) z.push(zufall(.62, 1.32));
  return z;
}

function kleckspfad(x, y, r, zacken) {
  ctx.beginPath();
  for (let i = 0; i < zacken.length; i++) {
    const w = i / zacken.length * Math.PI * 2;
    const rr = r * zacken[i];
    const px = x + Math.cos(w) * rr, py = y + Math.sin(w) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function tarnfleckenZeichnen(g) {
  if (!g.tarn) g.tarn = tarnfleckenBauen();
  const biom = biomVon(aktuelleKarte && aktuelleKarte.biom);
  const r = g.r;
  ctx.save();
  formZeichnen(g.art.form, r);        // nur innerhalb des Körpers malen
  ctx.clip();
  ctx.globalAlpha = .82;

  for (const f of g.tarn.liste) {
    ctx.fillStyle = f.hell ? biom.boden2 : biom.boden;
    if (f.zacken) {                                   // Klecks
      kleckspfad(f.x * r, f.y * r, f.r * r, f.zacken);
      ctx.fill();
    } else if (f.breite !== undefined) {              // Streifen
      ctx.save();
      ctx.rotate(f.w);
      ctx.fillRect(-r * 1.6, f.weg * r - f.breite * r / 2, r * 3.2, f.breite * r);
      ctx.restore();
    } else {                                          // große Kante
      ctx.beginPath();
      ctx.arc(Math.cos(f.w) * f.abstand * r, Math.sin(f.w) * f.abstand * r,
              f.groesse * r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

function formZeichnen(form, r) {
  const punkte = formPunkte(form, r);
  ctx.beginPath();
  if (!punkte) { ctx.arc(0, 0, r, 0, Math.PI * 2); }
  else {
    ctx.moveTo(punkte[0][0], punkte[0][1]);
    for (let i = 1; i < punkte.length; i++) ctx.lineTo(punkte[i][0], punkte[i][1]);
  }
  ctx.closePath();
}

// Dieselbe Form als kleines Bildchen fürs Menü.
function formSvg(form, farbe, groesse) {
  const m = groesse / 2, r = m - 3, punkte = formPunkte(form, r);
  const inhalt = punkte
    ? `<polygon points="${punkte.map(q => (q[0] + m) + ',' + (q[1] + m)).join(' ')}" fill="${farbe}"/>`
    : `<circle cx="${m}" cy="${m}" r="${r}" fill="${farbe}"/>`;
  return `<svg width="${groesse}" height="${groesse}" viewBox="0 0 ${groesse} ${groesse}">${inhalt}</svg>`;
}

// Großer Lebensbalken oben am Bildschirm, wenn ein Boss lebt.
function bossLeisteZeichnen() {
  const b = gegner.find(g => g.boss && !g.mini);   // Mini-Bosse haben keine große Leiste
  if (!b) return;
  const bb = Math.min(B * 0.45, 520), x = (B - bb) / 2, y = 62;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = '600 17px system-ui, sans-serif';
  ctx.fillText(b.art.name, B / 2, y - 9);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, y, bb, 11);
  ctx.fillStyle = b.art.farbe;
  ctx.fillRect(x, y, bb * Math.max(0, b.leben / b.maxLeben), 11);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, bb - 1, 10);
  ctx.textAlign = 'left';
}

// Kleine Pfeile am Bildschirmrand zeigen, wo Gegner außerhalb des Bildes stehen.
function randmarkerZeichnen() {
  const mx = B / 2, my = H / 2, rand = 26;
  const nurNah = aktuelleKarte && aktuelleKarte.dunkel;
  for (const g of gegner) {
    if (nurNah && Math.hypot(g.x - spieler.x, g.y - spieler.y) > 620) continue;
    const sx = g.x - kamera.x, sy = g.y - kamera.y;
    if (sx > -40 && sx < B + 40 && sy > -40 && sy < H + 40) continue;

    const a = Math.atan2(sy - my, sx - mx);
    const px = grenze(mx + Math.cos(a) * 10000, rand, B - rand);
    const py = grenze(my + Math.sin(a) * 10000, rand, H - rand);
    // auf das Rechteck begrenzen
    const t = Math.min((px - mx) / (Math.cos(a) || 1e-6), (py - my) / (Math.sin(a) || 1e-6));
    const fx = mx + Math.cos(a) * Math.abs(t), fy = my + Math.sin(a) * Math.abs(t);

    ctx.save();
    ctx.translate(grenze(fx, rand, B - rand), grenze(fy, rand, H - rand));
    ctx.rotate(a);
    ctx.globalAlpha = .8;
    ctx.fillStyle = g.art.farbe;
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-7, 6); ctx.lineTo(-7, -6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// Minikarte unten rechts - zeigt die ganze Welt im Kleinformat.
// Die Anzeige im Schießstand: gemessener Schaden, Entfernungen, Ausstieg.
function uebungAnzeigeZeichnen() {
  if (!lauf.uebung) return;
  const w = WAFFEN[lauf.waffe];
  const kb = Math.max(230, Math.min(B - 20, 420)), kx = (B - kb) / 2, ky = 86;
  ctx.fillStyle = 'rgba(8,11,18,.82)';
  ctx.fillRect(kx, ky, kb, 62);
  ctx.strokeStyle = 'rgba(124,255,157,.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(kx + .5, ky + .5, kb - 1, 61);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#cfdcf0';
  ctx.font = '700 16px system-ui, sans-serif';
  ctx.fillText('🎯 ' + w.name, kx + kb / 2, ky + 23);

  ctx.font = '600 13px system-ui, sans-serif';
  ctx.fillStyle = '#7cff9d';
  const gemessen = lauf.uebungLetzte === undefined ? '– wird gemessen –'
